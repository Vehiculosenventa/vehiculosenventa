<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Buscar Vehículo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, 'Open Sans', sans-serif;}
    body {
      background: linear-gradient(135deg, #91b8d5 0%, #7aa7c9 100%);
      padding: 20px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .contenedor {max-width: 620px; margin: 0 auto;}

    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(44, 82, 130, 0.15);
    }
    .zona-izquierda {
      order: 1;
      color: #166534;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .titulo-pagina {
      order: 2;
      font-size: 18px;
      font-weight: 800;
      color: #2c5282;
      text-align: center;
      flex: 1;
    }
    .zona-derecha {
      order: 3;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      text-align: right;
    }
    .zona-derecha:hover {text-decoration: underline;}

    .buscador {
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(44, 82, 130, 0.08);
      margin-bottom: 22px;
      border: 1px solid #bfa980;
    }
    .leyenda {
      text-align: center;
      color: #5a4f3f;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .campo {margin-bottom: 16px;}
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #4a5568;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #c5d6e8;
      border-radius: 10px;
      font-size: 15px;
      background: white;
      transition: all 0.2s;
      color: #4a5568;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.12);
    }
    .boton-buscar {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.15);
    }
    .boton-buscar:hover {
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
      transform: translateY(-1px);
    }

    .contador {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #2c5282;
      margin: 10px 0;
      padding: 8px;
      background: rgba(255,255,255,0.5);
      border-radius: 8px;
    }

    .enlace-favorito {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 18px 0;
      padding: 8px 4px;
      border: none;
      background: transparent;
      transition: all 0.2s;
      justify-content: flex-end;
      width: 100%;
    }
    .enlace-favorito.agregar {
      color: #1d4ed8;
      cursor: pointer;
    }
    .enlace-favorito.agregar:hover {
      color: #1e40af;
      transform: scale(1.03);
    }
    .enlace-favorito.guardado {
      color: #6b7280;
      cursor: default;
      justify-content: flex-end;
    }
    .estrella-amarilla { color: #facc15; font-size: 20px; }
    .estrella-verde { color: #16a34a; font-size: 20px; }

    .boton-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      margin: 12px 0 0 0;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
      transition: all 0.2s;
    }
    .boton-whatsapp:hover {transform: translateY(-2px);}
    .icono-wsp {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #25D366;
      font-weight: bold;
      font-size: 16px;
    }

    .tarjeta {
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(44, 82, 130, 0.08);
      animation: aparecer 0.3s ease;
      margin-bottom: 20px;
      border: 1px solid #bfa980;
      touch-action: pan-y;
      user-select: none;
    }
    @keyframes aparecer {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .etiqueta-tipo {
      display: inline-block;
      background: #ebf4fb;
      color: #2c5282;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 15px;
      font-size: 15px;
    }
    .fotos-titulo {
      margin-top: 0;
      margin-bottom: 12px;
      font-weight: 700;
      color: #2c5282;
      font-size: 15px;
      text-align: center;
    }
    .fotos-cuadricula {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #d4c29c;
    }
    .foto-caja {text-align: center;}
    .foto-ver {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      overflow: hidden;
      background: #ebf4fb;
      border: 2px solid #dceaf5;
      transition: transform 0.2s;
      cursor: pointer;
    }
    .foto-ver:hover {transform: scale(1.05);}
    .foto-ver img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      loading: lazy;
    }

    .titulo-vehiculo {
      font-size: 20px;
      font-weight: 700;
      color: #2c5282;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid #d4c29c;
    }
    .fila {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(90, 79, 63, 0.1);
      color: #5a4f3f;
    }
    .fila strong {color: #1e40af; flex-shrink: 0;}
    .etiqueta {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin: 6px 10px 6px 0;
      font-weight: 600;
    }
    .permuta {background: #e8d9bc; color: #78350f;}
    .contado {background: #b8d8b5; color: #166534;}

    .sin-resultado {
      text-align: center;
      padding: 50px 20px;
      color: #5a4f3f;
      font-size: 17px;
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      border-radius: 16px;
      border: 1px solid #bfa980;
    }
    .volver {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #1e40af;
      text-decoration: none;
      font-weight: 600;
      padding: 12px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 10px;
      transition: all 0.2s;
    }
    .volver:hover {
      background: #d7e6f2;
      text-decoration: none;
    }

    .ventana-foto {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .ventana-foto.mostrar { display: flex; }
    .contenedor-foto-grande {
      position: relative;
      max-width: 95%;
      max-height: 75vh;
    }
    .foto-grande {
      max-width: 100%;
      max-height: 65vh;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .logo-agua-foto {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 100px;
      height: 100px;
      opacity: 0.12;
      pointer-events: none;
      background: url('imágenes/logo.png') center/contain no-repeat;
    }
    .cerrar-foto {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
    }
    .cargando-siguiente {
      text-align: center;
      padding: 20px;
      color: #2c5282;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <div class="barra-superior">
      <div class="zona-izquierda" id="zonaIzquierda">🔄 Verificando...</div>
      <div class="titulo-pagina">🔍 Buscar Vehículo</div>
      <a href="#" class="zona-derecha" id="botonCerrar" onclick="cerrarSesion(); return false;" style="display:none;">Cerrar sesión</a>
    </div>

    <div class="buscador">
      <p class="leyenda">Dejá vacío lo que no querés filtrar ✨</p>

      <div class="campo">
        <label>🚙 Tipo de Vehículo</label>
        <select id="buscar_tipo">
          <option value="">Todos los tipos</option>
          <option value="Auto">🚗 Auto</option>

          <option value="SUV">🏔️ SUV / Crossover</option>
          <option value="Furgón">📦 Furgón / Utilitario</option>

      <div class="campo">
        <label>🏷️ Marca</label>
        <input type="text" id="buscar_marca" placeholder="Ej: Toyota, Ford...">
      </div>
      <div class="campo">
        <label>📋 Modelo</label>
        <input type="text" id="buscar_modelo" placeholder="Ej: Corolla, Fiesta...">
      </div>
      <div class="campo">
        <label>📅 Año</label>
        <input type="number" id="buscar_anio" placeholder="Ej: 2024 — Solo 4 dígitos" min="1900" max="2100" oninput="this.value=this.value.slice(0,4)">
      </div>
      
      <div class="campo">
        <label>🏘️ Ciudad</label>
        <select id="buscar_ciudad">
          <option value="">Todas las ciudades</option>
          <option value="Arroyo Seco">Arroyo Seco</option>
          <option value="Capitán Bermúdez">Capitán Bermúdez</option>
          <option value="Casilda">Casilda</option>
          <option value="Cañada de Gómez">Cañada de Gómez</option>
          <option value="Coronda">Coronda</option>
          <option value="Esperanza">Esperanza</option>
          <option value="Fighiera">Fighiera</option>
          <option value="Fray Luis Beltrán">Fray Luis Beltrán</option>
          <option value="Funes">Funes</option>
          <option value="Gálvez">Gálvez</option>
          <option value="Pueblo Esther">Pueblo Esther</option>
          <option value="Puerto General San Martín">Puerto General San Martín</option>
          <option value="Rafaela">Rafaela</option>
          <option value="Recreo">Recreo</option>
          <option value="Roldán">Roldán</option>
          <option value="San Carlos Centro">San Carlos Centro</option>
          <option value="San Carlos Norte">San Carlos Norte</option>
          <option value="San Carlos Sud">San Carlos Sud</option>
          <option value="San Lorenzo">San Lorenzo</option>
          <option value="Santa Fe">Santa Fe</option>
          <option value="Santo Tomé">Santo Tomé</option>
          <option value="Timbúes">Timbúes</option>
          <option value="Venado Tuerto">Venado Tuerto</option>
          <option value="Villa Constitución">Villa Constitución</option>
          <option value="Zavalla">Zavalla</option>
          <option value="otra">Otra ciudad...</option>
        </select>
      </div>

      <div class="campo">
        <label>⛽ Combustible</label>
        <select id="buscar_combustible">
          <option value="">Todos</option>
          <option value="Nafta">⛽ Nafta</option>
          <option value="Diésel">🛢️ Diésel</option>
          <option value="Eléctrico">⚡ Eléctrico</option>
          <option value="Híbrido">🔋 Híbrido</option>
        </select>
      </div>
      <div class="campo">
        <label>⚙️ Transmisión</label>
        <select id="buscar_transmision">
          <option value="">Todas</option>
          <option value="Manual">⚙️ Manual</option>
          <option value="Automática">🔄 Automática</option>
        </select>
      </div>
      
      <div class="fila" style="display: flex; gap: 15px; flex-wrap: wrap;">
        <div class="campo" style="flex: 1; min-width: 200px;">
          <label>📏 Kilometraje Mínimo</label>
          <input type="number" id="buscar_km_min" placeholder="Ej: 0 — Dejalo vacío sin límite">
        </div>
        <div class="campo" style="flex: 1; min-width: 200px;">
          <label>📏 Kilometraje Máximo</label>
          <input type="number" id="buscar_km_max" placeholder="Ej: 100000 — Dejalo vacío sin límite">
        </div>
      </div>
      
      <div class="fila" style="display: flex; gap: 15px; flex-wrap: wrap;">
        <div class="campo" style="flex: 1; min-width: 200px;">
          <label>💰 Precio Mínimo ($)</label>
          <input type="number" id="buscar_precio_min" placeholder="Ej: 0 — Dejalo vacío sin límite">
        </div>
        <div class="campo" style="flex: 1; min-width: 200px;">
          <label>💰 Precio Máximo ($)</label>
          <input type="number" id="buscar_precio_max" placeholder="Ej: 1500000 — Dejalo vacío sin límite">

      <button class="boton-buscar" onclick="realizarBusqueda()">🔍 Buscar Vehículos</button>

    <div class="contador" id="contador"></div>
    <div id="caja_resultado"></div>
    <a href="index.html" class="volver">← Volver a la página principal</a>

  <div class="ventana-foto" id="ventanaFoto">
    <div class="contenedor-foto-grande">
      <span class="cerrar-foto" id="cerrarFoto">&times;</span>
      <img src="" alt="Foto ampliada" class="foto-grande" id="fotoGrande">
      <div class="logo-agua-foto"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZizndra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const CORREO_ADMIN = "vehiculosenventas@gmail.com";
    const LIMITE_FAVORITOS = 5;
    const CARGA_POR_PAGINA = 1;

    let sbClient = null;
    let idsCoincidentes = [];
    let vehiculosCargados = {};
    let indiceActual = -1;
    let idVehiculoActual = null;
    let telefonoActual = '';
    let idUsuarioActual = null;
    let correoUsuarioActual = null;
    let sesionVerificada = false;
    let cargando = false;

    let xInicio = 0, xFin = 0;
    const UMBRAL_DESLIZAR = 50;
    let bloqueadoDeslizamiento = false;

    const ventanaFoto = document.getElementById('ventanaFoto');
    const fotoGrande = document.getElementById('fotoGrande');
    const cerrarFoto = document.getElementById('cerrarFoto');

    async function getSupabase() {
      if (!sbClient) sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      return sbClient;
    }

    async function verificarSesion() {
      const zonaIzquierda = document.getElementById('zonaIzquierda');
      const botonCerrar = document.getElementById('botonCerrar');
      const sb = await getSupabase();
      
      // Revisar en TODOS los lugares posibles
      const { data: { session } } = await sb.auth.getSession();
      
      // Tomar el correo de donde lo encuentre
      correoUsuarioActual = 
        (session?.user?.email) || 
        localStorage.getItem('correo_usuario') || 
        localStorage.getItem('correo');
      
      if (session || correoUsuarioActual) {
        sesionVerificada = true;
        zonaIzquierda.textContent = "✅ Conectado";
        botonCerrar.style.display = "inline";
        
        // Guardar en localStorage para que siempre lo encuentre
        if (correoUsuarioActual) {
          localStorage.setItem('correo_usuario', correoUsuarioActual);
          try {
            const { data } = await sb.from('usuarios').select('id').eq('correo', correoUsuarioActual).single();
            idUsuarioActual = data?.id || null;
          } catch (e) {
            idUsuarioActual = null;
          }
        }
        return true;
      }
      
      // Ninguna sesión encontrada
      sesionVerificada = false;
      zonaIzquierda.textContent = "";
      botonCerrar.style.display = "none";
      idUsuarioActual = null;
      correoUsuarioActual = null;
      return false;
    }

    async function cerrarSesion() {
      const sb = await getSupabase();
      await sb.auth.signOut();
      localStorage.removeItem('correo_usuario');
      localStorage.removeItem('correo');
      window.location.href = 'index.html';
    }

    async function obtenerCantidadFavoritos() {
      if (!idUsuarioActual) return 0;
      const sb = await getSupabase();
      const { count } = await sb.from('mis_vehiculos').select('*', { count: 'exact', head: true })
        .eq('usuario_id', idUsuarioActual);
      return count || 0;
    }

    function tieneLimiteLibre() {
      return correoUsuarioActual === CORREO_ADMIN;
    }

    async function yaEstaGuardado(vehiculoId) {
      if (!idUsuarioActual || !vehiculoId) return false;
      const sb = await getSupabase();
      const { data } = await sb.from('mis_vehiculos').select('id')
        .eq('usuario_id', idUsuarioActual)
        .eq('vehiculo_id', vehiculoId)
        .maybeSingle();
      return !!data;
    }

    async function agregarFavorito(vehiculoId) {
      // Verificación COMPLETA: revisa todos los casos
      if (!sesionVerificada && !idUsuarioActual && !correoUsuarioActual) {
        alert('🔐 Primero debés iniciar sesión');
        window.location.href = 'iniciar-sesion.html';
        return false;
      }

      if (await yaEstaGuardado(vehiculoId)) {
        alert('⭐ Ya está en tus favoritos');
        return false;
      }

      if (!tieneLimiteLibre()) {
        const cant = await obtenerCantidadFavoritos();
        if (cant >= LIMITE_FAVORITOS) {
          alert(`⚠️ Llegaste al límite de ${LIMITE_FAVORITOS} favoritos.\n\nSi querés guardar más, eliminá uno antes.`);
          return false;
        }
      }

      const sb = await getSupabase();
      const { error } = await sb.from('mis_vehiculos').insert({
        usuario_id: idUsuarioActual,
        vehiculo_id: vehiculoId
      });

      if (error) {
        alert('❌ Error: ' + error.message);
        return false;
      }

      alert('✅ ¡Agregado a Mis Favoritos! ⭐');
      return true;
    }

    function limpiarPrecio(precioTexto) {
      if (!precioTexto) return null;
      const v = parseFloat(String(precioTexto).replace(/[^0-9.,]/g, '').replace(',', '.'));
      return isNaN(v) ? null : v;
    }

    function armarEnlaceWhatsApp(telefono) {
      const msg = encodeURIComponent('Hola, vi tu vehículo publicado en Vehículos en Venta');
      const num = String(telefono || '').replace(/\D/g, '');
      return num ? `https://wa.me/${num}?text=${msg}` : '#';
    }

    function ampliarFoto(src) {
      fotoGrande.src = src;
      ventanaFoto.classList.add('mostrar');
    }

    cerrarFoto.addEventListener('click', () => ventanaFoto.classList.remove('mostrar'));
    ventanaFoto.addEventListener('click', e => e.target === ventanaFoto && ventanaFoto.classList.remove('mostrar'));

    function registrarInicioDeslizamiento(e) {
      xInicio = e.touches ? e.touches[0].clientX : e.clientX;
    }
    function registrarFinDeslizamiento(e) {
      if (bloqueadoDeslizamiento || cargando) return;
      xFin = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const dif = xInicio - xFin;
      if (Math.abs(dif) > UMBRAL_DESLIZAR) {
        bloqueadoDeslizamiento = true;
        dif > 0 ? vehiculoSiguiente() : vehiculoAnterior();
        setTimeout(() => { bloqueadoDeslizamiento = false; }, 300);
      }
    }

    async function cargarVehiculoPorId(id) {
      if (vehiculosCargados[id]) {
        return vehiculosCargados[id];
      }
      const sb = await getSupabase();
      const { data, error } = await sb.from('autos').select('*').eq('id', id).single();
      if (error || !data) return null;
      vehiculosCargados[id] = data;
      return data;
    }

    async function mostrarTarjeta(vehiculo, posicion, total) {
      const caja = document.getElementById('caja_resultado');
      const contador = document.getElementById('contador');

      if (!vehiculo) {
        caja.innerHTML = `<div class="sin-resultado">❌ Vehículo no encontrado</div>`;
        return;
      }

      idVehiculoActual = vehiculo.id;
      telefonoActual = vehiculo.telefono || '';

      const guardado = await yaEstaGuardado(vehiculo.id);

      let fotosHtml = '';
      for (let i = 1; i <= 6; i++) {
        const foto = vehiculo[`foto${i}`];
        if (foto) fotosHtml += `<div class="foto-caja"><div class="foto-ver" onclick="ampliarFoto('${foto}')"><img src="${foto}" alt="" loading="lazy"></div></div>`;
      }
      const hayFotos = fotosHtml !== '';

      const enlaceFavoritoHtml = guardado
        ? `<span class="enlace-favorito guardado"><span class="estrella-verde">✅</span> En Mis Favoritos</span>`
        : `<span class="enlace-favorito agregar" onclick="agregarAFavoritoActual()"><span class="estrella-amarilla">⭐</span> Agregar a Mis Favoritos</span>`;

      const tarjetaHtml = `
        <div class="tarjeta" id="tarjetaDeslizable">
          ${vehiculo.tipo_vehiculo ? `<span class="etiqueta-tipo">${vehiculo.tipo_vehiculo}</span>` : ''}
          
          ${enlaceFavoritoHtml}
          
          ${hayFotos ? `<div class="fotos-titulo">📸 Fotos del vehículo — Tocar para agrandar</div><div class="fotos-cuadricula">${fotosHtml}</div>` : ''}
          
          <div class="titulo-vehiculo">${vehiculo.marca || ''} ${vehiculo.modelo || ''} — ${vehiculo.anio || ''}</div>
          <div class="fila"><strong>Versión:</strong> ${vehiculo.version || '-'}</div>
          <div class="fila"><strong>Ciudad:</strong> ${vehiculo.ciudad || '-'}</div>
          <div class="fila"><strong>Kilometraje:</strong> ${vehiculo.kilometraje ? vehiculo.kilometraje.toLocaleString('es-AR') + ' km' : 'No indicado'}</div>
          <div class="fila"><strong>Combustible:</strong> ${vehiculo.combustible || '-'}</div>
          <div class="fila"><strong>Transmisión:</strong> ${vehiculo.transmision || '-'}</div>
          <div class="fila"><strong>Precio:</strong> ${vehiculo.precio || '-'}</div>
          <div class="fila"><strong>Dueño:</strong> ${vehiculo.dueno || '-'}</div>
          <div class="fila"><strong>Dirección:</strong> ${vehiculo.direccion || '-'}</div>
          <div class="fila"><strong>Teléfono:</strong> ${vehiculo.telefono || '-'}</div>
          <div>${vehiculo.permuta ? '<span class="etiqueta permuta">✅ Acepta permuta</span>' : ''}${vehiculo.contado ? '<span class="etiqueta contado">💵 Solo contado</span>' : ''}</div>
          <div class="fila" style="margin-top: 10px;"><strong>Deuda:</strong> ${vehiculo.deuda || 'Sin deudas'}</div>
          <div class="fila"><strong>Descripción:</strong> ${vehiculo.descripcion || '-'}</div>
          
          <a href="${armarEnlaceWhatsApp(telefonoActual)}" class="boton-whatsapp" target="_blank">
            <span class="icono-wsp">✓</span> ENVIAR MENSAJE POR WHATSAPP
          </a>
        </div>
      `;

      caja.innerHTML = tarjetaHtml;
      contador.textContent = `${posicion + 1} de ${total}`;
      
      setTimeout(() => {
        const t = document.getElementById('tarjetaDeslizable');
        if (t) {
          t.addEventListener('touchstart', registrarInicioDeslizamiento, { passive: true });
          t.addEventListener('touchend', registrarFinDeslizamiento, { passive: true });
          t.addEventListener('mousedown', registrarInicioDeslizamiento);
          t.addEventListener('mouseup', registrarFinDeslizamiento);
        }
      }, 50);
    }

    async function agregarAFavoritoActual() {
      if (idVehiculoActual) {
        const ok = await agregarFavorito(idVehiculoActual);
        if (ok && indiceActual >= 0) {
          const veh = await cargarVehiculoPorId(idsCoincidentes[indiceActual]);
          if (veh) await mostrarTarjeta(veh, indiceActual, idsCoincidentes.length);
        }
      }
    }

    async function vehiculoAnterior() {
      if (!idsCoincidentes.length || cargando) return;
      cargando = true;
      
      indiceActual = indiceActual <= 0 ? idsCoincidentes.length - 1 : indiceActual - 1;
      
      const caja = document.getElementById('caja_resultado');
      caja.innerHTML = `<div class="cargando-siguiente">🔄 Cargando...</div>`;
      
      const veh = await cargarVehiculoPorId(idsCoincidentes[indiceActual]);
      await mostrarTarjeta(veh, indiceActual, idsCoincidentes.length);
      
      cargando = false;
    }

    async function vehiculoSiguiente() {
      if (!idsCoincidentes.length || cargando) return;
      cargando = true;
      
      indiceActual = indiceActual >= idsCoincidentes.length - 1 ? 0 : indiceActual + 1;
      
      const caja = document.getElementById('caja_resultado');
      caja.innerHTML = `<div class="cargando-siguiente">🔄 Cargando...</div>`;
      
      const veh = await cargarVehiculoPorId(idsCoincidentes[indiceActual]);
      await mostrarTarjeta(veh, indiceActual, idsCoincidentes.length);
      
      cargando = false;
    }

    async function realizarBusqueda() {
      const tipo = document.getElementById('buscar_tipo').value;
      const marca = document.getElementById('buscar_marca').value.trim();
      const modelo = document.getElementById('buscar_modelo').value.trim();
      const anio = document.getElementById('buscar_anio').value.trim();
      const ciudad = document.getElementById('buscar_ciudad').value;
      const combustible = document.getElementById('buscar_combustible').value;
      const transmision = document.getElementById('buscar_transmision').value;
      const kmMin = document.getElementById('buscar_km_min').value.trim();
      const kmMax = document.getElementById('buscar_km_max').value.trim();
      const precioMin = document.getElementById('buscar_precio_min').value.trim();
      const precioMax = document.getElementById('buscar_precio_max').value.trim();

      const caja = document.getElementById('caja_resultado');
      const contador = document.getElementById('contador');
      
      caja.innerHTML = `<div style="text-align:center;padding:30px;color:#2c5282;font-weight:600;">🔄 Buscando...</div>`;
      contador.textContent = '';
      
      idsCoincidentes = [];
      vehiculosCargados = {};
      indiceActual = -1;
      idVehiculoActual = null;
      telefonoActual = '';
      cargando = false;

      // Verificar sesión ANTES de todo
      await verificarSesion();

      const sb = await getSupabase();
      let consulta = sb.from('autos').select('id, marca, modelo, anio, ciudad, kilometraje, precio, tipo_vehiculo, combustible, transmision');
      
      if (tipo) consulta = consulta.eq('tipo_vehiculo', tipo);
      if (marca) consulta = consulta.ilike('marca', `%${marca}%`);
      if (modelo) consulta = consulta.ilike('modelo', `%${modelo}%`);
      if (anio && anio.length === 4) { const n = parseInt(anio); if (!isNaN(n)) consulta = consulta.eq('anio', n); }
      if (ciudad && ciudad !== 'otra') consulta = consulta.eq('ciudad', ciudad);
      if (combustible) consulta = consulta.eq('combustible', combustible);
      if (transmision) consulta = consulta.eq('transmision', transmision);
      
      consulta = consulta.order('id', { ascending: false });
      
      const { data, error } = await consulta;
      
      if (error) { 
        caja.innerHTML = `<div class="sin-resultado">❌ Error: ${error.message}</div>`; 
        return; 
      }
      if (!data || !data.length) { 
        caja.innerHTML = `<div class="sin-resultado">📭 No se encontraron vehículos</div>`; 
        return; 
      }

      let resultadosFiltrados = data;
      if (kmMin) { const n = parseInt(kmMin); if (!isNaN(n)) resultadosFiltrados = resultadosFiltrados.filter(a => a.kilometraje !== null && a.kilometraje >= n); }
      if (kmMax) { const n = parseInt(kmMax); if (!isNaN(n)) resultadosFiltrados = resultadosFiltrados.filter(a => a.kilometraje === null || a.kilometraje <= n); }
      if (precioMin) { const n = limpiarPrecio(precioMin); if (n !== null) resultadosFiltrados = resultadosFiltrados.filter(a => { const v = limpiarPrecio(a.precio); return v === null || v >= n; }); }
      if (precioMax) { const n = limpiarPrecio(precioMax); if (n !== null) resultadosFiltrados = resultadosFiltrados.filter(a => { const v = limpiarPrecio(a.precio); return v === null || v <= n; }); }
      
      if (!resultadosFiltrados.length) { 
        caja.innerHTML = `<div class="sin-resultado">📭 Ningún vehículo cumple con los filtros</div>`; 
        return; 
      }

      idsCoincidentes = resultadosFiltrados.map(a => a.id);
      
      indiceActual = 0;
      const primerVehiculo = await cargarVehiculoPorId(idsCoincidentes[0]);
      await mostrarTarjeta(primerVehiculo, 0, idsCoincidentes.length);
    }

    async function iniciar() {
      await verificarSesion();
      await getSupabase();
    }
    iniciar();
  </script>
</body>
</html>
