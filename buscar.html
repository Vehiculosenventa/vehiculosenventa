<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar Vehículo — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #94b8d9 0%, #7aa7c9 100%);
      padding: 20px;
      max-width: 850px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      color: #1a365d;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 800;
    }
    .form-container {
      background: #e8dcc8;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(26, 54, 93, 0.15);
      border: 2px solid #d4b996;
    }
    .fila { display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo { flex: 1 1 45%; min-width: 160px; }
    .campo-completo { flex: 1 1 100%; margin-bottom: 18px; }
    .etiqueta-linea {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }
    .etiqueta-linea label {
      font-weight: 600;
      color: #1a365d;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #94b8d9;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #2d3748;
    }
    input:disabled, select:disabled, textarea:disabled {
      background: #d9d9d9;
      color: #666;
      cursor: not-allowed;
      border-color: #b8b8b8;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2b6cb0;
    }
    .fila-chk { display: flex; gap: 30px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo-chk { display: flex; align-items: center; gap: 8px; }
    .campo-chk input { width: auto; margin: 0; }
    .boton {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #2b6cb0, #2c5282);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .boton:disabled { background: #8898aa; cursor: not-allowed; }
    
    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .aviso-sesion {
      padding: 12px; border-radius: 10px; font-weight: 600;
      flex: 1; text-align: center;
    }
    .conectado { background: #c6f6d5; color: #1c4532; border: 1px solid #9ae6b4; }
    .no-conectado { background: #fef5e7; color: #744210; border: 1px solid #fdeaa8; }
    .enlace-cerrar-sesion {
      color: #2b6cb0;
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      padding: 10px 0 10px 15px;
      white-space: nowrap;
    }
    .enlace-cerrar-sesion:hover { color: #2c5282; }
    
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 600;
    }
    .exito { background: #e6ffea; color: #22543d; border: 2px solid #9ae6b4; }
    .error { background: #fff5f5; color: #c53030; border: 2px solid #feb2b2; }
    .volver {
      display: inline-block;
      margin-top: 22px;
      color: #2b6cb0;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 18px;
      background: rgba(255,255,255,0.7);
      border-radius: 10px;
    }
    .foto-seccion { margin: 28px 0 15px; }
    .foto-titulo-seccion {
      font-size: 19px;
      font-weight: 700;
      color: #1a365d;
      margin-bottom: 20px;
    }
    .foto-tarjeta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      margin-bottom: 12px;
      background: #fff;
      border-radius: 14px;
      border: 2px solid #94b8d9;
      cursor: pointer;
    }
    .foto-tarjeta.disabled { opacity: 0.6; pointer-events: none; }
    .foto-nombre {
      font-weight: 700;
      font-size: 15px;
      color: #1a365d;
      flex: 1;
    }
    .icono-camara { font-size: 20px; flex-shrink: 0; }
    .foto-mini {

      border-radius: 10px;
      overflow: hidden;
      background: #f0f4f8;
      border: 2px dashed #a0aec0;
      display: flex;

      justify-content: center;

    }
    .foto-mini-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .foto-sin { font-size: 11px; color: #718096; }
    .foto-input-oculto { display: none; }
    .botones-sesion {
      display: flex;

      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: nowrap;

    .boton-sesion {

    .oculto { display: none !important; }

</head>

  <script>            
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZizndra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const selectCiudad = document.getElementById('ciudad');
    const bloqueOtraCiudad = document.getElementById('bloqueOtraCiudad');

    function setFormDisabled(desactivar) {
      const campos = document.querySelectorAll('input, select, textarea, button[type="submit"]');
      campos.forEach(campo => campo.disabled = desactivar);
      
      if (!desactivar && selectCiudad.value === 'otra') {
        document.getElementById('ciudad_otra').disabled = false;
      }
      
      for (let i = 1; i <= 8; i++) {
        const tarjeta = document.getElementById(`foto_tarjeta_${i}`);
        if (tarjeta) {
          desactivar ? tarjeta.classList.add('disabled') : tarjeta.classList.remove('disabled');
        }
      }
    }

    function verFoto(numero, input) {
      const img = document.getElementById(`img${numero}`);
      const sin = document.getElementById(`sin${numero}`);
      if (input.files && input.files[0]) {
        const lector = new FileReader();
        lector.onload = e => {
          img.src = e.target.result;
          img.style.display = 'block';
          sin.style.display = 'none';
        };
        lector.readAsDataURL(input.files[0]);
      }
    }

    function archivoABase64(archivo) {
      return new Promise(resolver => {
        const lector = new FileReader();
        lector.onload = e => resolver(e.target.result);
        lector.readAsDataURL(archivo);
      });
    }

    selectCiudad.addEventListener('change', () => {
      if (selectCiudad.value === 'otra') {
        bloqueOtraCiudad.classList.remove('oculto');
        document.getElementById('ciudad_otra').disabled = false;
      } else {
        bloqueOtraCiudad.classList.add('oculto');
        document.getElementById('ciudad_otra').value = '';
        document.getElementById('ciudad_otra').disabled = true;
      }
    });

    async function verificarSesion() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session) {
          document.getElementById('cargando').classList.add('oculto');
          document.getElementById('bloqueNoConectado').classList.add('oculto');
          document.getElementById('bloqueConectado').classList.remove('oculto');
          setFormDisabled(false);

          for (let i = 1; i <= 8; i++) {
            const input = document.getElementById(`foto${i}`);
            if (input) input.addEventListener('change', e => verFoto(i, e.target));
          }
        } else {
          document.getElementById('cargando').classList.add('oculto');
          document.getElementById('bloqueNoConectado').classList.remove('oculto');
        }

        supabaseClient.auth.onAuthStateChange(async (_, nuevaSesion) => {
          if (nuevaSesion) {
            document.getElementById('bloqueNoConectado').classList.add('oculto');
            document.getElementById('bloqueConectado').classList.remove('oculto');
            setFormDisabled(false);

            for (let i = 1; i <= 8; i++) {
              const input = document.getElementById(`foto${i}`);
              if (input) input.addEventListener('change', e => verFoto(i, e.target));
            }
          }
        });
        
      } catch (error) {
        console.error("Error:", error);
        document.getElementById('cargando').classList.add('oculto');
        document.getElementById('bloqueNoConectado').classList.remove('oculto');
      }
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function guardarVehiculo(e) {
      e.preventDefault();
      
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const boton = document.getElementById('btnGuardar');
      const cajaMensaje = document.getElementById('mensaje');
      
      boton.disabled = true;
      boton.textContent = "Guardando...";
      cajaMensaje.style.display = "none";

      try {
        const fotos = {};
        for (let i = 1; i <= 8; i++) {
          const input = document.getElementById(`foto${i}`);
          fotos[`foto${i}`] = input.files[0] ? await archivoABase64(input.files[0]) : null;
        }

        let tipoVehiculoValor = document.getElementById('tipo_vehiculo').value || null;
        // ✅ Quité la línea que borraba el texto y dejaba vacío
        // Ahora guarda el valor completo tal cual está
        
        let ciudadValor;
        if (selectCiudad.value === 'otra') {
          ciudadValor = document.getElementById('ciudad_otra').value.trim();
          if (!ciudadValor) {
            throw new Error("Escribí tu ciudad en el campo que apareció");
          }
        } else {
          ciudadValor = selectCiudad.value || null;
        }

        const datos = {
          tipo_vehiculo: tipoVehiculoValor,
          marca: document.getElementById('marca').value || null,
          modelo: document.getElementById('modelo').value || null,
          version: document.getElementById('version').value || null,
          combustible: document.getElementById('combustible').value || null,
          anio: parseInt(document.getElementById('anio').value) || null,
          transmision: document.getElementById('transmision').value || null,
          kilometraje: parseInt(document.getElementById('kilometraje').value) || null,
          precio: parseInt(document.getElementById('precio').value) || null,
          dueno: document.getElementById('dueno').value || null,
          direccion: document.getElementById('direccion').value || null,
          ciudad: ciudadValor,
          telefono: document.getElementById('telefono').value || null,
          permuta: document.getElementById('permuta').checked,
          contado: document.getElementById('contado').checked,
          deuda: document.getElementById('deuda').value || null,
          descripcion: document.getElementById('descripcion').value || null,
          usuario_id: session.user.id,
          correo_usuario: session.user.email,
          nombre_usuario: session.user.user_metadata?.name || null,
          contador: 0,
          ...fotos
        };

        const { error } = await supabaseClient.from('autos').insert([datos]);
        
        if (error) throw error;

        cajaMensaje.textContent = "✅ Vehículo guardado correctamente";
        cajaMensaje.className = "mensaje exito";
        cajaMensaje.style.display = "block";
        document.getElementById('formAuto').reset();
        bloqueOtraCiudad.classList.add('oculto');
        
        for (let i = 1; i <= 8; i++) {
          const img = document.getElementById(`img${i}`);
          const sin = document.getElementById(`sin${i}`);
          if (img) img.style.display = 'none';
          if (sin) sin.style.display = 'block';
        }
        
      } catch (error) {
        console.error("Error:", error);
        cajaMensaje.textContent = "❌ Error: " + error.message;
        cajaMensaje.className = "mensaje error";
        cajaMensaje.style.display = "block";
      } finally {
        boton.disabled = false;
        boton.textContent = "💾 Guardar Vehículo";
      }
    }

    document.getElementById('btn-cerrar-sesion').addEventListener('click', cerrarSesion);
    document.getElementById('formAuto').addEventListener('submit', guardarVehiculo);
    
    verificarSesion();
  </script>

</body>
</html>
