<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Buscar Vehículo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #91b8d5 0%, #7aa7c9 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .contenedor {max-width: 620px; margin: 0 auto;}

    .titulo-pagina {
      font-size: 26px;
      font-weight: 800;
      color: #2c5282;
      text-align: center;
      margin-bottom: 18px;
      margin-top: 10px;
    }

    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(44, 82, 130, 0.15);
      min-height: 48px;
    }

    .texto-conectado {
      color: #15803d;
      font-weight: 600;
      font-size: 15px;
    }

    .boton-azul {
      display: inline-block;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
    }
    .boton-azul:hover {
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
    }

    .olvido {
      width: 100%;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 15px;
      display: none;
    }
    .olvido a {
      color: #4a5568;
      text-decoration: none;
      font-size: 14px;
    }
    .olvido a:hover {
      color: #1565C0;
      text-decoration: underline;
    }

    .buscador {
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      padding: 28px;
      border-radius: 18px;
      margin-bottom: 22px;
      border: 1px solid #bfa980;
    }
    .leyenda {
      text-align: center;
      color: #5a4f3f;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .campo {margin-bottom: 16px;}
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #4a5568;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #c5d6e8;
      border-radius: 10px;
      font-size: 15px;
      background: white;
      color: #4a5568;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3182ce;
    }
    .boton-buscar {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .boton-buscar:hover {
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
    }

    .zona-tarjeta {
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }
    .contenedor-tarjetas {
      display: flex;
      transition: transform 0.3s ease-out;
    }
    .tarjeta {
      flex: 0 0 100%;
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #bfa980;
    }
    .encabezado-tarjeta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .fila-botones {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .boton-favorito-tarjeta {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }
    .estrella {
      font-size: 22px;
      color: #facc15;
    }
    .texto-favorito {
      font-size: 14px;
      font-weight: 600;
      color: #2563eb;
    }
    .boton-favorito-tarjeta:disabled .texto-favorito {
      color: #9ca3af;
      cursor: not-allowed;
    }
    .boton-favorito-tarjeta:disabled .estrella {
      opacity: 0.5;
    }

    /* ✅ BOTÓN REDONDO DE WHATSAPP - SOLO LOGO, EN LÍNEA */
    .boton-wsp-redondo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      background: #25D366;
      border-radius: 50%;
      color: white;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 211, 102, 0.4);
      flex-shrink: 0;
    }
    .boton-wsp-redondo:hover {
      background: #1fb959;
    }
    .boton-wsp-redondo svg {
      width: 26px;
      height: 26px;
      fill: white;
      display: block;
    }

    .etiqueta-tipo {
      display: inline-block;
      background: #ebf4fb;
      color: #2c5282;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      font-size: 15px;
    }
    .titulo-vehiculo {
      font-size: 20px;
      font-weight: 700;
      color: #2c5282;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #d4c29c;
    }
    .fila {
      margin-bottom: 10px;
      color: #5a4f3f;
      line-height: 1.6;
    }
    .fila strong {
      color: #1e40af;
      min-width: 130px;
      display: inline-block;
    }
    .etiqueta {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin: 6px 10px 6px 0;
      font-weight: 600;
    }
    .permuta {background: #e8d9bc; color: #78350f;}
    .contado {background: #b8d8b5; color: #166534;}

    .cargando {
      text-align: center;
      padding: 50px 20px;
      color: #5a6872;
      font-size: 17px;
    }
    .sin-resultado {
      text-align: center;
      padding: 50px 20px;
      color: #5a4f3f;
      font-size: 17px;
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      border-radius: 16px;
      border: 1px solid #bfa980;
    }
    .volver {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #1e40af;
      text-decoration: none;
      font-weight: 600;
      padding: 12px;
      background: rgba(255,255,255,0.6);
      border-radius: 10px;
    }
    .volver:hover {
      background: #d7e6f2;
    }

    .aviso-limite {
      background: #fef3c7;
      color: #92400e;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .aviso-limite.mostrar {display: block;}

    .caja-codigo {
      background: #f0f7ff;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
      border: 2px solid #bfdbfe;
      display: none;
    }
    .caja-codigo.mostrar {display: block;}
    .caja-codigo h3 {
      color: #1e40af;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .input-codigo {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      border: 2px solid #93c5fd;
      border-radius: 10px;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .boton-guardar {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .boton-cancelar {
      background: #e5e7eb;
      color: #4b5563;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 10px;
      cursor: pointer;
      width: 100%;
    }

    .fotos-titulo {display: none;}
    .fotos-cuadricula {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .foto-caja {text-align: center;}
    .foto-ver {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      overflow: hidden;
      background: #ebf4fb;
      border: 2px solid #dceaf5;
      cursor: pointer;
    }
    .foto-ver img {width: 100%; height: 100%; object-fit: cover;}
    .foto-nombre {display: none;}

    .ventana-foto {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #91b8d5 0%, #7aa7c9 100%);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .ventana-foto.mostrar { display: flex; }
    .contenedor-foto-grande {
      position: relative;
      max-width: 95%;
      max-height: 90vh;
      touch-action: pan-y;
      user-select: none;
    }
    .foto-grande {
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
    }

    .logo-agua-foto {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 100px;
      height: 100px;
      opacity: 0.12;
      pointer-events: none;
      background: url('imágenes/logo.png') center/contain no-repeat;
    }
    .cerrar-foto {
      position: absolute;
      top: -40px;
      right: 0;
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
    }
    .indicador-foto {
      color: #2c5282;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      font-weight: 600;
    }
    /* ✅ Botón WhatsApp en foto ampliada - Arriba Izquierda */
    .boton-wsp-foto-grande {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
    }
  </style>
</head>

<script>
const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

const CORREO_SIN_LIMITE = 'misvehiculosenventa@gmail.com';
const LIMITE_FAVORITOS = 5;

let sbClient = null;
let idsFiltrados = [];
let indiceActual = 0;
let idVehiculoActual = null;
let telefonoActual = '';
let fotosVehiculoActual = [];
let indiceFotoActual = 0;
let inicioX = 0;
let finX = 0;

async function getSupabase() {
  if (!sbClient) sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return sbClient;
}

function verificarSesion() {
  let correo = null;
  let nombre = null;
  let usuario_id = null;

  for (let i = 0; i < localStorage.length; i++) {
    const clave = localStorage.key(i);
    const valor = localStorage.getItem(clave);
    const claveMin = clave.toLowerCase();
    if (!correo && (claveMin.includes('correo') || claveMin.includes('email'))) {
      correo = valor;
    }
    if (!nombre && (claveMin.includes('nombre') || claveMin.includes('usuario_nombre'))) {
      nombre = valor;
    }
    if (!usuario_id && (claveMin.includes('id') || claveMin.includes('user_id'))) {
      usuario_id = valor;
    }
  }

  const ladoIzquierdo = document.getElementById('ladoIzquierdo');
  const ladoDerecho = document.getElementById('ladoDerecho');

  if (correo) {
    const nombreMostrar = nombre || correo.split('@')[0];
    ladoIzquierdo.innerHTML = `<span class="texto-conectado">${nombreMostrar} — Conectado</span>`;
    ladoDerecho.innerHTML = `<button class="boton-azul" onclick="cerrarSesion()">Cerrar sesión</button>`;
  } else {
    ladoIzquierdo.innerHTML = '';
    ladoDerecho.innerHTML = '';
  }
}

function cerrarSesion() {
  localStorage.clear();
  window.location.href = 'cerrar-secion.html';
}

async function obtenerUsuarioId(correo) {
  if (!correo) return null;
  const sb = await getSupabase();
  const { data } = await sb.from('usuarios').select('id').eq('correo', correo).single();
  return data?.id || null;
}

async function contarFavoritos(usuario_id) {
  if (!usuario_id) return 0;
  const sb = await getSupabase();
  const { count } = await sb.from('mis_vehiculos', { count: 'exact', head: true })
    .select('*').eq('usuario_id', usuario_id);
  return count || 0;
}

function tieneLimiteLibre() {
  const correo = 
    localStorage.getItem('correo_usuario') || 
    localStorage.getItem('correo') || 
    localStorage.getItem('email');
  return correo === CORREO_SIN_LIMITE;
}

async function verificarLimiteFavoritos() {
  const correo = 
    localStorage.getItem('correo_usuario') || 
    localStorage.getItem('correo') || 
    localStorage.getItem('email');
  if (!correo) return true;
  if (tieneLimiteLibre()) return true;

  const usuario_id = await obtenerUsuarioId(correo);
  const cantidad = await contarFavoritos(usuario_id);
  
  const aviso = document.getElementById('avisoLimite');
  const boton = document.querySelector('.boton-favorito-tarjeta');
  
  if (cantidad >= LIMITE_FAVORITOS) {
    aviso.classList.add('mostrar');
    if (boton) boton.disabled = true;
    return false;
  } else {
    aviso.classList.remove('mostrar');
    if (boton) boton.disabled = false;
    return true;
  }
}

function limpiarPrecio(precioTexto) {
  if (!precioTexto) return null;
  const valor = parseFloat(String(precioTexto).replace(/[^0-9.,]/g, '').replace(',', '.'));
  return isNaN(valor) ? null : valor;
}

function cerrarFoto() {
  document.getElementById('ventanaFoto').classList.remove('mostrar');
}

function fotoAnterior() {
  if (indiceFotoActual > 0) {
    indiceFotoActual--;
    mostrarFotoActual();
  }
}

function fotoSiguiente() {
  if (indiceFotoActual < fotosVehiculoActual.length - 1) {
    indiceFotoActual++;
    mostrarFotoActual();
  }
}

function mostrarFotoActual() {
  document.getElementById('fotoGrande').src = fotosVehiculoActual[indiceFotoActual];
  document.getElementById('indicadorFoto').textContent = `${indiceFotoActual + 1} / ${fotosVehiculoActual.length}`;
}

function abrirFoto(fotos, indice, telefono) {
  fotosVehiculoActual = fotos;
  indiceFotoActual = indice;
  telefonoActual = telefono || '';
  
  // Actualizar enlace de WhatsApp en foto ampliada
  const mensajeWsp = encodeURIComponent(`Hola, vi tu vehículo y quisiera saber por él. Quedo atento, gracias!`);
  const botonWspFoto = document.getElementById('botonWspFoto');
  if (telefonoActual) {
    botonWspFoto.href = `https://wa.me/549${telefonoActual}?text=${mensajeWsp}`;
  } else {
    botonWspFoto.href = `https://wa.me/?text=${mensajeWsp}`;
  }
  
  document.getElementById('ventanaFoto').classList.add('mostrar');
  mostrarFotoActual();
}

document.getElementById('contenedorFotoGrande').addEventListener('touchstart', e => {
  inicioX = e.touches[0].clientX;
});
document.getElementById('contenedorFotoGrande').addEventListener('touchend', e => {
  const diferencia = inicioX - e.changedTouches[0].clientX;
  if (Math.abs(diferencia) > 50) diferencia > 0 ? fotoSiguiente() : fotoAnterior();
});

function mostrarCajaCodigo() {
  verificarLimiteFavoritos().then(puede => {
    if (!puede) {
      alert(`⚠️ Llegaste al límite de ${LIMITE_FAVORITOS} favoritos. Eliminá uno para agregar otro.`);
      return;
    }
    const correo = 
      localStorage.getItem('correo_usuario') || 
      localStorage.getItem('correo') || 
      localStorage.getItem('email');
    if (!correo) {
      alert('🔐 Primero entrá desde la página principal');
      return;
    }
    document.getElementById('cajaCodigo').classList.add('mostrar');
  });
}

function ocultarCajaCodigo() {
  document.getElementById('cajaCodigo').classList.remove('mostrar');
}

async function guardarConCodigo() {
  const codigo = document.getElementById('codigoIngresado').value.trim();
  if (!codigo || codigo.length < 6) { alert('⚠️ El código debe tener 6 caracteres'); return; }
  if (!idVehiculoActual) { alert('⚠️ No hay vehículo seleccionado'); return; }

  const correo = 
    localStorage.getItem('correo_usuario') || 
    localStorage.getItem('correo') || 
    localStorage.getItem('email');
  const usuario_id = await obtenerUsuarioId(correo);
  if (!usuario_id) { alert('❌ No se encontró tu cuenta'); return; }

  if (!tieneLimiteLibre()) {
    const cantidad = await contarFavoritos(usuario_id);
    if (cantidad >= LIMITE_FAVORITOS) {
      alert(`⚠️ Llegaste al límite de ${LIMITE_FAVORITOS} favoritos.`);
      return;
    }
  }

  const sb = await getSupabase();
  const { data: existe } = await sb.from('mis_vehiculos')
    .select('id').eq('usuario_id', usuario_id).eq('vehiculo_id', idVehiculoActual).maybeSingle();

  if (existe) { alert('ℹ️ Ya está en "Mis Vehículos"'); ocultarCajaCodigo(); return; }

  const { error } = await sb.from('mis_vehiculos').insert({ usuario_id, vehiculo_id: idVehiculoActual });
  if (error) { alert('❌ Error: ' + error.message); return; }

  alert('✅ ¡Agregado correctamente! 🎉');
  ocultarCajaCodigo();
  verificarLimiteFavoritos();
}

async function realizarBusqueda() {
  const tipo = document.getElementById('buscar_tipo').value;
  const marca = document.getElementById('buscar_marca').value.trim();
  const modelo = document.getElementById('buscar_modelo').value.trim();
  const anio = document.getElementById('buscar_anio').value.trim();
  const ciudad = document.getElementById('buscar_ciudad').value;
  const combustible = document.getElementById('buscar_combustible').value;
  const transmision = document.getElementById('buscar_transmision').value;
  const kmMin = document.getElementById('buscar_km_min').value.trim();
  const kmMax = document.getElementById('buscar_km_max').value.trim();
  const precioMin = document.getElementById('buscar_precio_min').value.trim();
  const precioMax = document.getElementById('buscar_precio_max').value.trim();

  const caja = document.getElementById('caja_resultado');
  caja.innerHTML = `<div class="cargando">🔄 Buscando vehículos...</div>`;
  idsFiltrados = [];
  indiceActual = 0;
  idVehiculoActual = null;

  const sb = await getSupabase();
  let consulta = sb.from('autos').select('id, tipo_vehiculo, marca, modelo, anio, version, ciudad, kilometraje, combustible, transmision, precio, telefono, permuta, contado, foto1, foto2, foto3, foto4, foto5, foto6');

  if (tipo) consulta = consulta.eq('tipo_vehiculo', tipo);
  if (marca) consulta = consulta.ilike('marca', `%${marca}%`);
  if (modelo) consulta = consulta.ilike('modelo', `%${modelo}%`);
  if (anio.length === 4) { const num = parseInt(anio); if (!isNaN(num)) consulta = consulta.eq('anio', num); }
  if (ciudad && ciudad !== 'otra') consulta = consulta.eq('ciudad', ciudad);
  if (combustible) consulta = consulta.eq('combustible', combustible);
  if (transmision) consulta = consulta.eq('transmision', transmision);

  consulta = consulta.order('id', { ascending: false });
  const { data, error } = await consulta;

  if (error) { caja.innerHTML = `<div class="sin-resultado">❌ Error: ${error.message}</div>`; return; }
  if (!data || !data.length) { caja.innerHTML = `<div class="sin-resultado">📭 No se encontraron vehículos</div>`; return; }

  let resultados = data;
  if (kmMin) { const n = parseInt(kmMin); if (!isNaN(n)) resultados = resultados.filter(v => v.kilometraje >= n); }
  if (kmMax) { const n = parseInt(kmMax); if (!isNaN(n)) resultados = resultados.filter(v => v.kilometraje === null || v.kilometraje <= n); }
  if (precioMin) { const n = parseFloat(precioMin); if (!isNaN(n)) resultados = resultados.filter(v => { const val = limpiarPrecio(v.precio); return val === null || val >= n; }); }
  if (precioMax) { const n = parseFloat(precioMax); if (!isNaN(n)) resultados = resultados.filter(v => { const val = limpiarPrecio(v.precio); return val === null || val <= n; }); }

  if (!resultados.length) { caja.innerHTML = `<div class="sin-resultado">📭 Ningún vehículo cumple con los filtros</div>`; return; }

  idsFiltrados = resultados.map(v => v.id);
  await cargarUno(0);
}
