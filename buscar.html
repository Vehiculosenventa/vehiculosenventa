<!DOCTYPE html>
<html lang="es">

    .ventana-foto {

<body>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    let sbClient = null;
    let idsFiltrados = [];
    let indiceActual = 0;
    let idVehiculoActual = null;
    let telefonoActual = '';
    let idUsuarioActual = null;

    let xInicio = 0, xFin = 0;
    const UMBRAL_DESLIZAR = 50;
    let bloqueadoDeslizamiento = false;

    const ventanaFoto = document.getElementById('ventanaFoto');
    const fotoGrande = document.getElementById('fotoGrande');
    const cerrarFoto = document.getElementById('cerrarFoto');

    async function getSupabase() {
      if (!sbClient) sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      return sbClient;
    }

    async function verificarSesion() {
      const zonaUsuario = document.getElementById('zonaUsuario');
      const sb = await getSupabase();
      const { data: { session } } = await sb.auth.getSession();
      
      if (session) {
        localStorage.setItem('correo_usuario', session.user.email || 'conectado');
        localStorage.setItem('nombre_usuario', session.user.user_metadata?.nombre || 'Usuario');
        zonaUsuario.innerHTML = `
          <a href="mis-vehiculos.html" class="texto-favoritos">⭐ Mis Vehículos</a>
          <span class="texto-conectado">✅ Conectado</span>
          <a class="texto-cerrar" href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a>
        `;
        return true;
      }
      
      const correo = localStorage.getItem('correo_usuario');
      const nombre = localStorage.getItem('nombre_usuario');
      if (correo && nombre) {
        zonaUsuario.innerHTML = `
          <a href="mis-vehiculos.html" class="texto-favoritos">⭐ Mis Vehículos</a>
          <span class="texto-conectado">✅ Conectado</span>
          <a class="texto-cerrar" href="#" onclick="cerrarSesion(); return false;">Cerrar sesión</a>
        `;
        return true;
      }
      
      zonaUsuario.innerHTML = `
        <a href="iniciar-sesion.html" class="btn-sesion btn-iniciar">🔑 Iniciar sesión</a>
        <a href="registrarse.html" class="btn-sesion btn-registrar">✨ Registrarse</a>
      `;
      return false;
    }

    async function cerrarSesion() {
      const sb = await getSupabase();
      await sb.auth.signOut();
      localStorage.clear();
      window.location.href = 'index.html';
    }

    async function obtenerUsuarioId(correo) {
      if (!correo) return null;
      const sb = await getSupabase();
      const { data } = await sb.from('usuarios').select('id').eq('correo', correo).single();
      return data?.id || null;
    }

    async function yaEstaGuardado(vehiculoId) {
      if (!idUsuarioActual || !vehiculoId) return false;
      const sb = await getSupabase();
      const { data } = await sb.from('mis_vehiculos').select('id')
        .eq('usuario_id', idUsuarioActual)
        .eq('vehiculo_id', vehiculoId)
        .maybeSingle();
      return !!data;
    }

    function limpiarPrecio(precioTexto) {
      if (!precioTexto) return null;
      const v = parseFloat(String(precioTexto).replace(/[^0-9.,]/g, '').replace(',', '.'));
      return isNaN(v) ? null : v;
    }

    async function mostrarCajaCodigo() {
      const tieneSesion = await verificarSesion();
      if (!tieneSesion) {
        alert('🔐 Primero debés entrar con tu cuenta');
        window.location.href = 'iniciar-sesion.html';
        return;
      }
      document.getElementById('cajaCodigo').classList.add('mostrar');
      document.getElementById('codigoIngresado').value = '';
      document.getElementById('codigoIngresado').focus();
    }

    function ocultarCajaCodigo() {
      document.getElementById('cajaCodigo').classList.remove('mostrar');
    }

    async function guardarConCodigo() {
      const codigo = document.getElementById('codigoIngresado').value.trim();
      if (!codigo || codigo.length < 6) { alert('⚠️ El código debe tener 6 caracteres'); return; }
      if (!idVehiculoActual) { alert('⚠️ No hay vehículo seleccionado'); return; }

      const correo = localStorage.getItem('correo_usuario');
      const usuario_id = await obtenerUsuarioId(correo);
      if (!usuario_id) { alert('❌ No se encontró tu cuenta'); return; }

      const sb = await getSupabase();
      const { data: existe } = await sb.from('mis_vehiculos').select('id')
        .eq('usuario_id', usuario_id).eq('vehiculo_id', idVehiculoActual).maybeSingle();
      
      if (existe) { alert('⭐ Ya está guardado en "Mis Vehículos"'); ocultarCajaCodigo(); return; }

      const { error } = await sb.from('mis_vehiculos').insert({ usuario_id, vehiculo_id: idVehiculoActual });
      if (error) { alert('❌ Error: ' + error.message); return; }
      
      alert('✅ ¡Agregado a "Mis Vehículos"! ⭐🎉');
      ocultarCajaCodigo();
      await cargarUno(indiceActual);
    }

    function armarEnlaceWhatsApp(telefono) {
      const msg = encodeURIComponent('Hola, vi tu vehículo publicado en Mis Vehículos en Venta');
      const num = String(telefono || '').replace(/\D/g, '');
      return num ? `https://wa.me/${num}?text=${msg}` : '#';
    }

    function ampliarFoto(src) {
      fotoGrande.src = src;
      ventanaFoto.classList.add('mostrar');
    }

    cerrarFoto.addEventListener('click', () => ventanaFoto.classList.remove('mostrar'));
    ventanaFoto.addEventListener('click', e => e.target === ventanaFoto && ventanaFoto.classList.remove('mostrar'));

    function registrarInicioDeslizamiento(e) {
      xInicio = e.touches ? e.touches[0].clientX : e.clientX;
    }
    function registrarFinDeslizamiento(e) {
      if (bloqueadoDeslizamiento) return;
      xFin = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const dif = xInicio - xFin;
      if (Math.abs(dif) > UMBRAL_DESLIZAR) {
        bloqueadoDeslizamiento = true;
        dif > 0 ? vehiculoSiguiente() : vehiculoAnterior();
        setTimeout(() => { bloqueadoDeslizamiento = false; }, 300);
      }
    }

    async function realizarBusqueda() {
      const tipo = document.getElementById('buscar_tipo').value;
      const marca = document.getElementById('buscar_marca').value.trim();
      const modelo = document.getElementById('buscar_modelo').value.trim();
      const anio = document.getElementById('buscar_anio').value.trim();
      const ciudad = document.getElementById('buscar_ciudad').value;
      const combustible = document.getElementById('buscar_combustible').value;
      const transmision = document.getElementById('buscar_transmision').value;
      const kmMin = document.getElementById('buscar_km_min').value.trim();
      const kmMax = document.getElementById('buscar_km_max').value.trim();
      const precioMin = document.getElementById('buscar_precio_min').value.trim();
      const precioMax = document.getElementById('buscar_precio_max').value.trim();

      const caja = document.getElementById('caja_resultado');
      const contador = document.getElementById('contador');
      caja.innerHTML = `<div class="cargando">🔄 Buscando vehículos...</div>`;
      contador.textContent = '';
      idsFiltrados = []; indiceActual = 0; idVehiculoActual = null; telefonoActual = '';

      const correo = localStorage.getItem('correo_usuario');
      idUsuarioActual = await obtenerUsuarioId(correo);

      const sb = await getSupabase();
      let consulta = sb.from('autos').select('*');
      if (tipo) consulta = consulta.eq('tipo_vehiculo', tipo);
      if (marca) consulta = consulta.ilike('marca', `%${marca}%`);
      if (modelo) consulta = consulta.ilike('modelo', `%${modelo}%`);
      if (anio && anio.length === 4) { const n = parseInt(anio); if (!isNaN(n)) consulta = consulta.eq('anio', n); }
      if (ciudad && ciudad !== 'otra') consulta = consulta.eq('ciudad', ciudad);
      if (combustible) consulta = consulta.eq('combustible', combustible);
      if (transmision) consulta = consulta.eq('transmision', transmision);
      consulta = consulta.order('id', { ascending: false });
      
      const { data, error } = await consulta;
      if (error) { caja.innerHTML = `<div class="sin-resultado">❌ Error: ${error.message}</div>`; return; }
      if (!data || !data.length) { caja.innerHTML = `<div class="sin-resultado">📭 No se encontraron vehículos</div>`; return; }

      let resultados = data;
      if (kmMin) { const n = parseInt(kmMin); if (!isNaN(n)) resultados = resultados.filter(a => a.kilometraje !== null && a.kilometraje >= n); }
      if (kmMax) { const n = parseInt(kmMax); if (!isNaN(n)) resultados = resultados.filter(a => a.kilometraje === null || a.kilometraje <= n); }
      if (precioMin) { const n = limpiarPrecio(precioMin); if (n !== null) resultados = resultados.filter(a => { const v = limpiarPrecio(a.precio); return v === null || v >= n; }); }
      if (precioMax) { const n = limpiarPrecio(precioMax); if (n !== null) resultados = resultados.filter(a => { const v = limpiarPrecio(a.precio); return v === null || v <= n; }); }
      
      if (!resultados.length) { caja.innerHTML = `<div class="sin-resultado">📭 Ningún vehículo cumple con los filtros</div>`; return; }
      
      idsFiltrados = resultados.map(r => r.id);
      await cargarUno(0);
    }

    async function cargarUno(posicion) {
      if (posicion < 0 || posicion >= idsFiltrados.length) return;
      const caja = document.getElementById('caja_resultado');
      const contador = document.getElementById('contador');
      caja.innerHTML = `<div class="cargando">🔄 Cargando vehículo ${posicion+1} de ${idsFiltrados.length}...</div>`;

      const sb = await getSupabase();
      const { data: vehiculo, error } = await sb.from('autos').select('*').eq('id', idsFiltrados[posicion]).single();
      if (error || !vehiculo) { caja.innerHTML = `<div class="sin-resultado">❌ Error al cargar</div>`; return; }

      idVehiculoActual = vehiculo.id;
      telefonoActual = vehiculo.telefono || '';

      const guardado = await yaEstaGuardado(vehiculo.id);

      let fotosHtml = '';
      for (let i = 1; i <= 6; i++) {
        const foto = vehiculo[`foto${i}`];
        if (foto) fotosHtml += `<div class="foto-caja"><div class="foto-ver" onclick="ampliarFoto('${foto}')"><img src="${foto}" alt="" loading="lazy"></div></div>`;
      }
      const hayFotos = fotosHtml !== '';

      const enlaceFavoritoHtml = guardado
        ? `<span class="enlace-favorito guardado"><span class="estrella-gris">⭐</span> En Mis Vehículos</span>`
        : `<button class="enlace-favorito agregar" onclick="mostrarCajaCodigo()"><span class="estrella-amarilla">⭐</span> Agregar a Mi Vehículo</button>`;

      caja.innerHTML = `
        <div class="tarjeta" id="tarjetaDeslizable">
          ${vehiculo.tipo_vehiculo ? `<span class="etiqueta-tipo">${vehiculo.tipo_vehiculo}</span>` : ''}
          
          ${enlaceFavoritoHtml}
          
          <div id="cajaCodigo" class="caja-codigo">
            <h3>🔐 Escribí tu código de seguridad</h3>
            <input type="text" id="codigoIngresado" class="input-codigo" placeholder="Tu código..." maxlength="6">
            <button class="boton-guardar" onclick="guardarConCodigo()">✅ Guardar</button>
            <button class="boton-cancelar" onclick="ocultarCajaCodigo()">❌ Cancelar</button>
          </div>
          
          ${hayFotos ? `<div class="fotos-titulo">📸 Fotos del vehículo — Tocar para agrandar</div><div class="fotos-cuadricula">${fotosHtml}</div>` : ''}
          
          <div class="titulo-vehiculo">${vehiculo.marca || ''} ${vehiculo.modelo || ''} — ${vehiculo.anio || ''}</div>
          <div class="fila"><strong>Versión:</strong> ${vehiculo.version || '-'}</div>
          <div class="fila"><strong>Ciudad:</strong> ${vehiculo.ciudad || '-'}</div>
          <div class="fila"><strong>Kilometraje:</strong> ${vehiculo.kilometraje ? vehiculo.kilometraje.toLocaleString('es-AR') + ' km' : 'No indicado'}</div>
          <div class="fila"><strong>Combustible:</strong> ${vehiculo.combustible || '-'}</div>
          <div class="fila"><strong>Transmisión:</strong> ${vehiculo.transmision || '-'}</div>
          <div class="fila"><strong>Precio:</strong> ${vehiculo.precio || '-'}</div>
          <div class="fila"><strong>Dueño:</strong> ${vehiculo.dueno || '-'}</div>
          <div class="fila"><strong>Dirección:</strong> ${vehiculo.direccion || '-'}</div>
          <div class="fila"><strong>Teléfono:</strong> ${vehiculo.telefono || '-'}</div>
          <div>${vehiculo.permuta ? '<span class="etiqueta permuta">✅ Acepta permuta</span>' : ''}${vehiculo.contado ? '<span class="etiqueta contado">💵 Solo contado</span>' : ''}</div>
          <div class="fila" style="margin-top: 10px;"><strong>Deuda:</strong> ${vehiculo.deuda || 'Sin deudas'}</div>
          <div class="fila"><strong>Descripción:</strong> ${vehiculo.descripcion || '-'}</div>
          
          <a href="${armarEnlaceWhatsApp(telefonoActual)}" class="boton-whatsapp" target="_blank">
            <span class="icono-wsp">✓</span> ENVIAR MENSAJE POR WHATSAPP
          </a>
        </div>
      `;
      contador.textContent = `${posicion + 1} de ${idsFiltrados.length}`;
      
      setTimeout(() => {
        const t = document.getElementById('tarjetaDeslizable');
        if (t) {
          t.addEventListener('touchstart', registrarInicioDeslizamiento, { passive: true });
          t.addEventListener('touchend', registrarFinDeslizamiento, { passive: true });
          t.addEventListener('mousedown', registrarInicioDeslizamiento);
          t.addEventListener('mouseup', registrarFinDeslizamiento);
        }
      }, 100);
    }

    async function vehiculoAnterior() {
      if (!idsFiltrados.length) return;
      indiceActual = indiceActual === 0 ? idsFiltrados.length - 1 : indiceActual - 1;
      await cargarUno(indiceActual);
    }
    async function vehiculoSiguiente() {
      if (!idsFiltrados.length) return;
      indiceActual = indiceActual === idsFiltrados.length - 1 ? 0 : indiceActual + 1;
      await cargarUno(indiceActual);
    }

    async function iniciar() {
      await verificarSesion();
      await getSupabase();
      document.addEventListener('touchstart', registrarInicioDeslizamiento, { passive: true });
      document.addEventListener('touchend', registrarFinDeslizamiento, { passive: true });
      document.addEventListener('mousedown', registrarInicioDeslizamiento);
      document.addEventListener('mouseup', registrarFinDeslizamiento);
    }
    iniciar();
  </script>
</body>
</html>
