<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Vehículos — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #91b8d5 0%, #7aa7c9 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .contenedor {
      max-width: 550px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 5px;
      font-size: 24px;
      font-weight: 800;
    }
    .subtitulo {
      text-align: center;
      color: #e0edf7;
      margin-bottom: 15px;
      font-size: 15px;
    }
    .aviso-limite {
      background: #fffbeb;
      border: 2px solid #fcd34d;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
      color: #92400e;
      font-weight: 600;
      display: none;
    }
    .tarjeta-vehiculo {
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      border: 2px solid #bfa980;
    }
    .campo {
      padding: 12px 0;
      border-bottom: 1px solid #d4c29c;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }
    .campo:last-child {
      border-bottom: none;
    }
    .etiqueta {
      font-weight: 700;
      color: #1a365d;
    }
    .valor {
      color: #2d3748;
      font-weight: 500;
    }
    .navegacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding: 14px 18px;
      background: rgba(255,255,255,0.3);
      border-radius: 12px;
    }
    .boton-nav {
      padding: 11px 22px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px rgba(49,130,206,0.25);
    }
    .boton-nav:hover:not(:disabled) {
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
      transform: translateY(-1px);
    }
    .boton-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      background: #94b8d4;
      box-shadow: none;
    }
    .contador {
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
    }
    .volver {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .volver:hover {
      background: rgba(255,255,255,0.4);
      transform: translateY(-1px);
    }
    .sin-resultados {
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      border-radius: 20px;
      padding: 40px 25px;
      text-align: center;
      color: #2c5282;
      font-size: 17px;
      font-weight: 600;
      border: 2px solid #bfa980;
    }
    .cargando {
      text-align: center;
      color: #ffffff;
      font-size: 17px;
      padding: 40px;
    }
    .fotos-titulo {
      margin-top: 22px;
      font-weight: 700;
      color: #1a365d;
      font-size: 17px;
      padding-top: 15px;
      border-top: 2px solid #d4c29c;
    }
    .fotos-cuadricula {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .foto-caja {text-align: center;}
    .foto-ver {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 10px;
      overflow: hidden;
      background: #ebf4fb;
      border: 2px solid #dceaf5;
    }
    .foto-ver img {width: 100%; height: 100%; object-fit: cover;}
    .foto-nombre {
      font-size: 11px;
      color: #5a4f3f;
      padding: 5px 0;
      font-weight: 600;
    }
    .etiqueta {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin: 6px 8px 6px 0;
      font-weight: 600;
    }
    .permuta {background: #e8d9bc; color: #78350f;}
    .contado {background: #b8d8b5; color: #166534;}
    
    /* Botón de Favoritos */
    .boton-favorito {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.2s;
    }
    .no-conectado {
      background: #e2e8f0;
      color: #64748b;
      cursor: default;
    }
    .disponible {
      background: #fef3c7;
      color: #92400e;
    }
    .disponible:hover {
      background: #fde68a;
    }
    .ya-favorito {
      background: #d1fae5;
      color: #065f46;
      cursor: default;
    }
    .limite-alcanzado {
      background: #fee2e2;
      color: #991b1b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1 id="titulo-tipo">Vehículos</h1>
    <p class="subtitulo" id="subtitulo-tipo">Cargando...</p>

    <div id="avisoLimite" class="aviso-limite">
      ⭐ Llegaste a 5 favoritos. Eliminá uno para agregar otro.
    </div>

    <div id="cargando" class="cargando">🔍 Buscando vehículos...</div>

    <div id="contenido" style="display:none;">
      <div class="navegacion">
        <button id="btn-anterior" class="boton-nav">⬅️ Anterior</button>
        <span id="contador" class="contador">1 de 1</span>
        <button id="btn-siguiente" class="boton-nav">Siguiente ➡️</button>
      </div>
      <div id="tarjeta-vehiculo" class="tarjeta-vehiculo"></div>
      <a href="catalogo.html" class="volver">← Volver al Catálogo</a>
    </div>

    <div id="sin-resultados" style="display:none;">
      <div class="sin-resultados">
        😔 No hay vehículos de este tipo cargados todavía.
      </div>
      <a href="catalogo.html" class="volver">← Volver al Catálogo</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const CORREO_SIN_LIMITE = "misvehiculosenventa@gmail.com";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const nombresFotos = [
      'Foto 1', 'Foto 2', 'Foto 3', 'Foto 4', 'Foto 5',
      'Foto 6', 'Foto 7', 'Foto 8'
    ];

    let listaVehiculos = [];
    let indiceActual = 0;
    let tipoSeleccionado = "";
    let usuarioActual = null;
    let correoUsuario = "";
    let misFavoritos = [];

    function obtenerTipo() {
      const params = new URLSearchParams(window.location.search);
      return params.get("tipo") || "";
    }

    async function verificarSesion() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      usuarioActual = session?.user || null;
      correoUsuario = usuarioActual?.email || "";
      if (usuarioActual) {
        await cargarFavoritos();
      }
      actualizarAvisoLimite();
    }

    async function cargarFavoritos() {
      const { data, error } = await supabaseClient
        .from('favoritos')
        .select('vehiculo_id')
        .eq('usuario_id', usuarioActual.id);
      
      if (!error && data) {
        misFavoritos = data.map(f => f.vehiculo_id);
      }
    }

    function tieneLimite() {
      return correoUsuario !== CORREO_SIN_LIMITE;
    }

    function actualizarAvisoLimite() {
      const aviso = document.getElementById('avisoLimite');
      if (!usuarioActual || !tieneLimite() || misFavoritos.length < 5) {
        aviso.style.display = 'none';
      } else {
        aviso.style.display = 'block';
      }
    }

    async function cargarVehiculos() {
      tipoSeleccionado = obtenerTipo();
      
      document.getElementById("titulo-tipo").textContent = tipoSeleccionado || "Todos los Vehículos";
      document.getElementById("subtitulo-tipo").textContent = tipoSeleccionado 
        ? `Filtrando: ${tipoSeleccionado}` 
        : "Se muestran todos los vehículos disponibles";

      let consulta = supabaseClient.from("mis_vehiculos").select("*");
      
      if (tipoSeleccionado) {
        consulta = consulta.eq("tipo_vehiculo", tipoSeleccionado);
      }

      const { data, error } = await consulta.order("id", { ascending: false });

      document.getElementById("cargando").style.display = "none";

      if (error) {
        console.error("Error:", error);
        alert("Error al buscar: " + error.message);
        return;
      }

      if (!data || data.length === 0) {
        document.getElementById("sin-resultados").style.display = "block";
        return;
      }

      listaVehiculos = data;
      indiceActual = 0;

      document.getElementById("contenido").style.display = "block";
      mostrarVehiculoActual();
    }

    function mostrarVehiculoActual() {
      const veh = listaVehiculos[indiceActual];
      const tarjeta = document.getElementById("tarjeta-vehiculo");

      let fotosHtml = '';
      for (let i = 1; i <= 8; i++) {
        const foto = veh[`foto${i}`];
        if (foto) {
          fotosHtml += `
            <div class="foto-caja">
              <div class="foto-ver"><img src="${foto}" alt="${nombresFotos[i-1]}"></div>
              <div class="foto-nombre">${nombresFotos[i-1]}</div>
            </div>
          `;
        }
      }
      const hayFotos = fotosHtml !== '';

      // Lógica del botón de favoritos
      const esFavorito = misFavoritos.includes(veh.id);
      const limiteAlcanzado = tieneLimite() && misFavoritos.length >= 5;
      
      let claseBoton = 'disponible';
      let textoBoton = '⭐ Agregar a mis favoritos';
      let desactivado = false;
      
      if (!usuarioActual) {
        claseBoton = 'no-conectado';
        textoBoton = '🔒 Iniciá sesión para guardar favoritos';
        desactivado = true;
      } else if (esFavorito) {
        claseBoton = 'ya-favorito';
        textoBoton = '✅ Ya está en favoritos';
        desactivado = true;
      } else if (limiteAlcanzado) {
        claseBoton = 'limite-alcanzado';
        textoBoton = '⚠️ Límite de 5 alcanzado';
        desactivado = true;
      }

      tarjeta.innerHTML = `
        <div class="campo">
          <span class="etiqueta">Tipo:</span>
          <span class="valor">${veh.tipo_vehiculo || tipoSeleccionado}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Marca:</span>
          <span class="valor">${veh.marca || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Modelo:</span>
          <span class="valor">${veh.modelo || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Versión:</span>
          <span class="valor">${veh.version || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Año:</span>
          <span class="valor">${veh.anio || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Kilometraje:</span>
          <span class="valor">${veh.kilometraje ? veh.kilometraje.toLocaleString("es-AR") + " km" : "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Combustible:</span>
          <span class="valor">${veh.combustible || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Transmisión:</span>
          <span class="valor">${veh.transmision || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Precio:</span>
          <span class="valor">$ ${veh.precio ? Number(veh.precio).toLocaleString("es-AR") : "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Ciudad:</span>
          <span class="valor">${veh.ciudad || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Dueño:</span>
          <span class="valor">${veh.dueno || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Teléfono:</span>
          <span class="valor">${veh.telefono || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Dirección:</span>
          <span class="valor">${veh.direccion || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Deudas:</span>
          <span class="valor">${veh.deuda || "Sin deudas"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Descripción:</span>
          <span class="valor">${veh.descripcion || "-"}</span>
        </div>
        <div style="padding: 10px 0; border-bottom: 1px solid #d4c29c;">
          ${veh.permuta ? '<span class="etiqueta permuta">✅ Acepta permuta</span>' : ''}
          ${veh.contado ? '<span class="etiqueta contado">💵 Solo contado</span>' : ''}
        </div>
        ${hayFotos ? `
        <div class="fotos-titulo">📸 Fotos del vehículo</div>
        <div class="fotos-cuadricula">${fotosHtml}</div>
        ` : ''}
        <button class="boton-favorito ${claseBoton}" data-id="${veh.id}" ${desactivado ? 'disabled' : ''}>
          ${textoBoton}
        </button>
      `;

      document.getElementById("contador").textContent = `${indiceActual + 1} de ${listaVehiculos.length}`;
      document.getElementById("btn-anterior").disabled = indiceActual === 0;
      document.getElementById("btn-siguiente").disabled = indiceActual === listaVehiculos.length - 1;

      // Agregar evento al botón
      const btnFav = tarjeta.querySelector('.boton-favorito');
      if (btnFav && !desactivado) {
        btnFav.addEventListener('click', async () => {
          if (!usuarioActual) return;
          const idVehiculo = parseInt(btnFav.dataset.id);
          
          if (misFavoritos.includes(idVehiculo)) return;
          if (tieneLimite() && misFavoritos.length >= 5) {
            alert('⚠️ Ya tenés 5 favoritos. Eliminá uno para agregar otro.');
            return;
          }
          
          const { error } = await supabaseClient.from('favoritos').insert([{
            usuario_id: usuarioActual.id,
            vehiculo_id: idVehiculo
          }]);
          
          if (error) {
            alert('❌ Error: ' + error.message);
            return;
          }
          
          misFavoritos.push(idVehiculo);
          actualizarAvisoLimite();
          mostrarVehiculoActual();
        });
      }
    }

    document.getElementById("btn-anterior").addEventListener("click", () => {
      if (indiceActual > 0) {
        indiceActual--;
        mostrarVehiculoActual();
      }
    });

    document.getElementById("btn-siguiente").addEventListener("click", () => {
      if (indiceActual < listaVehiculos.length - 1) {
        indiceActual++;
        mostrarVehiculoActual();
      }
    });

    // Detectar cambio de sesión
    supabaseClient.auth.onAuthStateChange(async (_, sesion) => {
      usuarioActual = sesion?.user || null;
      correoUsuario = usuarioActual?.email || "";
      misFavoritos = [];
      if (usuarioActual) await cargarFavoritos();
      actualizarAvisoLimite();
      if (listaVehiculos.length > 0) mostrarVehiculoActual();
    });

    verificarSesion().then(cargarVehiculos);
  </script>

</body>
</html>
