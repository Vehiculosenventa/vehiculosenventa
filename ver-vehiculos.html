<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Vehículos — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #5fa8d3 0%, #3b82b8 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .contenedor {
      max-width: 550px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 5px;
      font-size: 24px;
      font-weight: 800;
    }

    .subtitulo {
      text-align: center;
      color: #e0edf7;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .tarjeta-vehiculo {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      border: 3px solid #3b82b8;
    }

    .campo {
      padding: 12px 0;
      border-bottom: 1px solid #e5eef7;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
    }

    .campo:last-child {
      border-bottom: none;
    }

    .etiqueta {
      font-weight: 600;
      color: #2c5282;
    }

    .valor {
      color: #1a365d;
      font-weight: 500;
    }

    .navegacion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .boton-nav {
      padding: 10px 20px;
      background: #ffffff;
      color: #3b82b8;
      border: 2px solid #3b82b8;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .boton-nav:hover:not(:disabled) {
      background: #3b82b8;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .boton-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      background: #f0f7fc;
      color: #94b8d4;
      border-color: #94b8d4;
    }

    .contador {
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
    }

    .volver {
      display: inline-block;
      margin-top: 10px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 24px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      transition: background 0.2s ease;
    }

    .volver:hover {
      background: rgba(255,255,255,0.35);
    }

    .sin-resultados {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 25px;
      text-align: center;
      color: #2c5282;
      font-size: 17px;
      font-weight: 500;
      border: 3px solid #3b82b8;
    }

    .cargando {
      text-align: center;
      color: #ffffff;
      font-size: 17px;
      padding: 40px;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1 id="titulo-tipo">Vehículos</h1>
    <p class="subtitulo" id="subtitulo-tipo">Cargando...</p>

    <div id="cargando" class="cargando">🔍 Buscando vehículos...</div>

    <div id="contenido" style="display:none;">
      <div class="navegacion">
        <button id="btn-anterior" class="boton-nav">⬅️ Anterior</button>
        <span id="contador" class="contador">1 de 1</span>
        <button id="btn-siguiente" class="boton-nav">Siguiente ➡️</button>
      </div>

      <div id="tarjeta-vehiculo" class="tarjeta-vehiculo"></div>

      <a href="catalogo.html" class="volver">← Volver al Catálogo</a>
    </div>

    <div id="sin-resultados" style="display:none;">
      <div class="sin-resultados">
        😔 No hay vehículos de este tipo cargados todavía.
      </div>
      <a href="catalogo.html" class="volver">← Volver al Catálogo</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listaVehiculos = [];
    let indiceActual = 0;
    let tipoSeleccionado = "";

    function obtenerTipo() {
      const params = new URLSearchParams(window.location.search);
      return params.get("tipo") || "";
    }

    async function cargarVehiculos() {
      tipoSeleccionado = obtenerTipo();
      
      document.getElementById("titulo-tipo").textContent = tipoSeleccionado || "Vehículos";
      document.getElementById("subtitulo-tipo").textContent = tipoSeleccionado 
        ? `Filtrando: ${tipoSeleccionado}` 
        : "Todos los vehículos";

      let consulta = supabase.from("autos").select("*");
      
      if (tipoSeleccionado) {
        consulta = consulta.eq("tipo_vehiculo", tipoSeleccionado);
      }

      const { data, error } = await consulta.order("id", { ascending: false });

      document.getElementById("cargando").style.display = "none";

      if (error) {
        console.error("Error:", error);
        alert("Error al buscar vehículos");
        return;
      }

      if (!data || data.length === 0) {
        document.getElementById("sin-resultados").style.display = "block";
        return;
      }

      listaVehiculos = data;
      indiceActual = 0;

      document.getElementById("contenido").style.display = "block";
      mostrarVehiculoActual();
    }

    function mostrarVehiculoActual() {
      const veh = listaVehiculos[indiceActual];
      const tarjeta = document.getElementById("tarjeta-vehiculo");

      tarjeta.innerHTML = `
        <div class="campo">
          <span class="etiqueta">Tipo:</span>
          <span class="valor">${veh.tipo_vehiculo || tipoSeleccionado}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Año:</span>
          <span class="valor">${veh.año || "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Kilometraje:</span>
          <span class="valor">${veh.kilometraje ? veh.kilometraje + " km" : "-"}</span>
        </div>
        <div class="campo">
          <span class="etiqueta">Precio:</span>
          <span class="valor">$ ${veh.precio ? Number(veh.precio).toLocaleString("es-AR") : "-"}</span>
        </div>
      `;

      document.getElementById("contador").textContent = `${indiceActual + 1} de ${listaVehiculos.length}`;

      document.getElementById("btn-anterior").disabled = indiceActual === 0;
      document.getElementById("btn-siguiente").disabled = indiceActual === listaVehiculos.length - 1;
    }

    document.getElementById("btn-anterior").addEventListener("click", () => {
      if (indiceActual > 0) {
        indiceActual--;
        mostrarVehiculoActual();
      }
    });

    document.getElementById("btn-siguiente").addEventListener("click", () => {
      if (indiceActual < listaVehiculos.length - 1) {
        indiceActual++;
        mostrarVehiculoActual();
      }
    });

    cargarVehiculos();
  </script>

</body>
</html>
