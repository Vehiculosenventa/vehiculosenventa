<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmando cuenta...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 100px auto;
      padding: 20px;
      text-align: center;
      background: #f0fdf4;
    }
    .exito {
      color: #166534;
      background: #bbf7d0;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #4ade80;
    }
    .error {
      color: #991b1b;
      background: #fee2e2;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #f87171;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 20px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    a:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

  <div id="contenido">
    <h2>Confirmando tu cuenta...</h2>
    <p>Un momento por favor ⏳</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    // ✅ Sin esperar sesión — solo con la clave pública
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        autoRefreshToken: false,
        persistSession: false
      }
    });

    const parametros = new URLSearchParams(window.location.search);
    const usuarioId = parametros.get('id');

    async function confirmarCuenta() {
      const contenido = document.getElementById('contenido');

      if (!usuarioId) {
        contenido.innerHTML = `
          <div class="error">
            <h3>❌ Enlace incompleto</h3>
            <p>Falta el identificador de tu cuenta.</p>
          </div>`;
        return;
      }

      const { error } = await supabaseClient
        .from('usuarios')
        .update({ confirmado: true })
        .eq('id', usuarioId);

      if (error) {
        contenido.innerHTML = `
          <div class="error">
            <h3>❌ No se pudo confirmar</h3>
            <p>${error.message}</p>
          </div>`;
      } else {
        contenido.innerHTML = `
          <div class="exito">
            <h3>✅ ¡Cuenta confirmada!</h3>
            <p>Tu cuenta ya está activa. Ya podés entrar.</p>
            <a href="iniciar-sesion.html">Iniciar sesión</a>
          </div>`;
      }
    }

    confirmarCuenta();
  </script>

</body>
</html>
