<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar Cuenta - Vehículos en Venta</title>
  <link rel="manifest" href="app.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      border-radius: 28px; padding: 45px 35px; width: 100%; max-width: 500px;
      box-shadow: 0 10px 30px rgba(44,82,130,0.08); border: 1px solid #e2d9c8; text-align: center;
    }
    h1 {font-size: 28px; margin-bottom: 20px;}
    .exito {color: #276749;}
    .error {color: #c53030;}
    .boton {
      display: inline-block; padding: 14px 30px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: #fff; border-radius: 14px; text-decoration: none; font-weight: 700; margin-top: 25px;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1 id="titulo">🔄 Confirmando...</h1>
    <p id="mensaje">Un momento por favor...</p>
    <a id="enlaceBoton" href="iniciar-sesion.html" class="boton" style="display:none;">Ir a Iniciar Sesión</a>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function confirmar() {
      const params = new URLSearchParams(window.location.search);
      const correo = params.get('correo');
      const codigo = params.get('codigo');

      if (!correo || !codigo) {
        document.getElementById('titulo').textContent = '❌ Enlace inválido';
        document.getElementById('titulo').className = 'error';
        document.getElementById('mensaje').textContent = 'Faltan datos en el enlace';
        return;
      }

      try {
        const { data, error } = await supabase
          .from('usuarios')
          .select('*')
          .eq('correo', correo)
          .eq('codigo_confirmacion', codigo)
          .maybeSingle();

        if (error) throw error;
        if (!data) throw new Error('No se encontró el usuario o código incorrecto');
        if (data.confirmado) {
          document.getElementById('titulo').textContent = '✅ Ya estabas confirmado';
          document.getElementById('titulo').className = 'exito';
          document.getElementById('mensaje').textContent = 'Tu cuenta ya estaba activa';
          document.getElementById('enlaceBoton').style.display = 'inline-block';
          return;
        }

        // Marcar como confirmado
        const { error: updateError } = await supabase
          .from('usuarios')
          .update({ confirmado: true })
          .eq('correo', correo);

        if (updateError) throw updateError;

        document.getElementById('titulo').textContent = '✅ ¡Confirmado!';
        document.getElementById('titulo').className = 'exito';
        document.getElementById('mensaje').textContent = 'Tu cuenta ya está activa. Bienvenido/a!';
        document.getElementById('enlaceBoton').style.display = 'inline-block';

      } catch (err) {
        document.getElementById('titulo').textContent = '❌ Error';
        document.getElementById('titulo').className = 'error';
        document.getElementById('mensaje').textContent = err.message;
      }
    }

    confirmar();
  </script>
</body>
</html>
