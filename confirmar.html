<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmado - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5, #cfe0ee);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: #faf8f0;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 420px; width: 100%; text-align: center;
    }
    h1 {color: #2c5282; margin-bottom: 15px; font-size: 22px;}
    .exito {color: #2f855a; font-size: 18px; margin: 20px 0;}
    .error {color: #d64545; font-size: 16px; margin: 20px 0; display: none;}
    .cargando {color: #3182ce; font-size: 16px; margin: 20px 0;}
    button {
      background: #5fa8d3; color: #fff; border: none;
      padding: 12px 24px; border-radius: 8px; font-size: 16px;
      cursor: pointer; margin-top: 10px; transition: background 0.3s;
    }
    button:hover {background: #4a90c4;}
  </style>
</head>
<body>
  <div class="caja">
    <h1>Confirmando tu cuenta...</h1>
    <div class="cargando" id="cargando">✅ Verificando...</div>
    <div class="exito" id="exito" style="display:none;">
      ✅ ¡Cuenta confirmada con éxito!<br>
      Ya podés iniciar sesión.
    </div>
    <div class="error" id="error"></div>
    <button id="botonIr" style="display:none;" onclick="window.location.href='index.html'">
      Ir al inicio
    </button>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    async function confirmar() {
      const { data, error } = await supabase.auth.exchangeCodeForSession(window.location.href);
      
      if (error) {
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('error').textContent = "❌ " + error.message;
        document.getElementById('error').style.display = 'block';
        return;
      }
      
      document.getElementById('cargando').style.display = 'none';
      document.getElementById('exito').style.display = 'block';
      document.getElementById('botonIr').style.display = 'inline-block';
    }
    
    confirmar();
  </script>
</body>
</html>
