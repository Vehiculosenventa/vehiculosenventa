<script>
const supabaseUrl = "https://vehiculosenventa.supabase.co";
const supabaseKey = "PEGÁ_TU_CLAVE_PÚBLICA_ACÁ";
const { createClient } = supabase;
const supabase = createClient(supabaseUrl, supabaseKey);

async function confirmarCuenta() {
  const estado = document.getElementById("estado");
  if (!estado) return;

  try {
    estado.innerHTML = "🔐 Confirmando tu cuenta...";

    const hash = window.location.hash;
    if (hash && hash.includes("access_token")) {
      const params = new URLSearchParams(hash.substring(1));
      const access_token = params.get("access_token");
      const refresh_token = params.get("refresh_token");

      if (access_token) {
        const { error } = await supabase.auth.setSession({
          access_token,
          refresh_token
        });

        if (error) throw error;

        estado.innerHTML = "✅ ¡Cuenta confirmada! Redirigiendo...";
        setTimeout(() => {
          window.location.href = "iniciar-sesion.html";
        }, 1500);
        return;
      }
    }

    estado.innerHTML = "✅ Todo listo! <a href='iniciar-sesion.html'>Ir a iniciar sesión</a>";
    
  } catch (error) {
    estado.innerHTML = "❌ " + error.message + "<br><a href='iniciar-sesion.html'>Ir a iniciar sesión</a>";
  }
}

window.addEventListener("load", confirmarCuenta);
</script>
