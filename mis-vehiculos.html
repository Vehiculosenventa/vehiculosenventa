<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borrar Usuario — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      /* 🔵 Celeste oscurito — IGUAL a TODAS las páginas */
      background: linear-gradient(135deg, #91b8d5 0%, #7aa7c9 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      /* 🟡 Cremita oscurito — IGUAL a las otras */
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      padding: 40px 30px;
      border-radius: 24px;
      max-width: 420px; width: 100%;
      box-shadow: 0 8px 25px rgba(44, 82, 130, 0.12);
      border: 1px solid #bfa980;
    }
    h1 {color: #c53030; text-align: center; margin-bottom: 20px; font-size: 22px; font-weight: 800;}
    .cargando {text-align: center; color: #2c5282; font-weight: 600; padding: 20px;}
    .aviso-sesion {
      padding: 12px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: 600;
    }
    .conectado {background: #e6f2e6; color: #22543d; border: 1px solid #9ae6b4;}
    .no-conectado {background: #fff3cd; color: #744210; border: 1px solid #fde68a;}
    label {display: block; margin-bottom: 6px; margin-top: 18px; font-weight: 600; color: #5a4f3f;}
    input {
      width: 100%; padding: 12px 15px; border: 2px solid #c5d6e8; border-radius: 10px;
      font-size: 15px; background: #fff; color: #4a5568;
    }
    input:focus {outline: none; border-color: #c53030; box-shadow: 0 0 0 3px rgba(197,48,48,0.12);}
    .boton-rojo {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #e53e3e, #c53030); color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 25px;
      transition: transform 0.2s;
    }
    .boton-rojo:hover {transform: translateY(-2px); background: linear-gradient(135deg, #eb5757, #e53e3e);}
    .boton-azul {
      display: block; width: 100%; padding: 12px;
      background: linear-gradient(135deg, #3182ce, #2b6cb0); color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
      text-align: center; text-decoration: none; margin-top: 10px; transition: transform 0.2s;
    }
    .boton-azul:hover {transform: translateY(-2px); background: linear-gradient(135deg, #4a90d9, #3182ce);}
    .boton-gris {
      background: linear-gradient(135deg, #718096, #4a5568);
    }
    .boton-gris:hover {background: linear-gradient(135deg, #8a9ab0, #718096);}
    .mensaje {margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; font-weight: 600; display: none;}
    .exito {background: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7;}
    .error {background: #ffebee; color: #c62828; border: 2px solid #ef9a9a;}
    .oculto {display: none !important;}
  </style>
</head>
<body>
<div class="caja">
  <h1>🗑️ Borrar Usuario</h1>

  <div id="cargando" class="cargando">🔍 Verificando sesión...</div>

  <!-- ❌ No conectado -->
  <div id="bloqueNoConectado" class="oculto">
    <div class="aviso-sesion no-conectado">🔒 Debés iniciar sesión primero</div>
    <a href="iniciar-sesion.html" class="boton-azul">Ir a Iniciar Sesión</a>
    <a href="index.html" class="boton-azul boton-gris">Volver al Inicio</a>
  </div>

  <!-- ✅ Conectado -->
  <div id="bloqueConectado" class="oculto">
    <div class="aviso-sesion conectado">✅ Conectado como: <span id="correoActivo"></span></div>

    <label for="correoBorrar">Correo del usuario a borrar</label>
    <input type="email" id="correoBorrar" placeholder="correo@ejemplo.com">

    <button id="btnBorrar" class="boton-rojo">🗑️ Borrar Usuario</button>

    <div id="mensaje" class="mensaje"></div>

    <a href="index.html" class="boton-azul" style="margin-top:20px">Volver al Inicio</a>
  </div>
</div>

<script>
const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

// ✅ UNA SOLA VEZ — sin duplicados
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function revisarSesion() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    
    document.getElementById('cargando').classList.add('oculto');

    if (!session) {
      document.getElementById('bloqueNoConectado').classList.remove('oculto');
      return;
    }

    document.getElementById('correoActivo').textContent = session.user.email;
    document.getElementById('bloqueConectado').classList.remove('oculto');
    
  } catch (err) {
    document.getElementById('cargando').textContent = "❌ Error: " + err.message;
  }
}

function mostrarMensaje(texto, tipo) {
  const m = document.getElementById('mensaje');
  m.style.display = 'block';
  m.className = 'mensaje ' + tipo;
  m.textContent = texto;
}

document.getElementById('btnBorrar').addEventListener('click', async function() {
  const correo = document.getElementById('correoBorrar').value.trim();

  if (!correo) {
    mostrarMensaje('⚠️ Escribí el correo a borrar', 'error');
    return;
  }

  try {
    const { error } = await supabaseClient
      .from('usuario')
      .delete()
      .eq('correo', correo);

    if (error) throw error;

    mostrarMensaje('✅ Usuario borrado correctamente', 'exito');
    document.getElementById('correoBorrar').value = '';

  } catch (err) {
    mostrarMensaje('❌ Error: ' + err.message, 'error');
  }
});

revisarSesion();
</script>
</body>
</html>
