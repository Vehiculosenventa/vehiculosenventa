<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Vehículos — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: linear-gradient(135deg, #e8e0d0 0%, #d9cfb8 100%);
      padding: 45px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(44, 82, 130, 0.15);
      border: 1px solid #c4b89f;
      max-width: 420px;
      width: 100%;
    }
    h1 {
      color: #2c5282;
      text-align: center;
      margin-bottom: 30px;
      font-size: 22px;
      font-weight: 800;
    }
    label {
      display: block;
      color: #2c5282;
      font-weight: 600;
      margin-bottom: 8px;
      margin-top: 18px;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #b8c8d8;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }
    .boton-borrar {
      width: 100%;
      background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 25px;
      transition: transform 0.2s;
    }
    .boton-borrar:hover {
      transform: translateY(-2px);
    }
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      display: none;
    }
    .exito {background: #f0fff4; color: #22543d; border: 1px solid #9ae6b4;}
    .error {background: #fff5f5; color: #742a2a; border: 1px solid #feb2b2;}
    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #2b6cb0;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>🗑️ Borrar Usuario</h1>

    <form id="formBorrar">
      <label for="correo">Correo del usuario a borrar</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com" required>

      <label for="clave">Tu contraseña de administrador</label>
      <input type="password" id="clave" placeholder="Escribí tu clave" required>

      <button type="submit" class="boton-borrar">🗑️ Borrar Usuario</button>
    </form>

    <div id="mensajeExito" class="mensaje exito">
      ✅ Usuario borrado correctamente
    </div>
    <div id="mensajeError" class="mensaje error"></div>

    <a href="index.html" class="volver">← Volver a la página principal</a>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ⚠️ PONÉ TU CONTRASEÑA AQUÍ
    const CLAVE_ADMIN = "poné-tu-contraseña-aquí";

    document.getElementById('formBorrar').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const correo = document.getElementById('correo').value.trim();
      const clave = document.getElementById('clave').value;

      // Ocultar mensajes
      document.getElementById('mensajeExito').style.display = 'none';
      document.getElementById('mensajeError').style.display = 'none';

      // Verificar tu clave
      if (clave !== CLAVE_ADMIN) {
        document.getElementById('mensajeError').textContent = "❌ Contraseña incorrecta";
        document.getElementById('mensajeError').style.display = 'block';
        return;
      }

      try {
        // Buscar por correo
        const { data: usuario, error: buscarError } = await supabase
          .from('usuario')
          .select('id, correo')
          .eq('correo', correo)
          .single();

        if (buscarError || !usuario) {
          document.getElementById('mensajeError').textContent = "❌ No se encontró ese correo";
          document.getElementById('mensajeError').style.display = 'block';
          return;
        }

        // Borrar
        const { error: borrarError } = await supabase
          .from('usuario')
          .delete()
          .eq('correo', correo);

        if (borrarError) throw borrarError;

        // Éxito
        document.getElementById('mensajeExito').style.display = 'block';
        document.getElementById('formBorrar').reset();

      } catch (err) {
        document.getElementById('mensajeError').textContent = "❌ Error: " + err.message;
        document.getElementById('mensajeError').style.display = 'block';
      }
    });
  </script>
</body>
</html>
