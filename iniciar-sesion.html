<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .caja { background: #fff; border-radius: 20px; padding: 40px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c5282; margin-bottom: 30px; }
    .campo { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; }
    button { width: 100%; padding: 15px; background: #3182ce; color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; }
    .mensaje { margin-top: 20px; padding: 12px; border-radius: 10px; text-align: center; font-weight: 700; display: none; }
    .error { background: #ffebee; color: #c53030; display: block; }
    .ok { background: #e8f5e9; color: #2e7d32; display: block; }
    .enlaces { margin-top: 25px; text-align: center; }
    .enlaces a { display: block; margin: 10px 0; color: #3182ce; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>🔐 Iniciar Sesión</h1>
    
    <form id="form">
      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" id="correo" required>
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <input type="password" id="clave" required>
      </div>
      <button type="submit">Entrar</button>
    </form>

    <div id="mensaje" class="mensaje"></div>

    <div class="enlaces">
      <a href="registrarse.html">📝 No tengo cuenta — Registrarme</a>
      <a href="index.html">← Volver a la página principal</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const form = document.getElementById('form');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const correo = document.getElementById('correo').value;
      const clave = document.getElementById('clave').value;

      mensaje.className = 'mensaje';

      // Iniciar sesión
      const { data, error } = await supabase.auth.signInWithPassword({
        email: correo,
        password: clave
      });

      if (error) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = '❌ ' + error.message;
        return;
      }

      // Verificar si confirmó el correo
      const { data: fila } = await supabase
        .from('usuario')
        .select('verificado')
        .eq('correo', correo)
        .single();

      if (!fila || !fila.verificado) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = '⚠️ Primero confirmá tu cuenta desde el correo';
        await supabase.auth.signOut();
        return;
      }

      // Todo bien → ir al inicio
      mensaje.className = 'mensaje ok';
      mensaje.textContent = '✅ Entrando...';
      setTimeout(() => window.location.href = 'index.html', 800);
    });
  </script>
</body>
</html>
