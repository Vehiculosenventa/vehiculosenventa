<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: #faf8f0;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    h1 {text-align: center; color: #2c5282; margin-bottom: 30px; font-size: 22px;}
    .campo {margin-bottom: 20px; position: relative;}
    label {display: block; margin-bottom: 6px; color: #4a5568; font-weight: 500;}
    .input-estilo {
      width: 100%; padding: 12px 15px;
      border: 1px solid #bdd1e1; border-radius: 8px;
      font-size: 16px;
      background: #ffffff;
    }
    .input-estilo:focus {outline: none; border-color: #6fa8d6; box-shadow: 0 0 0 3px rgba(111,168,214,0.2);}
    .input-con-ojo {position: relative;}
    .input-con-ojo .input-estilo {padding-right: 45px;}
    .ojo {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 20px; color: #6b7280;
      user-select: none;
    }
    .ojo:hover {color: #3182ce;}
    .indicador {font-size: 13px; color: #718096; margin-top: 5px;}
    button {
      width: 100%; padding: 14px;
      background: #5fa8d3;
      color: #ffffff; border: none;
      border-radius: 8px; font-size: 17px; font-weight: 600;
      cursor: pointer; transition: background 0.3s;
    }
    button:hover {background: #4a90c4;}
    .enlace {margin-top: 20px; text-align: center;}
    .enlace a {color: #5fa8d3; text-decoration: none;}
    .error {color: #d64545; margin-top: -10px; margin-bottom: 12px; font-size: 14px; display: none;}
  </style>
</head>
<body>
  <div class="caja">
    <h1>Crear tu Cuenta</h1>

    <div class="campo">
      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" class="input-estilo" placeholder="tu@correo.com">
    </div>

    <div class="campo">
      <label for="contraseña">Contraseña (6 a 8 caracteres)</label>
      <div class="input-con-ojo">
        <input type="password" id="contraseña" class="input-estilo" placeholder="Mínimo 6, máximo 8" maxlength="8">
        <span class="ojo" id="ojo1">👁️</span>
      </div>
      <div class="indicador" id="cont1">0 / 8</div>
    </div>

    <div class="campo">
      <label for="repetir_contraseña">Repetir Contraseña</label>
      <div class="input-con-ojo">
        <input type="password" id="repetir_contraseña" class="input-estilo" placeholder="Repetí la contraseña" maxlength="8">
        <span class="ojo" id="ojo2">👁️</span>
      </div>
      <div class="indicador" id="cont2">0 / 8</div>
    </div>

    <div class="error" id="mensaje_error">Las contraseñas no coinciden o tienen menos de 6 caracteres</div>

    <button id="botonCrear">Crear Cuenta</button>

    <div class="enlace">
      <a href="index.html">Volver al inicio</a>
    </div>
  </div>

  <script>
    // === UNA SOLA VEZ — SIN DUPLICADOS ✅ ===
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Contadores
    const pass1 = document.getElementById('contraseña');
    const pass2 = document.getElementById('repetir_contraseña');
    document.getElementById('cont1').textContent = pass1.value.length + ' / 8';
    document.getElementById('cont2').textContent = pass2.value.length + ' / 8';
    pass1.addEventListener('input', () => {
      document.getElementById('cont1').textContent = pass1.value.length + ' / 8';
    });
    pass2.addEventListener('input', () => {
      document.getElementById('cont2').textContent = pass2.value.length + ' / 8';
    });

    // === OJITOS QUE FUNCIONAN BIEN 👁️🙈 ===
    function configurarOjo(inputId, ojoId) {
      const input = document.getElementById(inputId);
      const ojo = document.getElementById(ojoId);
      ojo.addEventListener('click', () => {
        if (input.type === 'password') {
          input.type = 'text';
          ojo.textContent = '🙈'; // SE VE
        } else {
          input.type = 'password';
          ojo.textContent = '👁️'; // SE OCULTA
        }
      });
    }
    configurarOjo('contraseña', 'ojo1');
    configurarOjo('repetir_contraseña', 'ojo2');

    // Registrar
    async function registrar() {
      const correo = document.getElementById('correo').value.trim();
      const contraseña = pass1.value;
      const repetir = pass2.value;
      const error = document.getElementById('mensaje_error');

      error.style.display = 'none';

      if (contraseña.length < 6 || contraseña.length > 8) {
        error.style.display = 'block';
        return;
      }
      if (contraseña !== repetir) {
        error.style.display = 'block';
        return;
      }
      if (!correo) {
        alert("Escribí tu correo electrónico");
        return;
      }

      const { data, error: e } = await supabase.auth.signUp({
        email: correo,
        password: contraseña,
        options: { emailRedirectTo: "https://vehiculosenventa.com.ar/confirmar.html" }
      });

      if (e) alert("❌ " + e.message);
      else if (data.user && !data.session) alert("✅ Listo! Revisá tu correo");
      else { alert("✅ Cuenta creada!"); window.location.href = "index.html"; }
    }
    document.getElementById('botonCrear').addEventListener('click', registrar);
  </script>
</body>
</html>
