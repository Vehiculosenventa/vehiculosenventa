<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .tarjeta {
      background: white;
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(44,82,130,0.08);
      width: 100%;
      max-width: 440px;
      animation: entradaSuave 0.6s ease-out;
    }
    @keyframes entradaSuave {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }
    h1 {text-align:center; color:#2c5282; font-size:1.8rem; margin-bottom:0.5rem;}
    .subtitulo {text-align:center; color:#5a6872; margin-bottom:2rem;}
    label {display:block; margin-top:1.2rem; margin-bottom:0.4rem; font-weight:600; color:#2d3748;}
    .input-contenedor {position:relative;}
    input {
      width:100%; padding:1rem 3rem 1rem 1rem;
      border:2px solid #e2e8f0; border-radius:12px; font-size:1rem;
      transition: border-color 0.2s;
    }
    input:focus {outline:none; border-color:#3182ce; box-shadow:0 0 0 4px rgba(49,130,206,0.15);}
    .btn-ver {
      position:absolute; right:1rem; top:50%; transform:translateY(-50%);
      background:transparent; border:none; font-size:1.3rem; cursor:pointer; color:#718096;
      padding:0; line-height:1;
    }
    .boton-crear {
      width:100%; padding:1rem; margin-top:1.8rem;
      background:linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color:white; border:none; border-radius:12px;
      font-size:1.1rem; font-weight:700; cursor:pointer;
      transition: transform 0.2s;
    }
    .boton-crear:hover {transform:translateY(-2px); box-shadow:0 6px 16px rgba(49,130,206,0.25);}
    .boton-crear:disabled {opacity:0.7; cursor:not-allowed; transform:none;}
    .mensaje {margin-top:1.2rem; padding:1rem; border-radius:10px; display:none; text-align:center; font-weight:600;}
    .error {background:#fed7d7; color:#9b2c2c; display:block;}
    .exito {background:#c6f6d5; color:#22543d; display:block;}
    .aviso-existe {background:#fef3c7; color:#92400e; display:block; border-left:4px solid #f59e0b;}
    .volver {display:block; text-align:center; margin-top:1.5rem; color:#4a5568; text-decoration:none; font-weight:500;}
    .volver:hover {color:#3182ce; text-decoration:underline;}
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>📝 Crear Cuenta</h1>
    <p class="subtitulo">Completá tus datos para registrarte</p>

    <form id="formRegistro">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" required placeholder="Tu nombre completo">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required placeholder="tu@correo.com">

      <label for="contraseña">Contraseña (mínimo 8 caracteres)</label>
      <div class="input-contenedor">
        <input type="password" id="contraseña" required placeholder="Elegí una contraseña">
        <button type="button" id="btnVer" class="btn-ver">👁️</button>
      </div>

      <label for="repetir_contraseña">Repetir contraseña</label>
      <div class="input-contenedor">
        <input type="password" id="repetir_contraseña" required placeholder="Escribí la contraseña otra vez">
        <button type="button" id="btnVer2" class="btn-ver">👁️</button>
      </div>

      <button type="submit" id="botonCrear" class="boton-crear">Crear Cuenta ✅</button>
      <div id="mensaje" class="mensaje"></div>
    </form>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const inputContra = document.getElementById('contraseña');
    const inputContra2 = document.getElementById('repetir_contraseña');
    const btnVer = document.getElementById('btnVer');
    const btnVer2 = document.getElementById('btnVer2');
    const form = document.getElementById('formRegistro');
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('botonCrear');

    btnVer.addEventListener('click', function() {
      inputContra.type = inputContra.type === 'password' ? 'text' : 'password';
      btnVer.textContent = inputContra.type === 'password' ? '👁️' : '🙈';
    });

    btnVer2.addEventListener('click', function() {
      inputContra2.type = inputContra2.type === 'password' ? 'text' : 'password';
      btnVer2.textContent = inputContra2.type === 'password' ? '👁️' : '🙈';
    });

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = 'mensaje ' + tipo;
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      mensaje.className = 'mensaje';

      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const contraseña = document.getElementById('contraseña').value;
      const repetirContraseña = document.getElementById('repetir_contraseña').value;

      // Validación: contraseñas coincidan
      if (contraseña !== repetirContraseña) {
        mostrarMensaje('⚠️ Las contraseñas no coinciden. Escribilas igual.', 'error');
        return;
      }

      // Validación: mínimo 8 caracteres
      if (contraseña.length < 8) {
        mostrarMensaje('⚠️ La contraseña debe tener al menos 8 caracteres.', 'error');
        return;
      }

      boton.disabled = true;
      boton.textContent = 'Verificando...';

      try {
        // 🔍 Primero: revisamos si el correo ya existe
        const { data: usuarioExistente } = await supabaseClient
          .from('usuarios')
          .select('id, correo')
          .eq('correo', correo)
          .maybeSingle();

        if (usuarioExistente) {
          mostrarMensaje('⚠️ Este correo ya está registrado. Iniciá sesión o usá otro correo.', 'aviso-existe');
          boton.disabled = false;
          boton.textContent = 'Crear Cuenta ✅';
          return;
        }

        // ✅ No existe → creamos la cuenta
        const { data: authData, error: errorAuth } = await supabaseClient.auth.signUp({
          email: correo,
          password: contraseña
        });

        if (errorAuth) throw errorAuth;

        // Guardamos el nombre en la tabla usuarios
        if (authData.user) {
          await supabaseClient.from('usuarios').insert({
            id: authData.user.id,
            correo: correo,
            nombre: nombre
          });
        }

        mostrarMensaje('✅ ¡Cuenta creada! Te redirigimos...', 'exito');
        setTimeout(() => { window.location.href = 'index.html'; }, 1800);

      } catch (err) {
        if (err.message.includes('User already registered')) {
          mostrarMensaje('⚠️ Este correo ya tiene una cuenta. Iniciá sesión desde la página principal.', 'aviso-existe');
        } else {
          mostrarMensaje('❌ Error: ' + err.message, 'error');
        }
        boton.disabled = false;
        boton.textContent = 'Crear Cuenta ✅';
      }
    });
  </script>
</body>
</html>
