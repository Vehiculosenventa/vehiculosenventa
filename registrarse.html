<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    h1 {
      color: #2c5282;
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
      font-weight: 800;
    }
    .tarjeta {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(44, 82, 130, 0.12);
      border: 1px solid #e2d9c8;
      max-width: 440px;
      margin: 0 auto;
    }
    h2 {
      color: #2c5282;
      text-align: center;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .subtitulo {
      text-align: center;
      color: #5a6872;
      margin-bottom: 25px;
      font-size: 15px;
    }
    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #2d3748;
    }
    .input-con-boton {
      position: relative;
    }
    input {
      width: 100%;
      padding: 1rem 3rem 1rem 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 4px rgba(49, 130, 206, 0.15);
    }
    .btn-ver {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0;
      color: #718096;
      transition: color 0.2s;
    }
    .btn-ver:hover {
      color: #2c5282;
    }
    button[type="submit"] {
      width: 100%;
      padding: 1rem;
      margin-top: 25px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(49, 130, 206, 0.25);
    }
    button[type="submit"]:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .mensaje {
      margin-top: 1.2rem;
      padding: 1rem;
      border-radius: 10px;
      display: none;
      text-align: center;
      font-weight: 600;
      line-height: 1.5;
    }
    .exito {
      background: #c6f6d5;
      color: #22543d;
      display: block;
    }
    .error {
      background: #fed7d7;
      color: #9b2c2c;
      display: block;
    }
    .volver {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #4a5568;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .volver:hover {
      color: #3182ce;
      text-decoration: underline;
    }
    .volver-inicio {
      margin-top: 20px;
      color: #3182ce;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>🚗 Vehículos en Venta</h1>
  
  <div class="tarjeta">
    <h2>Crear tu cuenta</h2>
    <p class="subtitulo">Completá tus datos para empezar a publicar y buscar vehículos.</p>
    
    <form id="formRegistro">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required placeholder="Tu nombre y apellido">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required placeholder="tu@correo.com">

      <label for="contraseña">Contraseña (máximo 8 caracteres)</label>
      <div class="input-con-boton">
        <input type="password" id="contraseña" required maxlength="8" placeholder="Hasta 8 caracteres">
        <button type="button" class="btn-ver" id="btnVerContra" title="Ver contraseña">👁️</button>
      </div>

      <label for="confirmarContraseña">Confirmar contraseña</label>
      <div class="input-con-boton">
        <input type="password" id="confirmarContraseña" required maxlength="8" placeholder="Repetí la contraseña">
        <button type="button" class="btn-ver" id="btnVerConfirmar" title="Ver contraseña">👁️</button>
      </div>

      <button type="submit" id="btnRegistrar">Crear cuenta ✅</button>
      
      <div id="mensaje" class="mensaje"></div>
    </form>
  </div>

  <a href="iniciar-sesion.html" class="volver">← Ya tengo cuenta — Iniciar sesión</a>
  <a href="index.html" class="volver volver-inicio">← Volver a la página principal</a>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpem5ra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
                          eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps
    const supabaseCliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function configurarBotonVer(inputId, botonId) {
      const input = document.getElementById(inputId);
      const boton = document.getElementById(botonId);
      boton.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        boton.textContent = input.type === 'password' ? '👁️' : '🙈';
        boton.title = input.type === 'password' ? 'Ver contraseña' : 'Ocultar contraseña';
      });
    }
    configurarBotonVer('contraseña', 'btnVerContra');
    configurarBotonVer('confirmarContraseña', 'btnVerConfirmar');

    const form = document.getElementById('formRegistro');
    const mensaje = document.getElementById('mensaje');
    const btn = document.getElementById('btnRegistrar');

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = 'mensaje ' + tipo;
      mensaje.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensaje.style.display = 'none';
      
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const contraseña = document.getElementById('contraseña').value;
      const confirmarContraseña = document.getElementById('confirmarContraseña').value;

      if (contraseña.length < 6) {
        mostrarMensaje('❌ La contraseña debe tener al menos 6 caracteres.', 'error');
        return;
      }

      if (contraseña !== confirmarContraseña) {
        mostrarMensaje('❌ Las contraseñas no coinciden.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const { data, error } = await supabaseCliente.auth.signUp({
          email: correo,
          password: contraseña,
          options: {
            data: { nombre: nombre },
            emailRedirectTo: window.location.origin + '/confirmar.html'
          }
        });

        if (error) throw error;

        mostrarMensaje(
          '✅ Cuenta creada. Revisá tu correo y confirmá tu cuenta para ingresar.',
          'exito'
        );
        form.reset();

      } catch (err) {
        let texto = err.message || 'Error al crear cuenta.';
        if (texto.includes('User already registered')) {
          texto = 'Este correo ya tiene una cuenta. Iniciá sesión.';
        }
        mostrarMensaje('❌ ' + texto, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta ✅';
      }
    });
  </script>
</body>
</html>
