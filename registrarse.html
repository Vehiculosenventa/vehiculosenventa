<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: #faf8f0; /* Cremita suave que usábamos ✨ */
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    h1 {text-align: center; color: #2c5282; margin-bottom: 30px; font-size: 22px;}
    .campo {margin-bottom: 20px;}
    label {display: block; margin-bottom: 6px; color: #4a5568; font-weight: 500;}
    input {
      width: 100%; padding: 12px 15px;
      border: 1px solid #bdd1e1; border-radius: 8px;
      font-size: 16px;
      background: #ffffff;
    }
    input:focus {outline: none; border-color: #6fa8d6; box-shadow: 0 0 0 3px rgba(111,168,214,0.2);}
    button {
      width: 100%; padding: 14px;
      background: #5fa8d3; /* Azul suave */
      color: #ffffff; border: none;
      border-radius: 8px; font-size: 17px; font-weight: 600;
      cursor: pointer; transition: background 0.3s;
    }
    button:hover {background: #4a90c4;}
    .enlace {margin-top: 20px; text-align: center;}
    .enlace a {color: #5fa8d3; text-decoration: none;}
    .enlace a:hover {text-decoration: underline;}
    .error {color: #d64545; margin-top: -10px; margin-bottom: 12px; font-size: 14px; display: none;}
  </style>
</head>
<body>
  <div class="caja">
    <h1>Crear tu Cuenta</h1>

    <div class="campo">
      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" placeholder="tu@correo.com">
    </div>

    <div class="campo">
      <label for="contraseña">Contraseña</label>
      <input type="password" id="contraseña" placeholder="Mínimo 6 caracteres">
    </div>

    <div class="campo">
      <label for="repetir_contraseña">Repetir Contraseña</label>
      <input type="password" id="repetir_contraseña" placeholder="Escribí la misma contraseña">
    </div>

    <div class="error" id="mensaje_error">Las contraseñas no coinciden</div>

    <button onclick="registrar()">Crear Cuenta</button>

    <div class="enlace">
      <a href="index.html">Volver al inicio</a>
    </div>
  </div>

  <script>
    // Tus datos de Supabase
    const SUPABASE_URL = 'PONÉ_TU_URL_AQUÍ';
    const SUPABASE_KEY = 'PONÉ_TU_CLAVE_AQUÍ';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function registrar() {
      const correo = document.getElementById('correo').value.trim();
      const contraseña = document.getElementById('contraseña').value;
      const repetirContraseña = document.getElementById('repetir_contraseña').value;
      const mensajeError = document.getElementById('mensaje_error');

      mensajeError.style.display = 'none';

      if (contraseña !== repetirContraseña) {
        mensajeError.style.display = 'block';
        return;
      }

      if (!correo || contraseña.length < 6) {
        alert("Completá los datos correctamente (contraseña: mínimo 6 caracteres)");
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email: correo,
        password: contraseña,
        options: {
          emailRedirectTo: "https://vehiculosenventa.com.ar/confirmar.html"
        }
      });

      if (error) {
        alert("❌ " + error.message);
      } else if (data.user && !data.session) {
        alert("✅ Listo! Revisá tu correo para confirmar la cuenta");
      } else {
        alert("✅ Cuenta creada! Ya podés entrar");
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
