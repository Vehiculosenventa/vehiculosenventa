<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — Vehículos en Venta</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 450px; margin: 3rem auto; padding: 0 1.5rem; background: #f8fafc; }
    h1 { color: #1e293b; text-align: center; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    label { display: block; margin-top: 1rem; font-weight: 500; color: #334155; }
    .input-con-boton { position: relative; }
    input { width: 100%; padding: 0.85rem 3rem 0.85rem 0.85rem; margin: 0.5rem 0 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    .btn-ver { position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: transparent; border: none; font-size: 1.25rem; cursor: pointer; padding: 0; color: #64748b; }
    .btn-ver:hover { color: #1e293b; }
    button[type="submit"] { width: 100%; padding: 0.9rem; margin-top: 1.5rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button[type="submit"]:hover { background: #1d4ed8; }
    button[type="submit"]:disabled { background: #94a3b8; cursor: not-allowed; }
    .mensaje { margin-top: 1rem; padding: 0.9rem; border-radius: 8px; display: none; }
    .exito { background: #dcfce7; color: #166534; display: block; }
    .error { background: #fee2e2; color: #991b1b; display: block; }
    .volver { display: block; text-align: center; margin-top: 1.5rem; color: #475569; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🚗 Vehículos en Venta</h1>
  <div class="card">
    <h2>Crear tu cuenta</h2>
    <p>Completá tus datos para empezar a publicar y buscar vehículos.</p>
    <form id="formRegistro">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required placeholder="Tu nombre y apellido">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required placeholder="tu@correo.com">

      <label for="contraseña">Contraseña</label>
      <div class="input-con-boton">
        <input type="password" id="contraseña" required minlength="6" placeholder="Mínimo 6 caracteres">
        <button type="button" class="btn-ver" id="btnVerContra" title="Ver contraseña">👁️</button>
      </div>

      <label for="confirmarContraseña">Confirmar contraseña</label>
      <div class="input-con-boton">
        <input type="password" id="confirmarContraseña" required minlength="6" placeholder="Repetí la contraseña">
        <button type="button" class="btn-ver" id="btnVerConfirmar" title="Ver contraseña">👁️</button>
      </div>

      <button type="submit" id="btnRegistrar">Crear cuenta</button>
      
      <div id="mensaje" class="mensaje"></div>
    </form>
  </div>
  <a href="iniciar-sesion.html" class="volver">← Ya tengo cuenta — Iniciar sesión</a>

  <script>
    // Configuración de Supabase
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    // Cliente ÚNICO de Supabase — evita la advertencia de instancias duplicadas
    let supabaseCliente = null;

    async function cargarSupabase() {
      // Si ya existe, lo devolvemos directamente
      if (supabaseCliente) {
        return supabaseCliente;
      }

      // Cargamos la librería solo la primera vez
      if (!window.supabase) {
        await new Promise(resolve => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
          script.onload = resolve;
          document.head.appendChild(script);
        });
      }

      // Creamos el cliente UNA SOLA VEZ
      supabaseCliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      return supabaseCliente;
    }

    // Botón ver/ocultar contraseña
    function configurarBotonVer(inputId, botonId) {
      const input = document.getElementById(inputId);
      const boton = document.getElementById(botonId);
      
      boton.addEventListener('click', () => {
        if (input.type === 'password') {
          input.type = 'text';
          boton.textContent = '🙈';
          boton.title = 'Ocultar contraseña';
        } else {
          input.type = 'password';
          boton.textContent = '👁️';
          boton.title = 'Ver contraseña';
        }
      });
    }

    // Activar ambos botones de contraseña
    configurarBotonVer('contraseña', 'btnVerContra');
    configurarBotonVer('confirmarContraseña', 'btnVerConfirmar');

    // Elementos del formulario
    const form = document.getElementById('formRegistro');
    const mensaje = document.getElementById('mensaje');
    const btn = document.getElementById('btnRegistrar');

    // Mostrar mensaje
    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = 'mensaje ' + tipo;
    }

    // Enviar formulario
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Ocultar mensaje anterior
      mensaje.className = 'mensaje';
      mensaje.style.display = 'none';
      
      // Obtener valores
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const contraseña = document.getElementById('contraseña').value;
      const confirmarContraseña = document.getElementById('confirmarContraseña').value;

      // Validar que coincidan
      if (contraseña !== confirmarContraseña) {
        mostrarMensaje('❌ Las contraseñas no coinciden. Escribilas iguales.', 'error');
        mensaje.style.display = 'block';
        return;
      }

      // Bloquear botón
      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const supabase = await cargarSupabase();
        
        // Registrar usuario
        const { data, error } = await supabase.auth.signUp({
          email: correo,
          password: contraseña,
          options: {
            data: { nombre: nombre },
            emailRedirectTo: window.location.origin + '/confirmar.html'
          }
        });

        if (error) throw error;

        // Éxito
        mostrarMensaje('✅ Cuenta creada. Revisá tu correo y confirmá tu cuenta para ingresar.', 'exito');
        mensaje.style.display = 'block';
        form.reset();

      } catch (err) {
        mostrarMensaje('❌ ' + (err.message || 'Error al crear cuenta.'), 'error');
        mensaje.style.display = 'block';
      } finally {
        // Restaurar botón
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
