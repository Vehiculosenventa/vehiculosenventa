<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse — Vehículos en Venta</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 450px; margin: 3rem auto; padding: 0 1.5rem; background: #f8fafc; }
    h1 { color: #1e293b; text-align: center; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    label { display: block; margin-top: 1rem; font-weight: 500; color: #334155; }
    input { width: 100%; padding: 0.85rem; margin: 0.5rem 0 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
    button { width: 100%; padding: 0.9rem; margin-top: 1.5rem; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .mensaje { margin-top: 1rem; padding: 0.9rem; border-radius: 8px; display: none; }
    .exito { background: #dcfce7; color: #166534; display: block; }
    .error { background: #fee2e2; color: #991b1b; display: block; }
    .volver { display: block; text-align: center; margin-top: 1.5rem; color: #475569; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🚗 Vehículos en Venta</h1>
  <div class="card">
    <h2>Crear tu cuenta</h2>
    <p>Completá tus datos para empezar a publicar y buscar vehículos.</p>

    <form id="formRegistro">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required placeholder="Tu nombre y apellido">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required placeholder="tu@correo.com">

      <label for="contraseña">Contraseña</label>
      <input type="password" id="contraseña" required minlength="6" placeholder="Mínimo 6 caracteres">

      <label for="confirmarContraseña">Confirmar contraseña</label>
      <input type="password" id="confirmarContraseña" required minlength="6" placeholder="Repetí la contraseña">

      <button type="submit" id="btnRegistrar">Crear cuenta</button>
      
      <div id="mensaje" class="mensaje"></div>
    </form>
  </div>

  <a href="iniciar-sesion.html" class="volver">← Ya tengo cuenta — Iniciar sesión</a>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZizendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    async function cargarSupabase() {
      if (!window.supabase) {
        await new Promise(res => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
          s.onload = res;
          document.head.appendChild(s);
        });
      }
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const form = document.getElementById('formRegistro');
    const mensaje = document.getElementById('mensaje');
    const btn = document.getElementById('btnRegistrar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      mensaje.className = 'mensaje';
      mensaje.textContent = '';
      
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const contraseña = document.getElementById('contraseña').value;
      const confirmarContraseña = document.getElementById('confirmarContraseña').value;

      // Verificar que las contraseñas coincidan
      if (contraseña !== confirmarContraseña) {
        mensaje.textContent = '❌ Las contraseñas no coinciden. Escribilas iguales.';
        mensaje.classList.add('error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
        const supabase = await cargarSupabase();
        
        const { data, error } = await supabase.auth.signUp({
          email: correo,
          password: contraseña,
          options: {
            data: { nombre: nombre }
          }
        });

        if (error) throw error;

        mensaje.innerHTML = '✅ Cuenta creada. Revisá tu correo y confirmá tu cuenta para ingresar.';
        mensaje.classList.add('exito');
        form.reset();
      } catch (err) {
        mensaje.textContent = '❌ ' + (err.message || 'No se pudo crear la cuenta. Intentá nuevamente.');
        mensaje.classList.add('error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
