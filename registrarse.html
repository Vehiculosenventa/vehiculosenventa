<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: #faf8f0; /* Cremita suave ✨ */
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    h1 {text-align: center; color: #2c5282; margin-bottom: 30px; font-size: 22px;}
    .campo {margin-bottom: 20px; position: relative;}
    label {display: block; margin-bottom: 6px; color: #4a5568; font-weight: 500;}
    /* TODOS los campos iguales ✅ */
    .input-estilo {
      width: 100%; padding: 12px 15px;
      border: 1px solid #bdd1e1; border-radius: 8px;
      font-size: 16px;
      background: #ffffff;
    }
    .input-estilo:focus {outline: none; border-color: #6fa8d6; box-shadow: 0 0 0 3px rgba(111,168,214,0.2);}
    
    .input-con-ojo {position: relative;}
    .input-con-ojo .input-estilo {padding-right: 45px;} /* Espacio para el ojito */
    .ojo {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 20px; color: #6b7280;
      user-select: none;
    }
    .ojo:hover {color: #3182ce;}
    
    .indicador {font-size: 13px; color: #718096; margin-top: 5px;}
    
    button {
      width: 100%; padding: 14px;
      background: #5fa8d3; /* Azul suave */
      color: #ffffff; border: none;
      border-radius: 8px; font-size: 17px; font-weight: 600;
      cursor: pointer; transition: background 0.3s;
    }
    button:hover {background: #4a90c4;}
    .enlace {margin-top: 20px; text-align: center;}
    .enlace a {color: #5fa8d3; text-decoration: none;}
    .enlace a:hover {text-decoration: underline;}
    .error {color: #d64545; margin-top: -10px; margin-bottom: 12px; font-size: 14px; display: none;}
  </style>
</head>
<body>
  <div class="caja">
    <h1>Crear tu Cuenta</h1>

    <div class="campo">
      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" class="input-estilo" placeholder="tu@correo.com">
    </div>

    <div class="campo">
      <label for="contraseña">Contraseña (máximo 8 caracteres)</label>
      <div class="input-con-ojo">
        <input type="password" id="contraseña" class="input-estilo" placeholder="Entre 6 y 8 caracteres" maxlength="8">
        <span class="ojo" onclick="toggleVer('contraseña', this)">👁️</span>
      </div>
      <div class="indicador" id="contadorContraseña">0 / 8 caracteres</div>
    </div>

    <div class="campo">
      <label for="repetir_contraseña">Repetir Contraseña</label>
      <div class="input-con-ojo">
        <input type="password" id="repetir_contraseña" class="input-estilo" placeholder="Repetí la contraseña" maxlength="8">
        <span class="ojo" onclick="toggleVer('repetir_contraseña', this)">👁️</span>
      </div>
      <div class="indicador" id="contadorRepetir">0 / 8 caracteres</div>
    </div>

    <div class="error" id="mensaje_error">Las contraseñas no coinciden o no tienen entre 6 y 8 caracteres</div>

    <button onclick="registrar()">Crear Cuenta</button>

    <div class="enlace">
      <a href="index.html">Volver al inicio</a>
    </div>
  </div>

  <script>
    // Tus datos de Supabase — YA PUESTOS ✅
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Contar caracteres en tiempo real
    document.getElementById('contraseña').addEventListener('input', function() {
      document.getElementById('contadorContraseña').textContent = this.value.length + ' / 8 caracteres';
    });
    document.getElementById('repetir_contraseña').addEventListener('input', function() {
      document.getElementById('contadorRepetir').textContent = this.value.length + ' / 8 caracteres';
    });

    // Ojito 👁️
    function toggleVer(idCampo, elemento) {
      const campo = document.getElementById(idCampo);
      campo.type = campo.type === 'password' ? 'text' : 'password';
      elemento.textContent = campo.type === 'password' ? '👁️' : '🙈';
    }

    async function registrar() {
      const correo = document.getElementById('correo').value.trim();
      const contraseña = document.getElementById('contraseña').value;
      const repetirContraseña = document.getElementById('repetir_contraseña').value;
      const mensajeError = document.getElementById('mensaje_error');

      mensajeError.style.display = 'none';

      // Validar longitud: mínimo 6, máximo 8
      if (contraseña.length < 6 || contraseña.length > 8) {
        mensajeError.style.display = 'block';
        return;
      }

      // Validar que coincidan
      if (contraseña !== repetirContraseña) {
        mensajeError.style.display = 'block';
        return;
      }

      if (!correo) {
        alert("Escribí tu correo electrónico");
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email: correo,
        password: contraseña,
        options: {
          emailRedirectTo: "https://vehiculosenventa.com.ar/confirmar.html"
        }
      });

      if (error) {
        alert("❌ " + error.message);
      } else if (data.user && !data.session) {
        alert("✅ Listo! Revisá tu correo para confirmar la cuenta");
      } else {
        alert("✅ Cuenta creada! Ya podés entrar");
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
