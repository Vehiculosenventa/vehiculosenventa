<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;}
    .caja {background: #f8fafc; padding: 35px; border-radius: 20px; width: 100%; max-width: 450px; box-shadow: 0 5px 20px rgba(0,0,0,0.08);}
    h1 {color: #2c5282; text-align: center; margin-bottom: 25px; font-size: 22px;}
    input {width: 100%; padding: 13px; border: 2px solid #c5d6e8; border-radius: 10px; font-size: 16px; margin-bottom: 20px;}
    button {width: 100%; padding: 14px; background: #3182ce; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer;}
    .ok {color: #166534; margin-top: 20px; font-weight: bold;}
    .mal {color: #c53030; margin-top: 20px; font-weight: bold;}
  </style>
</head>
<body>
  <div class="caja">
    <h1>🔑 Recuperar Contraseña</h1>
    <input type="email" id="correo" placeholder="Tu correo electrónico">
    <button onclick="buscar()">Buscar</button>
    <p id="mensaje"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZizndra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function buscar() {
      const correo = document.getElementById('correo').value.trim();
      const msg = document.getElementById('mensaje');
      msg.textContent = 'Buscando...';
      msg.className = '';

      const { data, error } = await supabase
        .from('usuarios')
        .select('correo')
        .eq('correo', correo)
        .limit(1);

      if (error) {
        msg.textContent = '❌ Error: ' + error.message;
        msg.className = 'mal';
      } else if (data.length > 0) {
        msg.textContent = '✅ Correo encontrado — enviamos el enlace';
        msg.className = 'ok';
      } else {
        msg.textContent = '❌ No encontramos ese correo';
        msg.className = 'mal';
      }
    }
  </script>
</body>
</html>
