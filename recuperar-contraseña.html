<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: #faf8f0; /* Cremita de siempre */
      padding: 40px 30px;
      border-radius: 24px;
      max-width: 420px; width: 100%;
      box-shadow: 0 8px 25px rgba(44, 82, 130, 0.12);
      border: 1px solid #f0e9d6;
    }
    h1 {color: #2c5282; text-align: center; margin-bottom: 10px; font-size: 22px; font-weight: 800;}
    .subtitulo {color: #5a6872; text-align: center; margin-bottom: 25px; font-size: 15px; line-height: 1.5;}
    label {display: block; margin-bottom: 8px; margin-top: 10px; font-weight: 600; color: #2c5282;}
    input {
      width: 100%; padding: 14px 16px; border: 2px solid #ddd; border-radius: 12px;
      font-size: 15px; background: #fff;
    }
    input:focus {outline: none; border-color: #3182ce;}
    .boton-azul {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #3182ce, #2b6cb0); color: #fff;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px;
      transition: transform 0.2s;
    }
    .boton-azul:hover {transform: translateY(-2px);}
    .mensaje {margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; font-weight: 600; display: none;}
    .exito {background: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7;}
    .error {background: #ffebee; color: #c62828; border: 2px solid #ef9a9a;}
    .enlace-volver {
      display: block; text-align: center; margin-top: 25px;
      color: #3182ce; font-weight: 600; text-decoration: none;
    }
    .enlace-volver:hover {text-decoration: underline;}
  </style>
</head>
<body>
<div class="caja">
  <h1>🔑 Recuperar Contraseña</h1>
  <p class="subtitulo">Escribí tu correo y te enviamos un enlace para crear una contraseña nueva</p>

  <label for="correo">Correo electrónico</label>
  <input type="email" id="correo" placeholder="tu@correo.com" required>

  <button id="btnEnviar" class="boton-azul">📧 Enviar Enlace</button>

  <div id="mensaje" class="mensaje"></div>

  <a href="index.html" class="enlace-volver">← Volver al Inicio</a>
</div>

<script>
const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function mostrarMensaje(texto, tipo) {
  const m = document.getElementById('mensaje');
  m.style.display = 'block';
  m.className = 'mensaje ' + tipo;
  m.textContent = texto;
}

document.getElementById('btnEnviar').addEventListener('click', async () => {
  const correo = document.getElementById('correo').value.trim();
  if (!correo) {
    mostrarMensaje('⚠️ Escribí tu correo', 'error');
    return;
  }

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(correo, {
      redirectTo: window.location.origin + '/confirmar-contraseña.html'
    });

    if (error) throw error;
    mostrarMensaje('✅ Enlace enviado! Revisá tu correo 📬', 'exito');
    document.getElementById('correo').value = '';
  } catch (err) {
    mostrarMensaje('❌ Error: ' + err.message, 'error');
  }
});
</script>
</body>
</html>
