<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .caja {
      background: #f8fafc;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      text-align: center;
      color: #1e40af;
      margin-bottom: 25px;
      font-size: 1.4rem;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      background: #ffffff;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #2563eb;
    }
    .mensaje {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
      display: none;
    }
    .error {
      background: #fee2e2;
      color: #b91c1c;
    }
    .exito {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>

<div class="caja">
  <h2>🔑 Recuperar Contraseña</h2>
  <input type="email" id="correo" placeholder="Escribí tu correo electrónico">
  <button onclick="enviarEnlace()">Enviar enlace de recuperación</button>
  <div id="mensaje" class="mensaje"></div>
</div>

<script>
// Tus datos de Supabasehttps://  
const SUPABASE_URL = "uhdypavizwkkbygrvuex.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

// Inicializamos Supabase
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// Función de recuperación — directa a Supabase
async function enviarEnlace() {
  const correo = document.getElementById("correo").value.trim();
  const mensaje = document.getElementById("mensaje");
  mensaje.style.display = "none";

  if (!correo) {
    mensaje.textContent = "⚠️ Escribí tu correo";
    mensaje.className = "mensaje error";
    mensaje.style.display = "block";
    return;
  }

  try {
    // Enviamos el enlace — Supabase busca solo en la tabla de autenticación
    const { error } = await sb.auth.resetPasswordForEmail(correo, {
      redirectTo: "https://vehiculosenventa.com.ar/confirmar-contraseña.html"
    });

    if (error) throw error;

    mensaje.textContent = "✅ Enlace enviado! Revisá tu correo (y también Spam)";
    mensaje.className = "mensaje exito";
    mensaje.style.display = "block";

  } catch (err) {
    if (err.message.includes("User not found") || err.message.includes("no user")) {
      mensaje.textContent = "❌ No encontramos ese correo";
    } else {
      mensaje.textContent = "❌ " + err.message;
    }
    mensaje.className = "mensaje error";
    mensaje.style.display = "block";
  }
}
</script>

</body>
</html>
