<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .caja {
      background: #f8fafc;  /* ✅ Blanco suave, no brillante */
      padding: 35px;
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    h1 {
      color: #2c5282;
      text-align: center;
      margin-bottom: 25px;
      font-size: 22px;
    }
    .campo {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444444;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #c5d6e8;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
    }
    input:focus {
      border-color: #3182ce;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #2b6cb0;
    }
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .exito {
      background: #f0fff4;
      color: #166534;
      border: 2px solid #bbf7d0;
      display: block;
    }
    .error {
      background: #fef2f2;
      color: #c53030;
      border: 2px solid #fecaca;
      display: block;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>🔑 Recuperar Contraseña</h1>
    <form id="formRecuperar">
      <div class="campo">
        <label for="correo">Tu correo electrónico</label>
        <input type="email" id="correo" required placeholder="tucorreo@ejemplo.com">
      </div>
      <button type="submit">📩 Enviar enlace de recuperación</button>
    </form>
    <div id="mensaje" class="mensaje"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZizndra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    // UNA SOLA VEZ — SIN REPETIR ✅
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const form = document.getElementById('formRecuperar');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const correo = document.getElementById('correo').value.trim();
      
      mensaje.className = 'mensaje';
      mensaje.textContent = 'Enviando...';
      mensaje.style.display = 'block';
      mensaje.style.background = '#ebf8ff';
      mensaje.style.color = '#2c5282';
      mensaje.style.border = '2px solid #bee3f8';

      const { error } = await supabase.auth.resetPasswordForEmail(correo, {
        redirectTo: window.location.origin + "/crear-contraseña.html"
      });

      if (error) {
        mensaje.className = 'mensaje error';
        mensaje.textContent = '❌ ' + error.message;
      } else {
        mensaje.className = 'mensaje exito';
        mensaje.textContent = '✅ ¡Revisá tu correo! Te mandamos el enlace';
      }
    });
  </script>
</body>
</html>
