<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .caja {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      border-radius: 28px;
      padding: 45px 35px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(44,82,130,0.08);
      border: 1px solid #e2d9c8;
    }
    h1 {
      color: #2c5282;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitulo {
      color: #5a6872;
      text-align: center;
      margin-bottom: 30px;
      font-size: 15px;
      line-height: 1.5;
    }
    .campo {margin-bottom: 20px;}
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #c5d6e8;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.12);
    }
    .boton {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .boton:disabled {
      background: #a0aec0;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 600;
      text-align: center;
      line-height: 1.5;
    }
    .exito {
      background: #f0fff4;
      border: 2px solid #9ae6b4;
      color: #276749;
    }
    .error {
      background: #fff5f5;
      border: 2px solid #feb2b2;
      color: #c53030;
    }
    .enlace {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #3182ce;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>🔑 Olvidé mi contraseña</h1>
    <p class="subtitulo">Escribí tu correo y te mandamos el enlace para crear una clave nueva</p>

    <form id="formRecuperar">
      <div class="campo">
        <label for="correo">Tu correo electrónico</label>
        <input type="email" id="correo" required placeholder="tu@correo.com">
      </div>
      <button type="submit" id="btnEnviar" class="boton">📩 Enviar enlace</button>
    </form>

    <div id="mensaje" class="mensaje"></div>

    <a href="iniciar-sesion.html" class="enlace">← Volver a Iniciar Sesión</a>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZizndra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    // ✅ UNA SOLA VEZ — sin repetir!
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const formRecuperar = document.getElementById('formRecuperar');
    const btnEnviar = document.getElementById('btnEnviar');
    const mensaje = document.getElementById('mensaje');

    formRecuperar.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnEnviar.disabled = true;
      mensaje.style.display = 'none';

      const correo = document.getElementById('correo').value.trim();

      try {
        const { data: usuario, error: errBusqueda } = await supabase
          .from('usuarios')
          .select('id, nombre, correo')
          .eq('correo', correo)
          .single();

        if (errBusqueda) throw new Error("No encontramos ese correo");

        const funcionUrl = SUPABASE_URL + "/functions/v1/enviar-recuperacion";

        const respuesta = await fetch(funcionUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            correo: usuario.correo,
            nombre: usuario.nombre,
            enlace: window.location.origin + "/crear-contraseña.html"
          })
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) throw new Error(resultado.error || "No se pudo enviar");

        mensaje.className = 'mensaje exito';
        mensaje.style.display = 'block';
        mensaje.innerHTML = "✅ ¡Listo! Revisá tu correo 📬<br>Te mandamos el enlace para crear tu contraseña nueva";
        formRecuperar.style.display = 'none';

      } catch (err) {
        mensaje.className = 'mensaje error';
        mensaje.style.display = 'block';
        mensaje.innerHTML = "❌ " + err.message;
      }

      btnEnviar.disabled = false;
    });
  </script>
</body>
</html>
