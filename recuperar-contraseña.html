<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;}
    .caja {background: #f8fafc; padding: 35px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px;}
    h2 {text-align: center; color: #2c5282; margin-bottom: 25px;}
    input {width: 100%; padding: 14px; margin-bottom: 18px; border: 2px solid #cfe0ee; border-radius: 10px; font-size: 16px;}
    button {width: 100%; padding: 14px; background: #3182ce; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; transition: background 0.3s;}
    button:hover {background: #2b6cb0;}
    .mensaje {margin-top: 20px; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; display: none;}
    .exito {background: #f0fff4; color: #22543d; border: 1px solid #9ae6b4;}
    .error {background: #fff5f5; color: #742a2a; border: 1px solid #feb2b2;}
  </style>
</head>
<body>
  <div class="caja">
    <h2>🔑 Recuperar Contraseña</h2>
    <input type="email" id="correo" placeholder="Escribí tu correo electrónico">
    <button onclick="enviarEnlace()">Enviar enlace de recuperación</button>
    <div id="mensaje" class="mensaje"></div>
  </div>

<script>
// Tus datos — poné tu clave completa
const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

// Cliente con nombre distinto → SIN CONFLICTO ✅
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

async function enviarEnlace() {
  const correo = document.getElementById("correo").value.trim();
  const mensaje = document.getElementById("mensaje");
  mensaje.style.display = "none";

  if (!correo) {
    mensaje.textContent = "⚠️ Escribí tu correo";
    mensaje.className = "mensaje error";
    mensaje.style.display = "block";
    return;
  }

  try {
    // 1° Verificamos si el correo existe
    const { data, error: errorBusqueda } = await sb
      .from("usuarios")
      .select("Email")
      .eq("Email", correo)
      .limit(1);

    if (errorBusqueda) throw errorBusqueda;

    if (!data || data.length === 0) {
      mensaje.textContent = "❌ No encontramos ese correo";
      mensaje.className = "mensaje error";
      mensaje.style.display = "block";
      return;
    }

    // 2° Enviamos el enlace de recuperación
    const { error } = await sb.auth.resetPasswordForEmail(correo, {
      redirectTo: "https://vehiculosenventa.com.ar/confirmar-contraseña.html"
    });

    if (error) throw error;

    mensaje.textContent = "✅ Enlace enviado! Revisá tu correo";
    mensaje.className = "mensaje exito";
    mensaje.style.display = "block";

  } catch (err) {
    mensaje.textContent = "❌ " + err.message;
    mensaje.className = "mensaje error";
    mensaje.style.display = "block";
  }
}
</script>
</body>
</html>
