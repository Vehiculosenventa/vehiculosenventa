<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ingresar Vehículo — Vehículos en Venta</title>

    * {box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #94b8d9 0%, #7aa7c9 100%);
      padding: 20px;
      max-width: 850px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    h1 {
      text-align: center;
      color: #1a365d;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 800;
      position: relative;
      z-index: 2;
    }
    .form-container {
      background: #dcc9ad;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(26, 54, 93, 0.15);
      border: 2px solid #c49a6c;
      position: relative;
      z-index: 2;
    }
    .fila { display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo { flex: 1 1 45%; min-width: 160px; }
    .campo-completo { flex: 1 1 100%; margin-bottom: 18px; }
    .etiqueta-linea {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }
    .etiqueta-linea label {
      font-weight: 600;
      color: #1a365d;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #94b8d9;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #2d3748;
      position: relative;
      z-index: 2;
    }
    input:disabled, select:disabled, textarea:disabled {
      background: #d9d9d9;
      color: #666;
      cursor: not-allowed;
      border-color: #b8b8b8;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2b6cb0;
    }
    .fila-chk { display: flex; gap: 30px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo-chk { display: flex; align-items: center; gap: 8px; }
    .campo-chk input { width: auto; margin: 0; }
    .boton {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #2b6cb0, #2c5282);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      position: relative;
      z-index: 2;
    }
    .boton:disabled { background: #8898aa; cursor: not-allowed; }
    
    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0;
      background: transparent;
      border-radius: 0;
      position: relative;
      z-index: 2;
    }
    .texto-conectado {
      color: #16a34a;
      font-weight: 700;
      font-size: 15px;
    }
    .enlace-cerrar-sesion {
      color: #1e5a96;
      background: transparent;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      white-space: nowrap;
    }
    .enlace-cerrar-sesion:hover { color: #2c5282; }
    
    .aviso-sesion {
      padding: 12px; border-radius: 10px; font-weight: 600;
      flex: 1; text-align: center;
      position: relative;
      z-index: 2;
    }
    .no-conectado { background: #fef5e7; color: #744210; border: 1px solid #fdeaa8; }
