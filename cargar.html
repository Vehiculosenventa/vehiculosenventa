<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar Vehículo — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #91b8d5 0%, #7aa7c9 100%);
      padding: 20px;
      max-width: 850px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 800;
    }
    .form-container {
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(44,82,130,0.12);
      border: 1px solid #bfa980;
    }
    .fila { display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo { flex: 1 1 45%; min-width: 160px; }
    .campo-completo { flex: 1 1 100%; margin-bottom: 18px; }
    .etiqueta-linea {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }
    .etiqueta-linea label {
      font-weight: 600;
      color: #5a4f3f;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #c5d6e8;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #4a5568;
    }
    input:disabled, select:disabled, textarea:disabled {
      background: #e9ecef;
      color: #888;
      cursor: not-allowed;
      border-color: #ddd;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
    }
    .fila-chk { display: flex; gap: 30px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo-chk { display: flex; align-items: center; gap: 8px; }
    .campo-chk input { width: auto; margin: 0; }
    .boton {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .boton:disabled { background: #a0aec0; cursor: not-allowed; }
    
    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px 0;
    }
    .texto-conectado {
      color: #22543d;
      font-weight: 600;
      font-size: 15px;
    }
    .enlace-cerrar-sesion {
      color: #3182ce;
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
    }
    .enlace-cerrar-sesion:hover { color: #2b6cb0; }
    
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 600;
    }
    .exito { background: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
    .error { background: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
    .volver {
      display: inline-block;
      margin-top: 22px;
      color: #1e40af;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 18px;
      background: rgba(255,255,255,0.6);
      border-radius: 10px;
    }
    .volver:hover { background: #d7e6f2; }
    .botones-sesion {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .boton-sesion {
      flex: 1;
      max-width: 200px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      color: #fff;
      text-align: center;
      font-size: 15px;
    }
    .oculto { display: none !important; }
    .campo-otra-ciudad { margin-top: 10px; }
  </style>
</head>
<body>

  <h1>🚗 Ingresar Vehículo</h1>

  <div class="form-container">
    
    <div id="cargando" style="text-align:center; color:#3182ce; font-weight:600; padding:20px;">
      🔍 Verificando sesión...
    </div>

    <div id="bloqueNoConectado" class="oculto">
      <div style="text-align:center; padding:12px; background:#fff3cd; color:#744210; border-radius:10px; border:1px solid #fde68a; font-weight:600; margin-bottom:15px;">
        🔒 Iniciá sesión para publicar tu vehículo
      </div>
      <div class="botones-sesion">
        <a href="iniciar-sesion.html" class="boton-sesion">🔑 Iniciar Sesión</a>
        <a href="registrarse.html" class="boton-sesion">📝 Registrarse</a>
      </div>
    </div>

    <div id="bloqueConectado" class="oculto">
      <div class="barra-superior">
        <span class="texto-conectado">✅ Conectado</span>
        <button id="btn-cerrar-sesion" class="enlace-cerrar-sesion">Cerrar sesión</button>
      </div>
      
      <div style="text-align:center; margin:15px 0; color:#718096;">— Completá los datos del vehículo —</div>
    </div>

    <form id="formAuto">
      
      <div class="fila">
        <div class="campo-completo">
          <div class="etiqueta-linea">
            <span>🚙</span>
            <label>Tipo de Vehículo *</label>
          </div>
          <select id="tipo_vehiculo" required disabled>
            <option value="">Seleccionar...</option>
            <option value="4x4">4x4</option>
            <option value="Auto">Auto</option>
            <option value="Camioneta">Camioneta</option>
            <option value="Cuatriciclo">Cuatriciclo</option>
            <option value="Furgon">Furgon</option>
            <option value="Moto">Moto</option>
            <option value="SUV">SUV</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>🏷️</span>
            <label>Marca</label>
          </div>
          <input type="text" id="marca" placeholder="Ej: Toyota, Ford" required disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>📋</span>
            <label>Modelo</label>
          </div>
          <input type="text" id="modelo" placeholder="Ej: Corolla, Fiesta" required disabled>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>⚙️</span>
            <label>Versión</label>
          </div>
          <input type="text" id="version" placeholder="Ej: XEi, 1.6 LT" disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>⛽</span>
            <label>Combustible</label>
          </div>
          <select id="combustible" disabled>
            <option value="">Seleccionar...</option>
            <option>Nafta</option>
            <option>Diésel</option>
            <option>Eléctrico</option>
            <option>Híbrido</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>📅</span>
            <label>Año</label>
          </div>
          <input type="number" id="anio" placeholder="Ej: 2015" disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>🔄</span>
            <label>Transmisión</label>
          </div>
          <select id="transmision" disabled>
            <option value="">Seleccionar...</option>
            <option>Manual</option>
            <option>Automática</option>
          </select>
        </div>
