<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar Vehículo — Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', Roboto, sans-serif;}
    body {
      background: linear-gradient(135deg, #91b8d5 0%, #7aa7c9 100%);
      padding: 20px;
      max-width: 850px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 800;
    }
    .form-container {
      background: linear-gradient(135deg, #d9c9ad 0%, #c9b58a 100%);
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 6px 16px rgba(44,82,130,0.12);
      border: 1px solid #bfa980;
    }
    .fila { display: flex; gap: 15px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo { flex: 1 1 45%; min-width: 160px; }
    .campo-completo { flex: 1 1 100%; margin-bottom: 18px; }
    .etiqueta-linea {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 7px;
    }
    .etiqueta-linea label {
      font-weight: 600;
      color: #5a4f3f;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #c5d6e8;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #4a5568;
    }
    input:disabled, select:disabled, textarea:disabled {
      background: #e9ecef;
      color: #888;
      cursor: not-allowed;
      border-color: #ddd;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
    }
    .fila-chk { display: flex; gap: 30px; margin-bottom: 18px; flex-wrap: wrap; }
    .campo-chk { display: flex; align-items: center; gap: 8px; }
    .campo-chk input { width: auto; margin: 0; }
    .boton {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .boton:disabled { background: #a0aec0; cursor: not-allowed; }
    
    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 10px 0;
    }
    .texto-conectado {
      color: #22543d;
      font-weight: 600;
      font-size: 15px;
    }
    .enlace-cerrar-sesion {
      color: #3182ce;
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      white-space: nowrap;
    }
    .enlace-cerrar-sesion:hover { color: #2b6cb0; }
    
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 600;
    }
    .exito { background: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
    .error { background: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
    .volver {
      display: inline-block;
      margin-top: 22px;
      color: #1e40af;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 18px;
      background: rgba(255,255,255,0.6);
      border-radius: 10px;
    }
    .volver:hover { background: #d7e6f2; }
    .botones-sesion {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: nowrap;
    }
    .boton-sesion {
      flex: 1;
      max-width: 200px;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      color: #fff;
      text-align: center;
      font-size: 15px;
    }
    .oculto { display: none !important; }
    .campo-otra-ciudad { margin-top: 10px; }
  </style>
</head>
<body>

  <h1>🚗 Ingresar Vehículo</h1>

  <div class="form-container">
    
    <div id="cargando" style="text-align:center; color:#3182ce; font-weight:600; padding:20px;">
      🔍 Verificando sesión...
    </div>

    <div id="bloqueNoConectado" class="oculto">
      <div style="text-align:center; padding:12px; background:#fff3cd; color:#744210; border-radius:10px; border:1px solid #fde68a; font-weight:600; margin-bottom:15px;">
        🔒 Iniciá sesión para publicar tu vehículo
      </div>
      <div class="botones-sesion">
        <a href="iniciar-sesion.html" class="boton-sesion">🔑 Iniciar Sesión</a>
        <a href="registrarse.html" class="boton-sesion">📝 Registrarse</a>
      </div>
    </div>

    <div id="bloqueConectado" class="oculto">
      <div class="barra-superior">
        <span class="texto-conectado">✅ Conectado</span>
        <button id="btn-cerrar-sesion" class="enlace-cerrar-sesion">Cerrar sesión</button>
      </div>
      
      <div style="text-align:center; margin:15px 0; color:#718096;">— Completá los datos del vehículo —</div>
    </div>

    <form id="formAuto">
      
      <div class="fila">
        <div class="campo-completo">
          <div class="etiqueta-linea">
            <span>🚙</span>
            <label>Tipo de Vehículo *</label>
          </div>
          <select id="tipo_vehiculo" required disabled>
            <option value="">Seleccionar...</option>
            <option value="4x4">4x4</option>
            <option value="Auto">Auto</option>
            <option value="Camioneta">Camioneta</option>
            <option value="Cuatriciclo">Cuatriciclo</option>
            <option value="Furgon">Furgon</option>
            <option value="Moto">Moto</option>
            <option value="SUV">SUV</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>🏷️</span>
            <label>Marca</label>
          </div>
          <input type="text" id="marca" placeholder="Ej: Toyota, Ford" required disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>📋</span>
            <label>Modelo</label>
          </div>
          <input type="text" id="modelo" placeholder="Ej: Corolla, Fiesta" required disabled>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>⚙️</span>
            <label>Versión</label>
          </div>
          <input type="text" id="version" placeholder="Ej: XEi, 1.6 LT" disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>⛽</span>
            <label>Combustible</label>
          </div>
          <select id="combustible" disabled>
            <option value="">Seleccionar...</option>
            <option>Nafta</option>
            <option>Diésel</option>
            <option>Eléctrico</option>
            <option>Híbrido</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>📅</span>
            <label>Año</label>
          </div>
          <input type="number" id="anio" placeholder="Ej: 2015" disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>🔄</span>
            <label>Transmisión</label>
          </div>
          <select id="transmision" disabled>
            <option value="">Seleccionar...</option>
            <option>Manual</option>
            <option>Automática</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>🛣️</span>
            <label>Kilometraje</label>
          </div>
          <input type="number" id="kilometraje" placeholder="Ej: 85000" disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>💰</span>
            <label>Precio $</label>
          </div>
          <input type="number" id="precio" placeholder="Ej: 9500000" required disabled>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <div class="etiqueta-linea">
            <span>👤</span>
            <label>Dueño / Agencia</label>
          </div>
          <input type="text" id="dueno" placeholder="Tu nombre o nombre del local" required disabled>
        </div>
        <div class="campo">
          <div class="etiqueta-linea">
            <span>📞</span>
            <label>Teléfono / WhatsApp</label>
          </div>
          <input type="tel" id="telefono" placeholder="Ej: +54 9 341 123-4567" required disabled>
        </div>
      </div>

      <div class="fila">
        <div class="campo-completo">
          <div class="etiqueta-linea">
            <span>📍</span>
            <label>Dirección</label>
          </div>
          <input type="text" id="direccion" placeholder="Ej: Av. San Martín 1234" required disabled>
        </div>
      </div>

      <div class="fila">
        <div class="campo-completo">
          <div class="etiqueta-linea">
            <span>🏘️</span>
            <label>Ciudad / Localidad</label>
          </div>
          <select id="ciudad" disabled>
            <option value="">Seleccionar...</option>
            <option>Arroyo Seco</option>
            <option>Capitán Bermúdez</option>
            <option>Casilda</option>
            <option>Cañada de Gómez</option>
            <option>Coronda</option>
            <option>Esperanza</option>
            <option>Fighiera</option>
            <option>Fray Luis Beltrán</option>
            <option>Funes</option>
            <option>Granadero Baigorria</option>
            <option>Nelson</option>
            <option>Oliveros</option>
            <option>Pavón</option>
            <option>Pérez</option>
            <option>Pueblo Esther</option>
            <option>Puerto General San Martín</option>
            <option>Rafaela</option>
            <option>Recreo</option>
            <option>Roldán</option>
            <option>Rosario</option>
            <option>San Carlos Centro</option>
            <option>San Carlos Norte</option>
            <option>San Carlos Sud</option>
            <option>San Lorenzo</option>
            <option>Santa Fe</option>
            <option>Santo Tomé</option>
            <option>Timbúes</option>
            <option>Venado Tuerto</option>
            <option>Villa Constitución</option>
            <option>Zavalla</option>
            <option value="otra">Otra ciudad...</option>
          </select>
        </div>
      </div>

      <div class="fila campo-otra-ciudad oculto" id="bloqueOtraCiudad">
        <div class="campo-completo">
          <div class="etiqueta-linea">
            <span>✏️</span>
            <label>Escribí tu ciudad</label>
          </div>
          <input type="text" id="ciudad_otra" placeholder="Nombre de tu ciudad..." disabled>
        </div>
      </div>

      <div class="fila-chk">
        <div class="campo-chk">
          <span>🔄</span>
          <input type="checkbox" id="permuta" disabled>
          <label for="permuta">Acepta permuta</label>
        </div>
        <div class="campo-chk">
          <span>💵</span>
          <input type="checkbox" id="contado" disabled>
          <label for="contado">Solo venta al contado</label>
        </div>
      </div>

      <div class="fila">
        <div class="campo-completo">
          <div class="etiqueta-linea">
            <span>📝</span>
            <label>Deudas / Patentes / Multas</label>
          </div>
          <textarea id="deuda" rows="2" placeholder="Escribí si tiene alguna deuda o dejá vacío si no tiene..." disabled></textarea>
        </div>
      </div>

      <div class="fila">
        <div class="campo-completo">
          <div class="etiqueta-linea">
            <span>📄</span>
            <label>Descripción del vehículo</label>
          </div>
          <textarea id="descripcion" rows="4" placeholder="Color, estado, extras, equipamiento..." disabled></textarea>
        </div>
      </div>

      <button type="submit" class="boton" id="btnGuardar" disabled>💾 Guardar Vehículo</button>
      <div id="mensaje" class="mensaje"></div>
    </form>

    <a href="index.html" class="volver">← Volver al inicio</a>
  </div>

  <script>            
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const selectCiudad = document.getElementById('ciudad');
    const bloqueOtraCiudad = document.getElementById('bloqueOtraCiudad');

    function setFormDisabled(desactivar) {
      const campos = document.querySelectorAll('input, select, textarea, button[type="submit"]');
      campos.forEach(campo => campo.disabled = desactivar);
      
      if (!desactivar && selectCiudad.value === 'otra') {
        document.getElementById('ciudad_otra').disabled = false;
      }
    }

    selectCiudad.addEventListener('change', () => {
      if (selectCiudad.value === 'otra') {
        bloqueOtraCiudad.classList.remove('oculto');
        document.getElementById('ciudad_otra').disabled = false;
      } else {
        bloqueOtraCiudad.classList.add('oculto');
        document.getElementById('ciudad_otra').value = '';
        document.getElementById('ciudad_otra').disabled = true;
      }
    });

    async function verificarSesion() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();

        if (session) {
          document.getElementById('cargando').classList.add('oculto');
          document.getElementById('bloqueNoConectado').classList.add('oculto');
          document.getElementById('bloqueConectado').classList.remove('oculto');
          setFormDisabled(false);
        } else {
          document.getElementById('cargando').classList.add('oculto');
          document.getElementById('bloqueNoConectado').classList.remove('oculto');
        }

        supabaseClient.auth.onAuthStateChange(async (_, nuevaSesion) => {
          if (nuevaSesion) {
            document.getElementById('bloqueNoConectado').classList.add('oculto');
            document.getElementById('bloqueConectado').classList.remove('oculto');
            setFormDisabled(false);
          }
        });
        
      } catch (error) {
        console.error("Error:", error);
        document.getElementById('cargando').classList.add('oculto');
        document.getElementById('bloqueNoConectado').classList.remove('oculto');
      }
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function guardarVehiculo(e) {
      e.preventDefault();
      
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const boton = document.getElementById('btnGuardar');
      const cajaMensaje = document.getElementById('mensaje');
      
      boton.disabled = true;
      boton.textContent = "Guardando...";
      cajaMensaje.style.display = "none";

      try {
        const tipoVehiculoValor = document.getElementById('tipo_vehiculo').value || null;
        
        let ciudadValor;
        if (selectCiudad.value === 'otra') {
          ciudadValor = document.getElementById('ciudad_otra').value.trim();
          if (!ciudadValor) {
            throw new Error("Escribí tu ciudad en el campo que apareció");
          }
        } else {
          ciudadValor = selectCiudad.value || null;
        }

        const datos = {
          tipo_vehiculo: tipoVehiculoValor,
          marca: document.getElementById('marca').value || null,
          modelo: document.getElementById('modelo').value || null,
          version: document.getElementById('version').value || null,
          combustible: document.getElementById('combustible').value || null,
          anio: parseInt(document.getElementById('anio').value) || null,
          transmision: document.getElementById('transmision').value || null,
          kilometraje: parseInt(document.getElementById('kilometraje').value) || null,
          precio: parseInt(document.getElementById('precio').value) || null,
          dueno: document.getElementById('dueno').value || null,
          direccion: document.getElementById('direccion').value || null,
          ciudad: ciudadValor,
          telefono: document.getElementById('telefono').value || null,
          permuta: document.getElementById('permuta').checked,
          contado: document.getElementById('contado').checked,
          deuda: document.getElementById('deuda').value || null,
          descripcion: document.getElementById('descripcion').value || null,
          usuario_id: session.user.id,
          correo_usuario: session.user.email
        };

        const { error } = await supabaseClient.from('autos').insert([datos]);
        
        if (error) throw error;

        cajaMensaje.textContent = "✅ Vehículo guardado correctamente";
        cajaMensaje.className = "mensaje exito";
        cajaMensaje.style.display = "block";
        document.getElementById('formAuto').reset();
        bloqueOtraCiudad.classList.add('oculto');
        
      } catch (error) {
        console.error("Error:", error);
        cajaMensaje.textContent = "❌ Error: " + error.message;
        cajaMensaje.className = "mensaje error";
        cajaMensaje.style.display = "block";
      } finally {
        boton.disabled = false;
        boton.textContent = "💾 Guardar Vehículo";
      }
    }

    document.getElementById('btn-cerrar-sesion').addEventListener('click', cerrarSesion);
    document.getElementById('formAuto').addEventListener('submit', guardarVehiculo);
    
    verificarSesion();
  </script>

</body>
</html>
