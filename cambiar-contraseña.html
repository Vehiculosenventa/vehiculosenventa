<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .caja {
      background: #fff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(44,82,130,0.12);
      max-width: 420px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 10px;
      font-size: 22px;
    }
    p {
      text-align: center;
      color: #718096;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #4a5568;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #c5d6e8;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    input:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.12);
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      display: none;
      font-weight: 600;
      line-height: 1.5;
    }
    .exito { background: #f0f7ee; color: #276749; border: 1px solid #b8d8b9; }
    .error { background: #fef2f2; color: #c53030; border: 1px solid #feb2b2; }
    .volver {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #3182ce;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>🔑 Recuperar Contraseña</h1>
    <p>Ingresá tu correo y te enviaremos un enlace para crear una contraseña nueva</p>

    <form id="formRecuperar">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="tu@correo.com" required>
      <button type="submit" id="btnEnviar">📧 Enviar Enlace</button>
      <div id="mensaje" class="mensaje"></div>
    </form>

    <a href="iniciar-sesion.html" class="volver">← Volver a Iniciar Sesión</a>
  </div>

  <script>
    const SUPABASE_URL = "https://cgwdahvstitjksphucqk.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    const { createClient } = supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('formRecuperar').addEventListener('submit', async e => {
      e.preventDefault();
      const correo = document.getElementById('correo').value.trim();
      const btn = document.getElementById('btnEnviar');
      const mensaje = document.getElementById('mensaje');

      btn.disabled = true;
      btn.textContent = "Enviando...";
      mensaje.style.display = "none";

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(correo, {
          redirectTo: window.location.origin + '/recuperar-contraseña.html'
        });
        if (error) throw error;

        mensaje.textContent = "✅ Te enviamos el enlace a tu correo. Revisá también la carpeta de spam.";
        mensaje.className = "mensaje exito";
        mensaje.style.display = "block";
        e.target.reset();
      } catch (err) {
        mensaje.textContent = "❌ " + err.message;
        mensaje.className = "mensaje error";
        mensaje.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "📧 Enviar Enlace";
      }
    });
  </script>
</body>
</html>
