<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#00b8ff">
  <title>Compra y Venta de Autos - Rosario y Zona</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, 'Open Sans', sans-serif;
    }
    body {
      background: linear-gradient(180deg, #0a2a5a 0%, #0d4a8c 45%, #00b8ff 100%);
      min-height: 100vh;
      color: #ffffff;
      overflow-x: hidden;
    }
    .contenedor-principal {
      max-width: 520px;
      margin: 0 auto;
      padding: 15px 20px 40px;
      position: relative;
    }
    .cabecera {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 30px;
      padding-top: 10px;
    }
    .flecha-volver {
      position: absolute;
      left: 0;
      font-size: 24px;
      color: #ffffff;
      text-decoration: none;
    }
    .titulo-pagina {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.4;
    }
    .fondo-decoracion {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .estrella {
      position: absolute;
      color: rgba(255,255,255,0.8);
      animation: parpadeo 3s infinite;
    }
    @keyframes parpadeo {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .zona-asistente {
      position: relative;
      text-align: center;
      margin: 20px 0 30px;
    }
    .burbuja-saludo {
      background: linear-gradient(135deg, #ffffff 0%, #e0f7ff 100%);
      border-radius: 30px 30px 10px 30px;
      padding: 22px 28px;
      margin: 0 auto 35px;
      max-width: 420px;
      color: #0d4a8c;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      box-shadow: 0 6px 25px rgba(0,184,255,0.3);
      animation: aparecer 0.6s ease-out;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar-contenedor {
      position: relative;
      display: inline-block;
      margin: 10px 0;
      width: 220px;
      height: 220px;
    }
    .onda {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(0,184,255,0.4);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: expandir 3s ease-out infinite;
    }
    .onda:nth-child(2) { animation-delay: 0.6s; }
    .onda:nth-child(3) { animation-delay: 1.2s; }
    @keyframes expandir {
      0% { width: 200px; height: 200px; opacity: 0.7; }
      100% { width: 320px; height: 320px; opacity: 0; }
    }
    .robot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 130px;
      z-index: 3;
    }
    .robot-cabeza {
      width: 130px;
      height: 74px;
      background: linear-gradient(180deg, #ffffff 0%, #f0f7ff 100%);
      border-radius: 38px 38px 30px 30px;
      position: relative;
      box-shadow: 0 0 25px rgba(0,180,200,0.35), inset 0 -8px 20px rgba(0,150,180,0.15);
    }
    .robot-pantalla {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 38px;
      background: linear-gradient(180deg, #e6f7ff 0%, #ffffff 100%);
      border-radius: 18px;
      border: 1px solid #b3e5fc;
      box-shadow: inset 0 0 18px rgba(0,184,255,0.08);
    }
    .robot-antenas {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 34px;
    }
    .antena {
      width: 3px;
      height: 14px;
      background: #ffffff;
      border-radius: 2px;
    }
    .antena-punta {
      width: 9px;
      height: 9px;
      background: #00b8ff;
      border-radius: 50%;
      position: absolute;
      top: -4px;
      left: -3px;
    }
    .robot-cuerpo {
      width: 110px;
      height: 56px;
      background: linear-gradient(180deg, #ffffff 0%, #f0f7ff 100%);
      border-radius: 0 0 34px 34px;
      margin: -8px auto 0;
      position: relative;
      box-shadow: 0 0 25px rgba(0,180,200,0.35), inset 0 -8px 20px rgba(0,150,180,0.15);
    }
    .robot-pecho {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 30px;
      background: linear-gradient(180deg, #e6f7ff 0%, #ffffff 100%);
      border-radius: 12px;
      border: 1px solid #b3e5fc;
      box-shadow: inset 0 0 18px rgba(0,184,255,0.08);
    }
    .etiqueta-centro {
      text-align: center;
      margin: 20px 0 45px;
    }
    .frase-principal {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .frase-secundaria {
      font-size: 16px;
      color: #b3e5fc;
    }
    .zona-mensajes {
      margin-bottom: 150px;
    }
    .mensaje-usuario {
      background: rgba(255,255,255,0.15);
      border-radius: 20px 20px 6px 20px;
      padding: 14px 18px;
      margin: 12px 0 12px auto;
      max-width: 85%;
      line-height: 1.5;
      color: #ffffff;
    }
    .mensaje-ia {
      background: rgba(255,255,255,0.08);
      border-radius: 20px 20px 20px 6px;
      padding: 14px 18px;
      margin: 12px 0;
      max-width: 85%;
      line-height: 1.6;
      color: #e0f7ff;
      border: 1px solid rgba(0,184,255,0.2);
    }
    .caja-entrada {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 500px;
      background: #ffffff;
      padding: 20px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .entrada-texto {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      color: #0f172a;
      padding: 12px 4px;
      background: #f5f8fa;
      border-radius: 12px;
      padding-left: 15px;
    }
    .entrada-texto::placeholder {
      color: #94a3b8;
    }
    .icono-microfono-chico {
      color: #94a3b8;
      font-size: 20px;
      margin-right: 8px;
    }
    .boton-microfono {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #0099dd 0%, #0066cc 100%);
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0,102,204,0.35);
      flex-shrink: 0;
    }
    .boton-microfono:hover,
    .boton-microfono.grabando {
      transform: scale(1.15);
      box-shadow: 0 0 25px rgba(0,184,255,0.5);
      background: linear-gradient(135deg, #00b8ff 0%, #0091cc 100%);
    }
    .oculto { display: none !important; }
  </style>
</head>
<body>
  <div class="contenedor-principal">
    <div class="cabecera">
      <a href="#" class="flecha-volver">&larr;</a>
      <h1 class="titulo-pagina">Compra y Venta de Autos<br>Rosario y Zona</h1>
    </div>
    <div class="fondo-decoracion" id="decoracion"></div>
    <div class="zona-asistente">
      <div class="burbuja-saludo" id="cajaBienvenida">
        👋 ¡Bienvenido! ¿Vendés o buscás un auto?
      </div>
      <div class="avatar-contenedor">
        <div class="onda"></div>
        <div class="onda"></div>
        <div class="onda"></div>
        <div class="robot">
          <div class="robot-cabeza">
            <div class="robot-antenas">
              <div class="antena"><div class="antena-punta"></div></div>
              <div class="antena"><div class="antena-punta"></div></div>
            </div>
            <div class="robot-pantalla"></div>
          </div>
          <div class="robot-cuerpo">
            <div class="robot-pecho"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="etiqueta-centro">
      <p class="frase-principal">Comprá, vendé o publicá<br>tu auto acá</p>
      <p class="frase-secundaria">Rosario y alrededores — todo en un solo lugar</p>
    </div>
    <div class="zona-mensajes" id="zonaMensajes"></div>
  </div>
  <div class="caja-entrada">
    <input type="text" class="entrada-texto" id="entradaTexto" placeholder="Quiero vender un auto / Busco un auto...">
    <span class="icono-microfono-chico">🎤</span>
    <button class="boton-microfono" id="btnMicrofono">🎤</button>
  </div>
  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZizendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const zonaMensajes = document.getElementById('zonaMensajes');
    const cajaBienvenida = document.getElementById('cajaBienvenida');
    const entradaTexto = document.getElementById('entradaTexto');
    const btnMicrofono = document.getElementById('btnMicrofono');
    let estaGrabando = false;
    const decoracion = document.getElementById('decoracion');
    const simbolos = ['✦', '✧', '⋆', '✴', '✻', '✦'];
    for (let i = 0; i < 24; i++) {
      const s = document.createElement('div');
      s.className = 'estrella';
      s.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      decoracion.appendChild(s);
    }
    function limpiarTexto(texto) {
      return texto.replace(/[\u{1F300}-\u{1F9FF}]/gu, ' ').replace(/\s+/g, ' ').trim();
    }
    function hablar(texto) {
      const limpio = limpiarTexto(texto);
      if (!limpio) return;
      window.speechSynthesis.cancel();
      const mensaje = new SpeechSynthesisUtterance(limpio);
      mensaje.lang = 'es-AR';
      mensaje.rate = 1.05;
      mensaje.pitch = 1.02;
      window.speechSynthesis.speak(mensaje);
    }
    function agregarMensaje(texto, esUsuario = false) {
      if (cajaBienvenida) cajaBienvenida.classList.add('oculto');
      const div = document.createElement('div');
      div.className = esUsuario ? 'mensaje-usuario' : 'mensaje-ia';
      div.textContent = texto;
      zonaMensajes.appendChild(div);
      zonaMensajes.scrollTop = zonaMensajes.scrollHeight;
      if (!esUsuario) hablar(texto);
    }
    function procesarMensaje(texto) {
      const t = texto.toLowerCase();
      if (t.includes('vender') || t.includes('publicar') || t.includes('poner')) {
        return "Perfecto. Te ayudo a vender tu auto. Decime: marca, modelo, año, precio y en qué zona estás.";
      }
      if (t.includes('comprar') || t.includes('buscar') || t.includes('ver autos') || t.includes('disponible')) {
        return "Bueno. ¿Qué estás buscando? Decime marca, modelo, presupuesto o zona y te muestro los autos que hay.";
      }
      if (t.includes('mis') || t.includes('lo que publiqué') || t.includes('mis autos')) {
        return "Claro. Aquí están los autos que publicaste. ¿Querés editar, borrar o ver algo más?";
      }
      if (t.includes('favorito') || t.includes('guardar')) {
        return "Listo. Lo guardé en tus favoritos. Te aviso si baja de precio o aparece algo parecido.";
      }
      if (t.includes('eliminar') || t.includes('borrar') || t.includes('sacar')) {
        return "Decime cuál querés sacar: marca, modelo o precio y lo elimino enseguida.";
      }
      return "Soy tu asistente para comprar y vender autos. Decime: ¿vendés o buscás un auto?";
    }
    function enviar() {
      const texto = entradaTexto.value.trim();
      if (!texto) return;
      agregarMensaje(texto, true);
      entradaTexto.value = '';
      setTimeout(() => agregarMensaje(procesarMensaje(texto)), 500);
    }
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
      const reconocimiento = new Reconocimiento();
      reconocimiento.lang = 'es-AR';
      reconocimiento.continuous = false;
      reconocimiento.onresult = (e) => {
        entradaTexto.value = e.results[0][0].transcript;
        enviar();
      };
      reconocimiento.onend = () => {
        estaGrabando = false;
        btnMicrofono.classList.remove('grabando');
      };
      btnMicrofono.addEventListener('click', () => {
        if (!estaGrabando) {
          reconocimiento.start();
          estaGrabando = true;
          btnMicrofono.classList.add('grabando');
        }
      });
    } else {
      btnMicrofono.title = "Tu navegador no soporta reconocimiento de voz";
      btnMicrofono.style.opacity = '0.5';
    }
    entradaTexto.addEventListener('keypress', e => e.key === 'Enter' && enviar());
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        hablar("Bienvenido. Soy tu asistente para comprar y vender autos en Rosario y zona. Decime: ¿vendés o buscás un auto?");
      }, 800);
    });
  </script>
</body>
</html>
