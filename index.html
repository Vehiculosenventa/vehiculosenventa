<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Vehículos en Venta</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .caja {
      background: #faf8f0;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    h1 {text-align: center; color: #2c5282; margin-bottom: 30px; font-size: 22px;}
    .campo {margin-bottom: 20px; position: relative;}
    label {display: block; margin-bottom: 6px; color: #4a5568; font-weight: 500;}
    .input-estilo {
      width: 100%; padding: 12px 15px;
      border: 1px solid #bdd1e1; border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }
    .input-estilo:focus {outline: none; border-color: #6fa8d6; box-shadow: 0 0 0 3px rgba(111,168,214,0.2);}
    .input-con-ojo {position: relative;}
    .input-con-ojo .input-estilo {padding-right: 45px;}
    .ojo {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 20px; color: #6b7280; user-select: none;
    }
    .ojo:hover {color: #3182ce;}
    .indicador {font-size: 13px; color: #718096; margin-top: 5px;}
    button {
      width: 100%; padding: 14px;
      background: #5fa8d3; color: #fff; border: none;
      border-radius: 8px; font-size: 17px; font-weight: 600;
      cursor: pointer; transition: background 0.3s;
    }
    button:hover {background: #4a90c4;}
    button:active {transform: scale(0.98);}
    button:disabled {background: #94b8d1; cursor: not-allowed; opacity: 0.7;}
    .error {color: #d64545; margin-top: -10px; margin-bottom: 12px; font-size: 14px; display: none;}
    .exito {color: #2f855a; margin-top: 10px; font-size: 14px; display: none;}
    .cargando {color: #3182ce; margin-top: 10px; font-size: 14px; display: none;}
  </style>
</head>
<body>
  <div class="caja">
    <h1>Crear tu Cuenta</h1>
    
    <div class="campo">
      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" class="input-estilo" placeholder="tu@correo.com">
    </div>
    
    <div class="campo">
      <label for="pass1">Contraseña (6 a 8 caracteres)</label>
      <div class="input-con-ojo">
        <input type="password" id="pass1" class="input-estilo" placeholder="Mínimo 6, máximo 8" maxlength="8">
        <span class="ojo" id="ver1">👁️</span>
      </div>
      <div class="indicador" id="cont1">0 / 8</div>
    </div>
    
    <div class="campo">
      <label for="pass2">Repetir Contraseña</label>
      <div class="input-con-ojo">
        <input type="password" id="pass2" class="input-estilo" placeholder="Repetí la contraseña" maxlength="8">
        <span class="ojo" id="ver2">👁️</span>
      </div>
      <div class="indicador" id="cont2">0 / 8</div>
    </div>
    
    <div class="error" id="errorMsg"></div>
    <div class="cargando" id="cargando">⏳ Enviando correo de verificación...</div>
    <div class="exito" id="exitoMsg"></div>
    
    <button id="botonCrear">Crear Cuenta</button>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

    // Cliente UNA SOLA VEZ — sin duplicados
    if (!window._sb) {
      window._sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // Elementos
    const pass1 = document.getElementById('pass1');
    const pass2 = document.getElementById('pass2');
    const ver1 = document.getElementById('ver1');
    const ver2 = document.getElementById('ver2');
    const cont1 = document.getElementById('cont1');
    const cont2 = document.getElementById('cont2');
    const botonCrear = document.getElementById('botonCrear');
    const errorMsg = document.getElementById('errorMsg');
    const exitoMsg = document.getElementById('exitoMsg');
    const cargando = document.getElementById('cargando');

    // Contadores
    pass1.addEventListener('input', () => cont1.textContent = `${pass1.value.length} / 8`);
    pass2.addEventListener('input', () => cont2.textContent = `${pass2.value.length} / 8`);

    // Ver/ocultar contraseña
    function alternarVer(input, ojo) {
      input.type = input.type === 'password' ? 'text' : 'password';
      ojo.textContent = input.type === 'password' ? '👁️' : '🙈';
    }
    ver1.addEventListener('click', () => alternarVer(pass1, ver1));
    ver2.addEventListener('click', () => alternarVer(pass2, ver2));

    function limpiarMensajes() {
      errorMsg.style.display = 'none';
      exitoMsg.style.display = 'none';
      cargando.style.display = 'none';
      errorMsg.textContent = '';
      exitoMsg.textContent = '';
    }

    // Registro
    async function registrar() {
      limpiarMensajes();
      const correo = document.getElementById('correo').value.trim();
      
      if (!correo) { errorMsg.textContent = "Escribí tu correo electrónico"; errorMsg.style.display = 'block'; return; }
      if (!correo.includes('@') || !correo.includes('.')) { errorMsg.textContent = "Correo inválido"; errorMsg.style.display = 'block'; return; }
      if (pass1.value.length < 6 || pass1.value.length > 8) { errorMsg.textContent = "Entre 6 y 8 caracteres"; errorMsg.style.display = 'block'; return; }
      if (pass1.value !== pass2.value) { errorMsg.textContent = "Las contraseñas no coinciden"; errorMsg.style.display = 'block'; return; }
      
      botonCrear.disabled = true;
      cargando.style.display = 'block';

      try {
        const { data, error } = await window._sb.auth.signUp({
          email: correo,
          password: pass1.value,
          options: { emailRedirectTo: "https://vehiculosenventa.com.ar/confirmar.html" }
        });

        if (error) throw error;

        if (data.user && !data.session) {
          exitoMsg.textContent = "✅ Correo enviado. Revisá tu bandeja de entrada";
          exitoMsg.style.display = 'block';
        } else if (data.session) {
          exitoMsg.textContent = "✅ Cuenta creada.";
          exitoMsg.style.display = 'block';
        }
      } catch (err) {
        let msg = "No se pudo registrar";
        if (err.message.includes("User already registered")) msg = "⚠️ Este correo ya está registrado";
        else if (err.message.includes("invalid email")) msg = "Correo inválido";
        else if (err.message.includes("signup_disabled")) msg = "❌ Los registros están desactivados en Supabase";
        else msg = "❌ " + err.message;
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      } finally {
        botonCrear.disabled = false;
        cargando.style.display = 'none';
      }
    }

    botonCrear.addEventListener('click', registrar);
  </script>
</body>
</html>
