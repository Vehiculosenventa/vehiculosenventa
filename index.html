<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%); min-height: 100vh; padding: 20px; }
    .barra-superior { text-align: right; margin-bottom: 20px; }
    .boton-entrar { display: inline-block; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 700; text-decoration: none; background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%); color: #fff; border: none; cursor: pointer; }
    .boton-cerrar { display: none; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 700; background: transparent; color: #c53030; border: 2px solid #c53030; cursor: pointer; }
    .boton-cerrar.activo { display: inline-block; }
    .oculto { display: none !important; }
    .caja-principal { background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%); border-radius: 28px; padding: 55px 40px; max-width: 540px; margin: 40px auto 0; text-align: center; border: 1px solid #e2d9c8; }
    h1 { color: #2c5282; font-size: 34px; font-weight: 800; margin-bottom: 12px; }
    .subtitulo { color: #5a6872; font-size: 17px; margin-bottom: 35px; }
    .boton { display: flex; align-items: center; justify-content: center; gap: 12px; background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%); color: #fff; text-decoration: none; font-size: 20px; font-weight: 700; padding: 20px 26px; border-radius: 16px; margin-bottom: 16px; border: none; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <div class="barra-superior">
    <a id="btnEntrar" href="iniciar-sesion.html" class="boton-entrar">🔐 Iniciar sesión</a>
    <button id="btnCerrar" class="boton-cerrar">🚪 Cerrar sesión</button>
  </div>

  <div id="contenido" class="oculto caja-principal">
    <h1>🚗 Vehículos en Venta</h1>
    <p class="subtitulo">Publicá • Buscá • Vendé con total confianza</p>
    <a href="cargar.html" class="boton">📄 Ingresar Vehículo</a>
    <a href="ver.html" class="boton">📋 Ver Vehículos — Catálogo</a>
    <a href="buscar.html" class="boton">🔍 Buscar Vehículo</a>
    <a href="mis-vehiculos.html" class="boton">❤️ Mis Vehículos</a>
  </div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const btnEntrar = document.getElementById('btnEntrar');
    const btnCerrar = document.getElementById('btnCerrar');
    const contenido = document.getElementById('contenido');

    async function verificar() {
      // Empezar todo oculto
      btnEntrar.style.display = 'none';
      btnCerrar.classList.remove('activo');
      contenido.classList.add('oculto');

      // Obtener sesión
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        // Sin sesión → mostrar Iniciar
        btnEntrar.style.display = 'inline-block';
        return;
      }

      // Con sesión → mostrar todo directamente porque ya está confirmado
      btnEntrar.style.display = 'none';
      btnCerrar.classList.add('activo');
      contenido.classList.remove('oculto');
    }

    // Cerrar sesión
    btnCerrar.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'cerrar-sesion.html';
    });

    document.addEventListener('DOMContentLoaded', verificar);
  </script>
</body>
</html>
