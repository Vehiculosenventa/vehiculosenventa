<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehículos en Venta</title>
  <link rel="icon" href="data:,">
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .caja {
      background: #faf8f0;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }
    h1 {
      color: #2c5282;
      font-size: 26px;
      margin-bottom: 15px;
    }
    p {
      color: #4a5568;
      margin-bottom: 35px;
      font-size: 16px;
    }
    .boton {
      display: inline-block;
      width: 100%;
      padding: 16px;
      background: #5fa8d3;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
      transition: background 0.3s;
    }
    .boton:hover {
      background: #4a90c4;
    }
  </style>
</head>
<body>
  <div class="caja">
    <h1>🚗 Vehículos en Venta</h1>
    <p>Creá tu cuenta para empezar</p>
    <a href="registrarse.html" class="boton">Ir a Crear Cuenta</a>
  </div>
</body>
</html>
