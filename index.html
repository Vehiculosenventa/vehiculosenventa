<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vehículos en Venta">
  <meta name="theme-color" content="#1565C0">
  <title>Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, 'Open Sans', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .barra-superior {
      text-align: right;
      margin-bottom: 20px;
    }
    .saludo {
      display: inline-block;
      margin-right: 12px;
      color: #2c5282;
      font-weight: 600;
      vertical-align: middle;
    }
    .boton-entrar {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      background: #fff;
      color: #3182ce;
      border: 2px solid #3182ce;
      vertical-align: middle;
      transition: all 0.3s ease;
    }
    .boton-entrar:hover {
      background: #ebf4fb;
      transform: translateY(-1px);
    }
    .enlace-olvidada {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      color: #3182ce;
      text-decoration: none;
    }
    .enlace-olvidada:hover {
      text-decoration: underline;
    }
    .boton-cerrar {
      display: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #c53030;
      cursor: pointer;
      vertical-align: middle;
      text-decoration: underline;
      transition: all 0.2s ease;
    }
    .boton-cerrar.activo {
      display: inline-block;
    }
    .boton-cerrar:hover {
      color: #9b2c2c;
      background: rgba(197, 48, 48, 0.08);
    }
    .oculto { display: none !important; }
    .caja-principal {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      border-radius: 28px;
      padding: 55px 40px;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(44, 82, 130, 0.08);
      text-align: center;
      border: 1px solid #e2d9c8;
    }
    h1 {
      color: #2c5282;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .subtitulo {
      color: #5a6872;
      font-size: 17px;
      margin-bottom: 35px;
      font-weight: 500;
      line-height: 1.5;
    }
    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      padding: 20px 26px;
      border-radius: 16px;
      margin-bottom: 16px;
      transition: all 0.35s ease;
      border: none;
      box-shadow: 0 6px 16px rgba(49, 130, 206, 0.18);
      cursor: pointer;
      width: 100%;
    }
    .boton:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #4a90d9 0%, #3182ce 100%);
      box-shadow: 0 8px 20px rgba(49, 130, 206, 0.25);
    }
    .pie-pagina {
      margin-top: 30px;
      font-size: 13px;
      color: #718096;
    }
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #fff5f5;
      border: 2px solid #feb2b2;
      color: #c53030;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="barra-superior">
    <!-- 🔒 SIN SESIÓN -->
    <div id="sinSesion">
      <a id="btn-entrar" href="iniciar-sesion.html" class="boton-entrar">🔐 Iniciar sesión</a>
      <a id="enlace-olvidada" href="recuperar-contraseña.html" class="enlace-olvidada">¿Olvidaste tu contraseña?</a>
    </div>
    <!-- ✅ CON SESIÓN -->
    <div id="conSesion" class="oculto">
      <span id="saludo" class="saludo"></span>
      <button id="btn-cerrar" class="boton-cerrar activo">🚪 Cerrar sesión</button>
    </div>
  </div>

  <div id="caja-contenido" class="caja-principal oculto">
    <h1>🚗 Vehículos en Venta</h1>
    <p class="subtitulo">Publicá • Buscá • Vendé con total confianza<br>
    La plataforma de vehículos de Rosario y toda la región</p>
    <a href="cargar.html" class="boton">
      📄 <span>Ingresar Vehículo</span>
    </a>
    <a href="ver.html" class="boton">
      📋 <span>Ver Vehículos — Catálogo</span>
    </a>
    <a href="buscar.html" class="boton">
      🔍 <span>Buscar Vehículo</span>
    </a>
    <a href="mis-vehiculos.html" class="boton">
      ❤️ <span>Mis Vehículos</span>
    </a>
    <p class="pie-pagina">Hecho para Rosario y toda la región.</p>
  </div>

  <div id="mensaje" class="mensaje"></div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const sinSesion = document.getElementById('sinSesion');
    const conSesion = document.getElementById('conSesion');
    const saludo = document.getElementById('saludo');
    const btnCerrar = document.getElementById('btn-cerrar');
    const cajaContenido = document.getElementById('caja-contenido');
    const mensaje = document.getElementById('mensaje');

    // ✅ VERIFICAR SESIÓN
    async function verificarSesion() {
      sinSesion.classList.add('oculto');
      conSesion.classList.add('oculto');
      cajaContenido.classList.add('oculto');
      mensaje.style.display = 'none';

      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        // 🔒 SIN SESIÓN → mostrar entrar y olvidé contraseña
        sinSesion.classList.remove('oculto');
        return;
      }

      // ✅ HAY SESIÓN → verificar confirmación
      const { data: filaUsuario, error: errorTabla } = await supabase
        .from('usuario')
        .select('verificado')
        .eq('correo', session.user.email)
        .single();

      if (errorTabla || !filaUsuario || !filaUsuario.verificado) {
        // ⏳ NO CONFIRMÓ → avisar y salir
        mensaje.textContent = '⚠️ Primero confirmá tu cuenta desde el correo';
        mensaje.style.display = 'block';
        await supabase.auth.signOut();
        setTimeout(() => {
          window.location.href = 'iniciar-sesion.html';
        }, 3000);
        return;
      }

      // ✅ TODO BIEN → ocultar entrar, mostrar cerrar y contenido
      sinSesion.classList.add('oculto');        // Desaparece "Iniciar sesión"
      conSesion.classList.remove('oculto');     // Aparece saludo + "Cerrar sesión"
      cajaContenido.classList.remove('oculto');  // Aparecen los botones
      saludo.textContent = '¡Hola! 🎉';
    }

    // ✅ CERRAR SESIÓN → ir a la página que quieras
    btnCerrar.addEventListener('click', async () => {
      await supabase.auth.signOut();
      // Cambiá acá por la página a donde quieras que vaya
      window.location.href = 'cerrar-sesion.html';
      // Si querés que vaya al inicio: window.location.href = 'index.html';
    });

    document.addEventListener('DOMContentLoaded', verificarSesion);
  </script>
</body>
</html>
