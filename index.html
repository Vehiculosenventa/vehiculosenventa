<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .barra-superior {
      text-align: right;
      margin-bottom: 20px;
    }
    .saludo {
      display: inline-block;
      margin-right: 12px;
      color: #2c5282;
      font-weight: 600;
      vertical-align: middle;
    }
    .boton-entrar {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      background: #fff;
      color: #3182ce;
      border: 2px solid #3182ce;
      vertical-align: middle;
    }
    .enlace-olvidada {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      color: #3182ce;
      text-decoration: none;
    }
    .boton-cerrar {
      display: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #c53030;
      cursor: pointer;
    }
    .boton-cerrar.activo {
      display: inline-block;
    }
    .oculto { display: none !important; }
    .caja-principal {
      background: linear-gradient(135deg, #f7f3eb 0%, #eee9dd 100%);
      border-radius: 28px;
      padding: 55px 40px;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(44, 82, 130, 0.08);
      text-align: center;
      border: 1px solid #e2d9c8;
    }
    h1 {
      color: #2c5282;
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .subtitulo {
      color: #5a6872;
      font-size: 17px;
      margin-bottom: 35px;
    }
    .boton {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      padding: 20px 26px;
      border-radius: 16px;
      margin-bottom: 16px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    .pie-pagina {
      margin-top: 30px;
      font-size: 13px;
      color: #718096;
    }
    .mensaje {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #fff5f5;
      border: 2px solid #feb2b2;
      color: #c53030;
      font-weight: 600;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="barra-superior">
    <!-- 🔒 SIN SESIÓN → Solo se ve esto -->
    <div id="botonesSinSesion">
      <a href="iniciar-sesion.html" class="boton-entrar">🔐 Iniciar sesión</a>
      <a href="recuperar-contraseña.html" class="enlace-olvidada">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- ✅ CON SESIÓN → Solo se ve esto -->
    <div id="botonesConSesion" class="oculto">
      <span class="saludo">¡Hola! 🎉</span>
      <button id="btnCerrar" class="boton-cerrar activo">🚪 Cerrar sesión</button>
    </div>
  </div>

  <!-- Los botones principales SOLO aparecen cuando estás conectado y confirmado -->
  <div id="contenidoPrincipal" class="oculto caja-principal">
    <h1>🚗 Vehículos en Venta</h1>
    <p class="subtitulo">Publicá • Buscá • Vendé con total confianza<br>
    La plataforma de vehículos de Rosario y toda la región</p>
    <a href="cargar.html" class="boton">📄 Ingresar Vehículo</a>
    <a href="ver.html" class="boton">📋 Ver Vehículos — Catálogo</a>
    <a href="buscar.html" class="boton">🔍 Buscar Vehículo</a>
    <a href="mis-vehiculos.html" class="boton">❤️ Mis Vehículos</a>
    <p class="pie-pagina">Hecho para Rosario y toda la región.</p>
  </div>

  <div id="mensaje" class="mensaje"></div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const botonesSinSesion = document.getElementById('botonesSinSesion');
    const botonesConSesion = document.getElementById('botonesConSesion');
    const contenidoPrincipal = document.getElementById('contenidoPrincipal');
    const mensaje = document.getElementById('mensaje');
    const btnCerrar = document.getElementById('btnCerrar');

    async function actualizarPagina() {
      // Ocultar TODO al empezar
      botonesSinSesion.classList.add('oculto');
      botonesConSesion.classList.add('oculto');
      contenidoPrincipal.classList.add('oculto');
      mensaje.style.display = 'none';

      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        // 🔒 SIN SESIÓN → se ve "Iniciar sesión" y "Olvidaste..."
        botonesSinSesion.classList.remove('oculto');
        return;
      }

      // ✅ HAY SESIÓN → verificar si confirmó el correo
      const { data: fila } = await supabase
        .from('usuario')
        .select('verificado')
        .eq('correo', session.user.email)
        .single();

      if (!fila || !fila.verificado) {
        // ⏳ NO CONFIRMÓ → aviso y salir
        mensaje.textContent = '⚠️ Confirmá tu cuenta desde el correo primero';
        mensaje.style.display = 'block';
        await supabase.auth.signOut();
        setTimeout(() => window.location.href = 'iniciar-sesion.html', 3000);
        return;
      }

      // ✅ TODO BIEN → desaparecen los de entrar, aparece "Cerrar sesión" + todo el contenido
      botonesSinSesion.classList.add('oculto');      // Se van "Iniciar" y "Olvidaste"
      botonesConSesion.classList.remove('oculto');   // Aparece saludo + "Cerrar sesión"
      contenidoPrincipal.classList.remove('oculto'); // Aparecen todos los botones
    }

    // Cerrar sesión → ir a la página de despedida
    btnCerrar.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'cerrar-sesion.html';
    });

    document.addEventListener('DOMContentLoaded', actualizarPagina);
  </script>
</body>
</html>
