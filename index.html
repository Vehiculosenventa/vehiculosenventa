<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%); min-height: 100vh; padding: 20px; }
    .barra { text-align: right; margin-bottom: 20px; }
    .oculto { display: none !important; }
    
    .btn {
      padding: 12px 24px; border-radius: 10px; font-size: 16px; font-weight: 700;
      text-decoration: none; border: none; cursor: pointer; margin-left: 10px;
    }
    .azul { background: #3182ce; color: #fff; }
    .blanco { background: #fff; color: #2b6cb0; border: 2px solid #2b6cb0; }
    .rojo { background: transparent; color: #c53030; border: 2px solid #c53030; }
    
    .caja {
      background: #fff; border-radius: 20px; padding: 40px;
      max-width: 500px; margin: 40px auto; text-align: center;
      box-shadow: 0 10px 30px rgba(44,82,130,0.1);
    }
    h1 { color: #2c5282; margin-bottom: 10px; }
    .sub { color: #5a6872; margin-bottom: 30px; }
    .boton {
      display: block; background: #3182ce; color: #fff; text-decoration: none;
      padding: 16px; border-radius: 12px; margin: 10px 0; font-size: 18px; font-weight: 700;
    }
    .mensaje { margin-top: 20px; padding: 12px; border-radius: 10px; display: none; font-weight: 700; }
    .aviso { background: #fff3cd; color: #856404; display: block; }
  </style>
</head>
<body>

  <div class="barra">
    <div id="sinSesion">
      <a href="iniciar-sesion.html" class="btn azul">🔐 Iniciar sesión</a>
      <a href="registrarse.html" class="btn blanco">📝 Registrarse</a>
    </div>
    <button id="btnCerrar" class="btn rojo oculto">🚪 Cerrar sesión</button>
  </div>

  <div id="contenido" class="caja oculto">
    <h1>🚗 Vehículos en Venta</h1>
    <p class="sub">Publicá • Buscá • Vendé con confianza</p>
    <a href="cargar.html" class="boton">📄 Ingresar Vehículo</a>
    <a href="ver.html" class="boton">📋 Ver Vehículos</a>
    <a href="buscar.html" class="boton">🔍 Buscar Vehículo</a>
    <a href="mis-vehiculos.html" class="boton">❤️ Mis Vehículos</a>
  </div>

  <div id="mensaje" class="mensaje aviso"></div>

  <script>
    const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";
    
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const sinSesion = document.getElementById('sinSesion');
    const btnCerrar = document.getElementById('btnCerrar');
    const contenido = document.getElementById('contenido');
    const mensaje = document.getElementById('mensaje');

    async function verificar() {
      sinSesion.classList.add('oculto');
      btnCerrar.classList.add('oculto');
      contenido.classList.add('oculto');
      mensaje.style.display = 'none';

      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        sinSesion.classList.remove('oculto');
        return;
      }

      const { data: fila, error } = await supabase
        .from('usuario')
        .select('verificado')
        .eq('correo', session.user.email)
        .single();

      if (error || !fila || !fila.verificado) {
        mensaje.textContent = '⚠️ Confirmá tu cuenta desde el correo que te enviamos';
        mensaje.style.display = 'block';
        await supabase.auth.signOut();
        setTimeout(() => window.location.href = 'iniciar-sesion.html', 3000);
        return;
      }

      sinSesion.classList.add('oculto');
      btnCerrar.classList.remove('oculto');
      contenido.classList.remove('oculto');
    }

    btnCerrar.addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'cerrar-sesion.html';
    });

    document.addEventListener('DOMContentLoaded', verificar);
  </script>
</body>
</html>
