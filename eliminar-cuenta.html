<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminar Cuenta - Vehículos en Venta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;}
    body {
      background: linear-gradient(135deg, #dceaf5 0%, #cfe0ee 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .caja {
      background: white; border-radius: 12px; padding: 35px;
      max-width: 450px; width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    h1 {color: #d32f2f; text-align: center; margin-bottom: 20px; font-size: 1.5rem;}
    .aviso {color: #555; text-align: center; margin-bottom: 25px; line-height: 1.6;}
    label {display: block; margin-bottom: 6px; font-weight: 600; color: #444;}
    input {
      width: 100%; padding: 12px 15px; margin-bottom: 20px;
      border: 2px solid #ddd; border-radius: 8px; font-size: 1rem;
    }
    input:focus {outline: none; border-color: #d32f2f;}
    .boton-rojo {
      width: 100%; padding: 14px; background: #d32f2f; color: white;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: bold;
      cursor: pointer; margin-bottom: 10px;
    }
    .boton-rojo:hover {background: #b71c1c;}
    .boton-gris {
      width: 100%; padding: 12px; background: transparent;
      color: #1565C0; border: 2px solid #1565C0;
      border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    .boton-gris:hover {background: #e3f2fd;}
    .mensaje {margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; font-weight: 600; display: none;}
    .exito {background: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7;}
    .error {background: #ffebee; color: #c62828; border: 2px solid #ef9a9a;}
    .oculto {display: none !important;}
  </style>
</head>
<body>
<div class="caja">
  <h1>⚠️ Eliminar mi cuenta</h1>
  <p class="aviso">Se borrará tu cuenta y tus vehículos.<br>Esta acción NO se puede deshacer ❌</p>

  <div id="formulario">
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" placeholder="tu@correo.com">

    <label for="pass">Contraseña</label>
    <input type="password" id="pass" placeholder="Tu contraseña" maxlength="8">

    <button onclick="verificar()" class="boton-rojo">Verificar →</button>
    <button onclick="window.location.href='index.html'" class="boton-gris">Cancelar</button>
  </div>

  <div id="confirmar" class="oculto">
    <p class="aviso"><strong>¿Estás SEGURO?</strong><br>Se borra TODO y no se puede recuperar ❌</p>
    <button onclick="borrarTodo()" class="boton-rojo">🗑️ SÍ, ELIMINAR TODO</button>
    <button onclick="volver()" class="boton-gris">No, mejor no</button>
  </div>

  <div id="mensaje" class="mensaje"></div>
</div>

<script>
const SUPABASE_URL = "https://uhdypavizwkkbygrvuex.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZHlwYXZpendra2J5Z3J2dWV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNTM5NTcsImV4cCI6MjEwNDkyOTk1N30.JnqXIEIfwTG74m8zaY3glL1TsNoyhJhkSZP9niowtps";

// ✅ UNA SOLA VEZ — sin duplicados
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const usuarioId = localStorage.getItem('usuario_id');

if (!usuarioId) {
  alert('❌ Primero debés iniciar sesión');
  window.location.href = 'iniciar-sesion.html';
}

function mostrarMensaje(texto, tipo) {
  const m = document.getElementById('mensaje');
  m.style.display = 'block';
  m.className = 'mensaje ' + tipo;
  m.textContent = texto;
}

async function verificar() {
  const correo = document.getElementById('correo').value.trim();
  const pass = document.getElementById('pass').value;

  if (!correo || !pass) {
    mostrarMensaje('⚠️ Escribí correo y contraseña', 'error');
    return;
  }

  const { data, error } = await supabaseClient
    .from('usuarios')
    .select('id, correo, nombre')
    .eq('id', usuarioId)
    .eq('correo', correo)
    .eq('contraseña', pass)
    .maybeSingle();

  if (error) {
    mostrarMensaje('❌ Error: ' + error.message, 'error');
    return;
  }

  if (!data) {
    mostrarMensaje('❌ Correo o contraseña incorrectos', 'error');
    return;
  }

  document.getElementById('formulario').classList.add('oculto');
  document.getElementById('confirmar').classList.remove('oculto');
  mostrarMensaje('✅ Bienvenido, ' + data.nombre + '. Confirmá abajo.', 'exito');
}

async function borrarTodo() {
  if (!confirm('¿BORRAR TODO DE VERDAD? No hay vuelta atrás ❌')) return;

  try {
    // 1️⃣ Borrar vehículos
    const { error: e1 } = await supabaseClient
      .from('autos')
      .delete()
      .eq('usuario_id', usuarioId);
    
    if (e1) throw new Error('Vehículos: ' + e1.message);

    // 2️⃣ Borrar usuario
    const { error: e2 } = await supabaseClient
      .from('usuarios')
      .delete()
      .eq('id', usuarioId);
    
    if (e2) throw new Error('Cuenta: ' + e2.message);

    // ✅ Éxito
    localStorage.clear();
    mostrarMensaje('✅ Cuenta eliminada. Nos vemos pronto 👋', 'exito');
    
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2500);

  } catch (err) {
    mostrarMensaje('❌ ' + err.message, 'error');
  }
}

function volver() {
  document.getElementById('confirmar').classList.add('oculto');
  document.getElementById('formulario').classList.remove('oculto');
  document.getElementById('mensaje').style.display = 'none';
}
</script>

</body>
</html>
