<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Vehículos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0edff 0%, #c5dfff 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .contenedor {
      max-width: 950px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c5282;
      margin-bottom: 10px;
      font-size: 26px;
      font-weight: 800;
    }

    .subtitulo {
      text-align: center;
      color: #4a76a8;
      margin-bottom: 35px;
      font-size: 16px;
    }

    .grilla-tipos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    @media (min-width: 768px) {
      .grilla-tipos {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .tarjeta-tipo {
      background: #ffffff;
      border-radius: 18px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(44, 82, 130, 0.08);
    }

    .tarjeta-tipo:hover {
      transform: translateY(-4px);
      border-color: #3182ce;
      box-shadow: 0 8px 20px rgba(49, 130, 206, 0.15);
    }

    .tarjeta-tipo.seleccionado {
      border-color: #2b6cb0;
      background: #ebf4fb;
    }

    .tarjeta-tipo img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .tarjeta-tipo h3 {
      color: #2c5282;
      font-size: 16px;
      font-weight: 700;
    }

    .volver {
      display: inline-block;
      margin-top: 35px;
      color: #3182ce;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 18px;
      background: rgba(255,255,255,0.7);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .volver:hover {
      background: #dceaf5;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>🚘 Catálogo de Vehículos</h1>
    <p class="subtitulo">Elegí el tipo de vehículo que estás buscando</p>

    <div class="grilla-tipos">
      
      <div class="tarjeta-tipo" data-tipo="4x4" onclick="irAVehiculos('4x4')">
        <img src="imagenes/4x4.jpg" alt="4x4 / Todoterreno">
        <h3>⛰️ 4x4 / Todoterreno</h3>
      </div>

      <div class="tarjeta-tipo" data-tipo="Auto" onclick="irAVehiculos('Auto')">
        <img src="imagenes/auto.jpg" alt="Auto">
        <h3>🚗 Auto</h3>
      </div>

      <div class="tarjeta-tipo" data-tipo="Camioneta" onclick="irAVehiculos('Camioneta')">
        <img src="imagenes/camioneta.jpg" alt="Camioneta / Pick-up">
        <h3>🚙 Camioneta / Pick-up</h3>
      </div>

      <div class="tarjeta-tipo" data-tipo="Cuatriciclo" onclick="irAVehiculos('Cuatriciclo')">
        <img src="imagenes/cuatriciclo.jpg" alt="Cuatriciclo">
        <h3>🏍️ Cuatriciclo</h3>
      </div>

      <div class="tarjeta-tipo" data-tipo="Furgon" onclick="irAVehiculos('Furgon')">
        <img src="imagenes/furgon.jpg" alt="Furgón / Utilitario">
        <h3>📦 Furgón / Utilitario</h3>
      </div>

      <div class="tarjeta-tipo" data-tipo="SUV" onclick="irAVehiculos('SUV')">
        <img src="imagenes/suv.jpg" alt="SUV / Crossover">
        <h3>🏔️ SUV / Crossover</h3>
      </div>

      <div class="tarjeta-tipo" data-tipo="Moto" onclick="irAVehiculos('Moto')">
        <img src="imagenes/moto.jpg" alt="Moto">
        <h3>🏍️ Moto</h3>
      </div>

    </div>

    <a href="index.html" class="volver">← Volver al Inicio</a>
  </div>

  <script>
    function irAVehiculos(tipo) {
      document.querySelectorAll('.tarjeta-tipo').forEach(t => t.classList.remove('seleccionado'));
      event.currentTarget.classList.add('seleccionado');
      window.location.href = `ver-vehiculos.html?tipo=${encodeURIComponent(tipo)}`;
    }
  </script>

</body>
</html>
